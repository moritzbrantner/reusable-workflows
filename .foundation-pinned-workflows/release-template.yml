name: Release Template

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Failure or requested artifact name for this release job."
        value: ${{ jobs.release.outputs.artifact_name }}
      release_status:
        description: "Outcome of the release command step: success, failure, skipped, or cancelled."
        value: ${{ jobs.release.outputs.release_status }}
    inputs:
      release_type:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.14"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_release_command:
        required: false
        type: string
        default: ""
      validate_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      release_command:
        required: false
        type: string
        default: ""
      post_release_command:
        required: false
        type: string
        default: ""
      artifact_paths:
        required: false
        type: string
        default: ""
      upload_artifacts_on:
        required: false
        type: string
        default: "failure"
      artifact_retention_days:
        required: false
        type: number
        default: 14
      artifact_name_suffix:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 45
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      cache_cargo:
        required: false
        type: boolean
        default: false
      cargo_cache_dependency_path:
        required: false
        type: string
        default: "**/Cargo.lock"
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: false
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      release_token:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      release_status: ${{ steps.release-command.outcome }}
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-{2}-release', github.workflow, github.ref, inputs.release_type) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
      GITHUB_TOKEN: ${{ secrets.release_token || github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set artifact name
        id: artifact-name
        run: echo "name=release-${{ inputs.release_type }}-artifacts${{ inputs.artifact_name_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate artifact upload mode
        if: ${{ inputs.upload_artifacts_on != 'failure' && inputs.upload_artifacts_on != 'always' && inputs.upload_artifacts_on != 'never' }}
        run: |
          echo "::error::upload_artifacts_on must be one of: failure, always, never." >&2
          exit 1

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Cargo
        if: ${{ inputs.cache_cargo }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles(inputs.cargo_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run pre-release command
        if: ${{ inputs.pre_release_command != '' }}
        run: ${{ inputs.pre_release_command }}

      - name: Validate release
        if: ${{ inputs.validate_command != '' }}
        run: ${{ inputs.validate_command }}

      - name: Build release artifacts
        if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Run release command
        id: release-command
        if: ${{ inputs.release_command != '' }}
        run: ${{ inputs.release_command }}

      - name: Upload release artifacts
        if: ${{ inputs.artifact_paths != '' && (inputs.upload_artifacts_on == 'always' || (failure() && inputs.upload_artifacts_on == 'failure')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Run post-release command
        if: ${{ always() && inputs.post_release_command != '' }}
        run: ${{ inputs.post_release_command }}
