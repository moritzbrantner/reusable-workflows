name: External Pull

on:
  workflow_call:
    outputs:
      http_status:
        description: "HTTP status returned by the external pull endpoint."
        value: ${{ jobs.external-pull.outputs.http_status }}
    inputs:
      timeout_minutes:
        required: false
        type: number
        default: 10
      request_timeout_seconds:
        required: false
        type: number
        default: 30
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: true
    secrets:
      external_pull_url:
        required: true
      external_pull_token:
        required: true

jobs:
  external-pull:
    name: External Pull
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      http_status: ${{ steps.trigger.outputs.http_status }}
    permissions:
      contents: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-external-pull', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    steps:
      - name: Build pull payload
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_owner "$GITHUB_REPOSITORY_OWNER" \
            --arg repository_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg ref_name "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg actor "$GITHUB_ACTOR" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            '{
              repository: $repository,
              repository_owner: $repository_owner,
              repository_url: $repository_url,
              ref: $ref,
              ref_name: $ref_name,
              sha: $sha,
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_url: $run_url,
              actor: $actor,
              event_name: $event_name
            }' > payload.json

      - name: Trigger external pull
        id: trigger
        env:
          EXTERNAL_PULL_URL: ${{ secrets.external_pull_url }}
          EXTERNAL_PULL_TOKEN: ${{ secrets.external_pull_token }}
        run: |
          set +e
          http_status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request POST \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time "${{ inputs.request_timeout_seconds }}" \
              --header "Authorization: Bearer $EXTERNAL_PULL_TOKEN" \
              --header "Content-Type: application/json" \
              --header "User-Agent: moritzbrantner-reusable-workflows/external-pull" \
              --data @payload.json \
              "$EXTERNAL_PULL_URL"
          )"
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ]; then
            echo "http_status=000" >> "$GITHUB_OUTPUT"
            echo "::error::External pull request failed before receiving an HTTP response." >&2
            exit "$curl_status"
          fi

          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"

          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::External pull endpoint returned HTTP $http_status." >&2
            exit 1
          fi
