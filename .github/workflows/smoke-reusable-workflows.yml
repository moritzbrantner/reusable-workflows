name: Smoke Reusable Workflows

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "repository-pages/**"
      - "scripts/generate-workflow-manifest.ts"
      - "scripts/validate-workflow-contracts.ts"
      - "scripts/workflow-catalog-data.ts"
      - "src/app/workflowCatalog.ts"
      - "src/validate-workflow-contracts.test.ts"
      - "examples/validation-impact.json"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "repository-pages/**"
      - "scripts/generate-workflow-manifest.ts"
      - "scripts/validate-workflow-contracts.ts"
      - "scripts/workflow-catalog-data.ts"
      - "src/app/workflowCatalog.ts"
      - "src/validate-workflow-contracts.test.ts"
      - "examples/validation-impact.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    uses: ./.github/workflows/fast-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      command: "echo smoke fast validation"

  validation-impact:
    needs: fast-validation
    uses: ./.github/workflows/validation-impact.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest_path: examples/validation-impact.json

  validation-impact-result:
    needs: validation-impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify impact plan outputs
        env:
          CHANGED_FILES: ${{ needs.validation-impact.outputs.changed_files_json }}
          INVALIDATED_UNITS: ${{ needs.validation-impact.outputs.invalidated_units_json }}
          REUSABLE_UNITS: ${{ needs.validation-impact.outputs.reusable_units_json }}
          FULL_VALIDATION: ${{ needs.validation-impact.outputs.full_validation }}
          PLAN_DIGEST: ${{ needs.validation-impact.outputs.plan_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          for name in ("CHANGED_FILES", "INVALIDATED_UNITS", "REUSABLE_UNITS"):
              value = json.loads(os.environ[name])
              assert isinstance(value, list)

          assert os.environ["FULL_VALIDATION"] in {"true", "false"}
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["PLAN_DIGEST"])
          PY

  validation-evidence:
    needs: fast-validation
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validation-evidence.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      unit_name: contracts
      manifest_path: examples/validation-impact.json
      setup_command: "npm install --global bun@1.4.0"
      command: "echo smoke validation evidence"
      environment_identity: smoke-validation-evidence-v1
      reuse_across_runs: false
      artifact_retention_days: 1

  validation-evidence-reuse:
    needs: validation-evidence
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validation-evidence.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      unit_name: contracts
      manifest_path: examples/validation-impact.json
      setup_command: "npm install --global bun@1.4.0"
      command: "echo smoke validation evidence"
      environment_identity: smoke-validation-evidence-v1
      reuse_across_runs: true
      artifact_retention_days: 1

  validation-evidence-result:
    needs: validation-evidence-reuse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify validation evidence reuse
        env:
          REUSED: ${{ needs.validation-evidence-reuse.outputs.reused }}
          REUSE_REASON: ${{ needs.validation-evidence-reuse.outputs.reuse_reason }}
          FINGERPRINT_DIGEST: ${{ needs.validation-evidence-reuse.outputs.fingerprint_digest }}
          PRODUCER_RUN_ID: ${{ needs.validation-evidence-reuse.outputs.producer_run_id }}
          PRODUCER_SOURCE_SHA: ${{ needs.validation-evidence-reuse.outputs.producer_source_sha }}
          OUTCOME: ${{ needs.validation-evidence-reuse.outputs.outcome }}
        run: |
          set -euo pipefail
          test "$REUSED" = "true"
          test "$REUSE_REASON" = "verified-receipt"
          test "$OUTCOME" = "success"
          test -n "$PRODUCER_RUN_ID"
          [[ "$PRODUCER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FINGERPRINT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

  build-artifact:
    needs: fast-validation
    uses: ./.github/workflows/build-artifact.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: reusable-workflows-smoke-artifact-v1
      bun_version: "1.4.0"
      cache_bun: true
      cache_cargo: true
      cargo_tool_cache_key: smoke-cli-v1
      setup_command: "mkdir -p \"$CARGO_INSTALL_ROOT/bin\" && printf '#!/usr/bin/env bash\\necho cached-tool\\n' > \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && chmod +x \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && reusable-workflows-smoke-tool"
      build_command: "mkdir -p .artifacts/build-artifact-smoke && printf 'verified build artifact\n' > .artifacts/build-artifact-smoke/artifact.txt"
      artifact_paths: .artifacts/build-artifact-smoke/artifact.txt
      reuse_across_runs: true
      artifact_retention_days: 1

  build-artifact-reuse:
    needs: build-artifact
    uses: ./.github/workflows/build-artifact.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: reusable-workflows-smoke-artifact-v1
      bun_version: "1.4.0"
      cache_bun: true
      cache_cargo: true
      cargo_tool_cache_key: smoke-cli-v1
      setup_command: "mkdir -p \"$CARGO_INSTALL_ROOT/bin\" && printf '#!/usr/bin/env bash\\necho cached-tool\\n' > \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && chmod +x \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && reusable-workflows-smoke-tool"
      build_command: "mkdir -p .artifacts/build-artifact-smoke && printf 'verified build artifact\n' > .artifacts/build-artifact-smoke/artifact.txt"
      artifact_paths: .artifacts/build-artifact-smoke/artifact.txt
      reuse_across_runs: true
      artifact_retention_days: 1

  consume-build-artifact:
    needs: build-artifact-reuse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify resolver reused the existing build
        env:
          REUSED: ${{ needs.build-artifact-reuse.outputs.reused }}
        run: test "$REUSED" = "true"
      - name: Consume exact build artifact
        uses: ./.github/actions/consume-build-artifact
        with:
          producer_run_id: ${{ needs.build-artifact-reuse.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-artifact-reuse.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-artifact-reuse.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-artifact-reuse.outputs.artifact_digest }}
          source_sha: ${{ needs.build-artifact-reuse.outputs.source_sha }}
          artifact_key: ${{ needs.build-artifact-reuse.outputs.artifact_key }}
          identity_digest: ${{ needs.build-artifact-reuse.outputs.identity_digest }}
          destination_path: .artifacts/consumed-build-artifact
          github_token: ${{ github.token }}
      - name: Verify consumed bytes
        run: test "$(cat .artifacts/consumed-build-artifact/artifact.txt)" = "verified build artifact"

  command-validation:
    needs: fast-validation
    uses: ./.github/workflows/command-validation.yml
    with:
      setup_command: "npm install --global bun@1.4.0 && echo smoke generic bootstrap"
      command: "echo smoke generic validation"
      artifact_retention_days: 1

  command-validation-second:
    needs: fast-validation
    uses: ./.github/workflows/command-validation.yml
    with:
      setup_command: "npm install --global bun@1.4.0"
      command: "echo smoke second generic validation"
      artifact_retention_days: 1

  public-contract-validation:
    needs: fast-validation
    uses: ./.github/workflows/public-contract-validation.yml

  repository-pages-build:
    needs: fast-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install repository Pages dependencies
        working-directory: repository-pages
        run: bun install
      - name: Build repository Pages static export
        working-directory: repository-pages
        env:
          NEXT_PUBLIC_REPOSITORY: moritzbrantner/reusable-workflows
          NEXT_PUBLIC_BASE_PATH: /reusable-workflows
        run: bun run build

  integration-validation:
    needs: fast-validation
    uses: ./.github/workflows/integration-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      integration_command: "echo smoke integration"
      migration_command: "echo smoke migration"
      package_check_command: "echo smoke package"
      artifact_paths: ""

  e2e-validation:
    needs: fast-validation
    uses: ./.github/workflows/e2e-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      install_playwright: false
      e2e_command: "echo smoke e2e"
      artifact_paths: ""

  storybook-validation:
    needs: fast-validation
    uses: ./.github/workflows/storybook-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      storybook_build_command: "echo smoke storybook build"
      storybook_test_command: "echo smoke storybook test"
      accessibility_command: "echo smoke accessibility"
      visual_command: "echo smoke visual"
      artifact_paths: ""

  link-validation:
    needs: fast-validation
    uses: ./.github/workflows/link-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      link_check_command: "echo smoke links"
      artifact_paths: ""

  performance-validation:
    needs: fast-validation
    uses: ./.github/workflows/performance-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: "echo smoke performance build"
      unlighthouse_command: "echo smoke unlighthouse"
      benchmark_command: "mkdir -p benchmark-results && { echo '# Smoke Benchmark Summary'; echo; echo 'smoke benchmark'; } > benchmark-results/smoke.md"
      bundle_size_command: "echo smoke bundle"
      api_report_command: "echo smoke api"
      summary_paths: benchmark-results/smoke.md
      artifact_paths: ""

  stage-validation:
    needs: fast-validation
    uses: ./.github/workflows/stage-validation.yml
    with:
      stage: develop
      node_version: ""
      bun_version: ""
      install_command: ""
      develop_command: "echo smoke develop"
      artifact_paths: ""

  validate-repo:
    needs: fast-validation
    uses: ./.github/workflows/validate-repo.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      format_command: "echo smoke format"
      lint_command: "echo smoke lint"
      typecheck_command: "echo smoke typecheck"
      test_command: "echo smoke test"
      build_command: "echo smoke build"
      e2e_command: "echo smoke e2e"
      artifact_paths: ""

  release-qualification:
    needs: fast-validation
    uses: ./.github/workflows/release-qualification.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      setup_command: "npm install --global bun@1.4.0"
      qualification_command: "echo smoke release qualification"
      build_command: "mkdir -p .artifacts/release-qualification-smoke && echo qualified > .artifacts/release-qualification-smoke/artifact.txt"
      artifact_paths: .artifacts/release-qualification-smoke/artifact.txt
      artifact_retention_days: 1

  artifact-promotion:
    needs: release-qualification
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: ./.github/workflows/artifact-promotion.yml
    with:
      qualification_run_id: ${{ github.run_id }}
      qualification_receipt_artifact_name: ${{ needs.release-qualification.outputs.receipt_artifact_name }}
      artifact_retention_days: 1

  release-template:
    needs: fast-validation
    uses: ./.github/workflows/release-template.yml
    with:
      release_type: smoke
      node_version: ""
      bun_version: ""
      install_command: ""
      validate_command: "echo smoke release validate"
      build_command: "echo smoke release build"
      release_command: ""
      artifact_paths: ""

  package-publish-npm:
    needs:
      - fast-validation
      - build-artifact-reuse
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/package-publish.yml
    with:
      package_manager: npm
      node_version: ""
      bun_version: ""
      install_command: ""
      publish_enabled: false
      prebuilt_artifact_run_id: ${{ needs.build-artifact-reuse.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-artifact-reuse.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-artifact-reuse.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-artifact-reuse.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-artifact-reuse.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-artifact-reuse.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-artifact-reuse.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/package-publish-smoke
      validate_command: "exit 91"
      build_command: "exit 92"
      artifact_paths: ""

  package-publish-cargo:
    needs: fast-validation
    uses: ./.github/workflows/package-publish.yml
    with:
      package_manager: cargo
      rust_toolchain: ""
      cache_cargo: false
      install_command: ""
      publish_enabled: false
      validate_command: "echo smoke cargo package validate"
      build_command: "echo smoke cargo package build"
      artifact_paths: ""
