name: Smoke Reusable Workflows

on:
  push:
    paths:
      - ".github/workflows/**"
      - "repository-pages/**"
      - "scripts/generate-workflow-manifest.ts"
      - "scripts/validate-workflow-contracts.ts"
      - "scripts/workflow-catalog-data.ts"
      - "src/app/workflowCatalog.ts"
      - "src/validate-workflow-contracts.test.ts"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "repository-pages/**"
      - "scripts/generate-workflow-manifest.ts"
      - "scripts/validate-workflow-contracts.ts"
      - "scripts/workflow-catalog-data.ts"
      - "src/app/workflowCatalog.ts"
      - "src/validate-workflow-contracts.test.ts"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    uses: ./.github/workflows/fast-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      command: "echo smoke fast validation"

  public-contract-validation:
    needs: fast-validation
    uses: ./.github/workflows/public-contract-validation.yml

  repository-pages-build:
    needs: fast-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install repository Pages dependencies
        working-directory: repository-pages
        run: bun install
      - name: Build repository Pages static export
        working-directory: repository-pages
        env:
          NEXT_PUBLIC_REPOSITORY: moritzbrantner/reusable-workflows
          NEXT_PUBLIC_BASE_PATH: /reusable-workflows
        run: bun run build

  integration-validation:
    needs: fast-validation
    uses: ./.github/workflows/integration-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      integration_command: "echo smoke integration"
      migration_command: "echo smoke migration"
      package_check_command: "echo smoke package"
      artifact_paths: ""

  e2e-validation:
    needs: fast-validation
    uses: ./.github/workflows/e2e-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      install_playwright: false
      e2e_command: "echo smoke e2e"
      artifact_paths: ""

  storybook-validation:
    needs: fast-validation
    uses: ./.github/workflows/storybook-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      storybook_build_command: "echo smoke storybook build"
      storybook_test_command: "echo smoke storybook test"
      accessibility_command: "echo smoke accessibility"
      visual_command: "echo smoke visual"
      artifact_paths: ""

  link-validation:
    needs: fast-validation
    uses: ./.github/workflows/link-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      link_check_command: "echo smoke links"
      artifact_paths: ""

  performance-validation:
    needs: fast-validation
    uses: ./.github/workflows/performance-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: "echo smoke performance build"
      unlighthouse_command: "echo smoke unlighthouse"
      benchmark_command: "mkdir -p benchmark-results && { echo '# Smoke Benchmark Summary'; echo; echo 'smoke benchmark'; } > benchmark-results/smoke.md"
      bundle_size_command: "echo smoke bundle"
      api_report_command: "echo smoke api"
      summary_paths: benchmark-results/smoke.md
      artifact_paths: ""

  stage-validation:
    needs: fast-validation
    uses: ./.github/workflows/stage-validation.yml
    with:
      stage: develop
      node_version: ""
      bun_version: ""
      install_command: ""
      develop_command: "echo smoke develop"
      artifact_paths: ""

  validate-repo:
    needs: fast-validation
    uses: ./.github/workflows/validate-repo.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      format_command: "echo smoke format"
      lint_command: "echo smoke lint"
      typecheck_command: "echo smoke typecheck"
      test_command: "echo smoke test"
      build_command: "echo smoke build"
      e2e_command: "echo smoke e2e"
      artifact_paths: ""

  release-template:
    needs: fast-validation
    uses: ./.github/workflows/release-template.yml
    with:
      release_type: smoke
      node_version: ""
      bun_version: ""
      install_command: ""
      validate_command: "echo smoke release validate"
      build_command: "echo smoke release build"
      release_command: ""
      artifact_paths: ""

  package-publish-npm:
    needs: fast-validation
    uses: ./.github/workflows/package-publish.yml
    with:
      package_manager: npm
      node_version: ""
      bun_version: ""
      install_command: ""
      publish_enabled: false
      validate_command: "echo smoke npm package validate"
      build_command: "echo smoke npm package build"
      artifact_paths: ""

  package-publish-cargo:
    needs: fast-validation
    uses: ./.github/workflows/package-publish.yml
    with:
      package_manager: cargo
      rust_toolchain: ""
      cache_cargo: false
      install_command: ""
      publish_enabled: false
      validate_command: "echo smoke cargo package validate"
      build_command: "echo smoke cargo package build"
      artifact_paths: ""
