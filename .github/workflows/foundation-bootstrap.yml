name: Foundation Bootstrap

on:
  push:
    branches:
      - chore/foundation-conformance

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/foundation-conformance
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Check out coding-tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/coding-tooling
          ref: 4524918dc26ad9eec85df43c7c11fb08aca6d054
          path: .tooling/coding-tooling

      - name: Check out coding-agent-conventions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 8965e9274ec214146bfb18ed9ca1f8586b0617b8
          path: .tooling/coding-agent-conventions

      - name: Install coding-tooling dependencies
        working-directory: .tooling/coding-tooling
        run: bun install --frozen-lockfile

      - name: Materialize convention snapshot
        env:
          CODING_AGENT_CONVENTIONS_ROOT: ${{ github.workspace }}/.tooling/coding-agent-conventions
        run: bun .tooling/coding-tooling/src/cli.ts conventions update

      - name: Document repository environment variables
        run: |
          cat > .env.example <<'EOF'
          # Local/CI overrides used by repository tooling. Keep this file secret-free.
          FORCE_COLOR=
          NO_COLOR=
          UNLIGHTHOUSE_PORT=4179
          UNLIGHTHOUSE_SITE=http://127.0.0.1:4179
          METRICS_HISTORY_URL=
          NEXT_PUBLIC_REPOSITORY=moritzbrantner/reusable-workflows
          NEXT_PUBLIC_BASE_PATH=
          EOF

      - name: Stage immutable workflow copies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "actions/checkout@v6": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6",
              "oven-sh/setup-bun@v2": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2",
              "actions/setup-node@v6": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6",
              "actions/cache@v5": "actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5",
              "actions/upload-artifact@v7": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7",
              "actions/configure-pages@v6": "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6",
              "actions/upload-pages-artifact@v5": "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5",
              "actions/deploy-pages@v5": "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5",
          }
          destination = Path(".foundation-pinned-workflows")
          destination.mkdir(exist_ok=True)
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              if path.name == "foundation-bootstrap.yml":
                  continue
              source = path.read_text()
              for old, new in replacements.items():
                  source = source.replace(old, new)
              (destination / path.name).write_text(source)
          PY

      - name: Harden package publish Rust toolchain input
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".foundation-pinned-workflows/package-publish.yml")
          source = path.read_text()
          old_default = '''      rust_toolchain:
                  required: false
                  type: string
                  default: "stable"
          '''
          new_default = '''      rust_toolchain:
                  description: Exact Rust toolchain version for Cargo publication. Empty skips Rust setup.
                  required: false
                  type: string
                  default: ""
          '''
          if old_default not in source:
              raise SystemExit("rust_toolchain input anchor not found")
          source = source.replace(old_default, new_default, 1)

          anchor = '''      - name: Set up Bun
                  if: ${{ inputs.bun_version != '' }}
          '''
          validation = '''      - name: Validate Rust toolchain
                  if: ${{ inputs.package_manager == 'cargo' && inputs.rust_toolchain != '' }}
                  env:
                    RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
                  run: |
                    if [[ ! "$RUST_TOOLCHAIN" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
                      echo "::error::rust_toolchain must be an exact semantic version such as 1.95.0, or empty to skip Rust setup." >&2
                      exit 2
                    fi

                - name: Set up Bun
                  if: ${{ inputs.bun_version != '' }}
          '''
          if anchor not in source:
              raise SystemExit("Set up Bun anchor not found")
          source = source.replace(anchor, validation, 1)
          path.write_text(source)
          PY

      - name: Align Oxlint with convention enforcement
        run: bun add --dev oxlint@1.80.0 oxlint-tsgolint@7.0.2001

      - name: Normalize TypeScript type definitions
        run: |
          cat > /tmp/ts-003.json <<'EOF'
          {
            "plugins": ["typescript"],
            "rules": {
              "typescript/consistent-type-definitions": ["error", "type"]
            }
          }
          EOF
          bunx oxlint --config /tmp/ts-003.json --fix repository-pages/app/page.tsx
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/metricsCatalog.ts")
          source = path.read_text()
          old = "declare global {\n  interface Window {"
          new = "declare global {\n  // oxlint-disable-next-line typescript/consistent-type-definitions -- Window augmentation requires declaration merging.\n  interface Window {"
          if new not in source:
              if old not in source:
                  raise SystemExit("Window augmentation anchor not found")
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY

      - name: Verify environment entrypoint
        run: bash scripts/codex-environment.sh setup

      - name: Move tooling outside repository tree
        run: |
          rm -rf "$RUNNER_TEMP/coding-tooling" "$RUNNER_TEMP/coding-agent-conventions"
          cp -a .tooling/coding-tooling "$RUNNER_TEMP/coding-tooling"
          cp -a .tooling/coding-agent-conventions "$RUNNER_TEMP/coding-agent-conventions"
          rm -rf .tooling

      - name: Verify installed conventions
        env:
          CODING_AGENT_CONVENTIONS_ROOT: ${{ runner.temp }}/coding-agent-conventions
        run: bun "$RUNNER_TEMP/coding-tooling/src/cli.ts" conventions check

      - name: Verify repository conformance
        id: conformance
        continue-on-error: true
        env:
          CODING_AGENT_CONVENTIONS_ROOT: ${{ runner.temp }}/coding-agent-conventions
        run: bun "$RUNNER_TEMP/coding-tooling/src/cli.ts" conformance --json

      - name: Commit generated foundation files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conventions.lock.json .conventions .env.example .foundation-pinned-workflows package.json bun.lock repository-pages/app/page.tsx src/app/metricsCatalog.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: materialize repository foundation"
          git push origin HEAD:chore/foundation-conformance

      - name: Require clean conformance
        if: ${{ steps.conformance.outcome != 'success' }}
        run: exit 1
