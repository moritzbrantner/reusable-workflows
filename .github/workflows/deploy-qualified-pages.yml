name: Deploy Qualified Pages

on:
  workflow_call:
    inputs:
      promotion_run_id:
        description: Workflow run ID that produced a successful artifact-promotion receipt.
        required: true
        type: string
      promotion_receipt_artifact_name:
        description: Execution receipt artifact emitted by artifact-promotion.yml.
        required: true
        type: string
      timeout_minutes:
        description: Maximum deployment job runtime.
        required: false
        type: number
        default: 15
      concurrency_group:
        description: Optional caller-selected Pages deployment concurrency group.
        required: false
        type: string
        default: ""
      cancel_in_progress:
        description: Whether a newer deployment cancels an in-progress deployment in the same group.
        required: false
        type: boolean
        default: false
    outputs:
      page_url:
        description: The deployed GitHub Pages URL.
        value: ${{ jobs.deploy-qualified-pages.outputs.page_url }}
      source_sha:
        description: Exact qualified source SHA deployed to Pages.
        value: ${{ jobs.deploy-qualified-pages.outputs.source_sha }}
      artifact_name:
        description: Exact qualified artifact deployed to Pages.
        value: ${{ jobs.deploy-qualified-pages.outputs.artifact_name }}
      artifact_digest:
        description: SHA-256 digest of the exact qualified artifact archive deployed to Pages.
        value: ${{ jobs.deploy-qualified-pages.outputs.artifact_digest }}

jobs:
  deploy-qualified-pages:
    name: Deploy Qualified Pages
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
      pages: write
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-deploy-qualified-pages', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      source_sha: ${{ steps.promotion.outputs.source_sha }}
      artifact_name: ${{ steps.promotion.outputs.artifact_name }}
      artifact_digest: ${{ steps.promotion.outputs.artifact_digest }}
    steps:
      - name: Validate promotion coordinates
        id: coordinates
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RECEIPT_ARTIFACT_NAME: ${{ inputs.promotion_receipt_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$PROMOTION_RECEIPT_ARTIFACT_NAME"

      - name: Download promotion receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.promotion_receipt_artifact_name }}
          path: .artifacts/reusable-workflows/promotion-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promotion_run_id }}
          digest-mismatch: error

      - name: Validate promotion receipt
        id: promotion
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          RECEIPT_DIRECTORY: .artifacts/reusable-workflows/promotion-receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          directory = Path(os.environ["RECEIPT_DIRECTORY"])
          paths = list(directory.rglob("artifact-promotion-receipt.json"))
          assert len(paths) == 1, paths
          receipt = json.loads(paths[0].read_text(encoding="utf-8"))
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "artifact-promotion", "interfaceVersion": 1}
          assert receipt["result"]["outcome"] == "success"
          assert receipt["run"]["id"] == os.environ["PROMOTION_RUN_ID"]
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])

          artifacts = [entry for entry in receipt["evidence"] if entry["role"] == "qualified-artifact"]
          assert len(artifacts) == 1, artifacts
          artifact = artifacts[0]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])

          upstream = [entry for entry in receipt.get("upstream", []) if entry["role"] == "release-qualification"]
          assert len(upstream) == 1, upstream
          qualification = upstream[0]
          assert qualification["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert re.fullmatch(r"[0-9]+", qualification["runId"])

          attestations = [entry for entry in receipt.get("attestations", []) if entry["role"] == "artifact-provenance"]
          assert len(attestations) == 1, attestations
          attestation = attestations[0]
          assert attestation["subjectName"] == artifact["name"]
          assert attestation["subjectDigest"] == artifact["digest"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"source_sha={receipt['source']['sha']}\n")
              handle.write(f"artifact_name={artifact['name']}\n")
              handle.write(f"artifact_digest={artifact['digest']}\n")
              handle.write(f"qualification_run_id={qualification['runId']}\n")
              handle.write(f"predicate_type={attestation['predicateType']}\n")
          PY

      - name: Resolve exact qualified artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.promotion.outputs.qualification_run_id }}
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.promotion.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/qualification-artifacts.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("qualification-artifacts.json").read_text())
          matches = [artifact for artifact in payload.get("artifacts", []) if artifact.get("name") == os.environ["ARTIFACT_NAME"]]
          assert len(matches) == 1, matches
          artifact = matches[0]
          assert artifact.get("expired") is False, artifact
          assert artifact.get("digest") == os.environ["ARTIFACT_DIGEST"], artifact
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"id={artifact['id']}\n")
          PY

      - name: Download original qualified artifact archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: .artifacts/reusable-workflows/qualified-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.promotion.outputs.qualification_run_id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Verify qualified archive and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.promotion.outputs.qualification_run_id }}
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.promotion.outputs.artifact_digest }}
          PREDICATE_TYPE: ${{ steps.promotion.outputs.predicate_type }}
          ARCHIVE_DIRECTORY: .artifacts/reusable-workflows/qualified-pages
        shell: bash
        run: |
          set -euo pipefail
          archive="$ARCHIVE_DIRECTORY/$ARTIFACT_NAME.zip"
          test -f "$archive"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-qualification.yml" \
            --predicate-type "$PREDICATE_TYPE" \
            --format json > "$RUNNER_TEMP/pages-attestation-verification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("pages-attestation-verification.json").read_text())
          expected_hex = os.environ["ARTIFACT_DIGEST"].split(":", 1)[1]
          for item in payload:
              statement = item.get("verificationResult", {}).get("statement", {})
              if statement.get("predicateType") != os.environ["PREDICATE_TYPE"]:
                  continue
              if not any(
                  subject.get("name") == os.environ["ARTIFACT_NAME"]
                  and subject.get("digest", {}).get("sha256") == expected_hex
                  for subject in statement.get("subject", [])
              ):
                  continue
              predicate = statement.get("predicate", {})
              if (
                  predicate.get("source", {}).get("sha") == os.environ["SOURCE_SHA"]
                  and predicate.get("artifact", {}).get("digest") == os.environ["ARTIFACT_DIGEST"]
                  and str(predicate.get("qualification", {}).get("runId")) == os.environ["QUALIFICATION_RUN_ID"]
              ):
                  break
          else:
              raise AssertionError(payload)
          PY

      - name: Extract Pages-ready artifact safely
        env:
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARCHIVE_DIRECTORY: .artifacts/reusable-workflows/qualified-pages
          SITE_DIRECTORY: .artifacts/reusable-workflows/pages-site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_DIRECTORY"]) / f"{os.environ['ARTIFACT_NAME']}.zip"
          site = Path(os.environ["SITE_DIRECTORY"])
          shutil.rmtree(site, ignore_errors=True)
          site.mkdir(parents=True)
          root = site.resolve()
          with zipfile.ZipFile(archive) as handle:
              for info in handle.infolist():
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute(), info.filename
                  assert ".." not in path.parts, info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16), info.filename
                  target = (site / Path(*path.parts)).resolve()
                  assert target == root or root in target.parents, info.filename
              handle.extractall(site)
          assert (site / "index.html").is_file(), "qualified Pages artifact must contain index.html at archive root"
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload exact qualified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .artifacts/reusable-workflows/pages-site

      - name: Deploy exact qualified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
