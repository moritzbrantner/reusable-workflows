name: Validation Evidence

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character consumer source commit SHA to validate.
        required: true
        type: string
      unit_name:
        description: Consumer-owned validation unit declared in the validation impact manifest.
        required: true
        type: string
      manifest_path:
        description: Repository-relative validation impact manifest.
        required: false
        type: string
        default: ".github/validation-impact.json"
      working_directory:
        description: Repository-relative directory in which setup and validation commands run.
        required: false
        type: string
        default: "."
      setup_command:
        description: Optional repository-owned bootstrap/setup command.
        required: false
        type: string
        default: ""
      command:
        description: Repository-owned validation command.
        required: true
        type: string
      environment_identity:
        description: Optional caller-owned opaque toolchain/environment identity included in the fingerprint.
        required: false
        type: string
        default: ""
      reuse_across_runs:
        description: Explicitly opt in to reusing a retained successful receipt only when its full validation fingerprint matches.
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: Maximum validation job runtime.
        required: false
        type: number
        default: 20
      artifact_retention_days:
        description: Retention period for newly produced execution receipts.
        required: false
        type: number
        default: 7
    outputs:
      producer_run_id:
        description: Workflow run that produced the reused or newly executed successful validation receipt.
        value: ${{ jobs.validation-evidence.outputs.producer_run_id }}
      producer_source_sha:
        description: Exact source SHA validated by the reused or newly produced receipt.
        value: ${{ jobs.validation-evidence.outputs.producer_source_sha }}
      receipt_artifact_name:
        description: Name of the reused or newly uploaded execution receipt artifact.
        value: ${{ jobs.validation-evidence.outputs.receipt_artifact_name }}
      receipt_path:
        description: Repository-relative execution receipt path.
        value: ${{ jobs.validation-evidence.outputs.receipt_path }}
      fingerprint_digest:
        description: Proven validation fingerprint digest, or empty when fingerprinting was unavailable.
        value: ${{ jobs.validation-evidence.outputs.fingerprint_digest }}
      reused:
        description: Whether validation execution was skipped using a verified prior successful receipt.
        value: ${{ jobs.validation-evidence.outputs.reused }}
      reuse_reason:
        description: Auditable reason for reuse or execution.
        value: ${{ jobs.validation-evidence.outputs.reuse_reason }}
      outcome:
        description: Final validation-evidence capability outcome.
        value: ${{ jobs.validation-evidence.outputs.outcome }}

jobs:
  validation-evidence:
    name: Validation Evidence
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    outputs:
      producer_run_id: ${{ steps.result.outputs.producer_run_id }}
      producer_source_sha: ${{ steps.result.outputs.producer_source_sha }}
      receipt_artifact_name: ${{ steps.result.outputs.receipt_artifact_name }}
      receipt_path: ${{ steps.metadata.outputs.receipt_path }}
      fingerprint_digest: ${{ steps.fingerprint.outputs.fingerprint_digest }}
      reused: ${{ steps.result.outputs.reused }}
      reuse_reason: ${{ steps.reuse-status.outputs.reason }}
      outcome: ${{ steps.result.outputs.outcome }}
    steps:
      - name: Validate exact source coordinates
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          UNIT_NAME: ${{ inputs.unit_name }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be an exact 40-character commit SHA." >&2
            exit 1
          fi
          if [[ ! "$UNIT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::unit_name contains unsupported characters." >&2
            exit 1
          fi

      - name: Check out exact consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify checked-out commit
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(printf '%s' "$SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"

      - name: Resolve runner image identity
        id: runner-image
        working-directory: .
        run: |
          set -euo pipefail
          identity=""
          if [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]]; then
            identity="${ImageOS}@${ImageVersion}"
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Resolve exact reusable-workflow identity
        id: workflow-source
        working-directory: .
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          job = json.loads(os.environ["JOB_CONTEXT"])
          repository = job.get("workflow_repository", "")
          sha = job.get("workflow_sha", "")
          if not repository or not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("Reusable workflow identity is unavailable.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={repository}\n")
              output.write(f"sha={sha.lower()}\n")
          PY

      - name: Reserve reusable-workflow source path
        working-directory: .
        run: |
          set -euo pipefail
          test ! -e .reusable-workflows-source

      - name: Check out exact reusable-workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.sha }}
          path: .reusable-workflows-source
          persist-credentials: false

      - name: Resolve validation evidence fingerprint
        id: fingerprint
        uses: ./.reusable-workflows-source/.github/actions/resolve-validation-evidence
        with:
          source_sha: ${{ inputs.source_sha }}
          unit_name: ${{ inputs.unit_name }}
          manifest_path: ${{ inputs.manifest_path }}
          working_directory: ${{ inputs.working_directory }}
          setup_command: ${{ inputs.setup_command }}
          command: ${{ inputs.command }}
          environment_identity: ${{ inputs.environment_identity }}
          capability_identity: ${{ format('{0}@{1}', steps.workflow-source.outputs.repository, steps.workflow-source.outputs.sha) }}
          runner_image_identity: ${{ steps.runner-image.outputs.identity }}

      - name: Remove reusable-workflow source
        if: ${{ always() }}
        working-directory: .
        run: rm -rf -- .reusable-workflows-source

      - name: Define validation evidence metadata
        id: metadata
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          UNIT_NAME: ${{ inputs.unit_name }}
          FINGERPRINT_DIGEST: ${{ steps.fingerprint.outputs.fingerprint_digest }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          fingerprint_hash="${FINGERPRINT_DIGEST#sha256:}"
          short_fingerprint="${fingerprint_hash:0:12}"
          if [[ -z "$short_fingerprint" ]]; then
            short_fingerprint=unavailable
          fi
          {
            echo "receipt_prefix=execution-receipt-validation-evidence-${UNIT_NAME}-${short_fingerprint}-"
            echo "receipt_artifact_name=execution-receipt-validation-evidence-${UNIT_NAME}-${short_fingerprint}-${short_sha}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "receipt_path=.artifacts/reusable-workflows/validation-evidence-receipt.json"
          } >> "$GITHUB_OUTPUT"

      - name: Find reusable validation receipt
        id: reuse-candidate
        if: ${{ inputs.reuse_across_runs && steps.fingerprint.outputs.fingerprint_available == 'true' }}
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_PREFIX: ${{ steps.metadata.outputs.receipt_prefix }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp             "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             > "$RUNNER_TEMP/validation-evidence-reuse-candidates.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pages = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("validation-evidence-reuse-candidates.json")
              .read_text(encoding="utf-8")
          )
          pages = pages if isinstance(pages, list) else [pages]
          artifacts = [
              artifact
              for page in pages
              for artifact in page.get("artifacts", [])
          ]
          prefix = os.environ["RECEIPT_PREFIX"]
          candidates = []
          for artifact in artifacts:
              if artifact.get("expired") is not False:
                  continue
              name = artifact.get("name") or ""
              if not name.startswith(prefix):
                  continue
              workflow_run = artifact.get("workflow_run") or {}
              run_id = workflow_run.get("id")
              artifact_id = artifact.get("id")
              if not isinstance(run_id, int) or not isinstance(artifact_id, int):
                  continue
              candidates.append(artifact)

          candidates.sort(
              key=lambda artifact: (
                  artifact.get("created_at") or "",
                  artifact.get("id") or 0,
              ),
              reverse=True,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if not candidates:
                  output.write("candidate_found=false\n")
              else:
                  candidate = candidates[0]
                  output.write("candidate_found=true\n")
                  output.write(f"receipt_artifact_id={candidate['id']}\n")
                  output.write(f"receipt_artifact_name={candidate['name']}\n")
                  output.write(f"producer_run_id={candidate['workflow_run']['id']}\n")
          PY

      - name: Download reusable validation receipt
        id: reuse-receipt-download
        if: ${{ steps.reuse-candidate.outcome == 'success' && steps.reuse-candidate.outputs.candidate_found == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.reuse-candidate.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/validation-evidence-reuse-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reuse-candidate.outputs.producer_run_id }}
          digest-mismatch: error

      - name: Verify reusable validation receipt
        id: reuse
        if: ${{ steps.reuse-receipt-download.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_DIRECTORY: ${{ runner.temp }}/validation-evidence-reuse-receipt
          RECEIPT_ARTIFACT_ID: ${{ steps.reuse-candidate.outputs.receipt_artifact_id }}
          RECEIPT_ARTIFACT_NAME: ${{ steps.reuse-candidate.outputs.receipt_artifact_name }}
          PRODUCER_RUN_ID: ${{ steps.reuse-candidate.outputs.producer_run_id }}
          UNIT_NAME: ${{ inputs.unit_name }}
          FINGERPRINT_DIGEST: ${{ steps.fingerprint.outputs.fingerprint_digest }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp             "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/artifacts?per_page=100"             > "$RUNNER_TEMP/validation-evidence-producer-artifacts.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt_paths = list(
              Path(os.environ["RECEIPT_DIRECTORY"]).rglob("validation-evidence-receipt.json")
          )
          assert len(receipt_paths) == 1, receipt_paths
          receipt = json.loads(receipt_paths[0].read_text(encoding="utf-8"))

          expected_fingerprint = os.environ["FINGERPRINT_DIGEST"].lower()
          producer_run_id = os.environ["PRODUCER_RUN_ID"]
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "validation-evidence", "interfaceVersion": 1}
          assert receipt["source"]["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])
          assert receipt["result"]["outcome"] == "success"
          assert str(receipt["run"]["id"]) == producer_run_id

          fingerprints = [
              entry
              for entry in receipt["evidence"]
              if entry.get("role") == "validation-fingerprint"
          ]
          assert len(fingerprints) == 1, fingerprints
          fingerprint = fingerprints[0]
          assert fingerprint["name"] == os.environ["UNIT_NAME"]
          assert fingerprint["digest"].lower() == expected_fingerprint
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", expected_fingerprint)

          pages = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("validation-evidence-producer-artifacts.json")
              .read_text(encoding="utf-8")
          )
          pages = pages if isinstance(pages, list) else [pages]
          producer_artifacts = [
              item for page in pages for item in page.get("artifacts", [])
          ]
          receipt_matches = [
              item
              for item in producer_artifacts
              if str(item.get("id")) == os.environ["RECEIPT_ARTIFACT_ID"]
              and item.get("name") == os.environ["RECEIPT_ARTIFACT_NAME"]
              and item.get("expired") is False
          ]
          assert len(receipt_matches) == 1, receipt_matches

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("hit=true\n")
              output.write(f"producer_run_id={producer_run_id}\n")
              output.write(f"producer_source_sha={receipt['source']['sha']}\n")
              output.write(f"receipt_artifact_name={os.environ['RECEIPT_ARTIFACT_NAME']}\n")
          PY

      - name: Resolve reuse reason
        id: reuse-status
        if: ${{ always() }}
        working-directory: .
        env:
          REUSE_ENABLED: ${{ inputs.reuse_across_runs }}
          FINGERPRINT_AVAILABLE: ${{ steps.fingerprint.outputs.fingerprint_available }}
          FINGERPRINT_REASON: ${{ steps.fingerprint.outputs.reason }}
          LOOKUP_OUTCOME: ${{ steps.reuse-candidate.outcome }}
          CANDIDATE_FOUND: ${{ steps.reuse-candidate.outputs.candidate_found }}
          DOWNLOAD_OUTCOME: ${{ steps.reuse-receipt-download.outcome }}
          VERIFY_OUTCOME: ${{ steps.reuse.outcome }}
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_ENABLED" != "true" ]]; then
            reason=reuse-disabled
          elif [[ "$FINGERPRINT_AVAILABLE" != "true" ]]; then
            reason="$FINGERPRINT_REASON"
          elif [[ "$LOOKUP_OUTCOME" != "success" ]]; then
            reason=candidate-lookup-failed
          elif [[ "$CANDIDATE_FOUND" != "true" ]]; then
            reason=candidate-not-found
          elif [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            reason=candidate-download-failed
          elif [[ "$VERIFY_OUTCOME" == "success" && "$REUSE_HIT" == "true" ]]; then
            reason=verified-receipt
          else
            reason=candidate-verification-failed
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Detect environment-v1 declaration
        id: environment
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        working-directory: .
        run: |
          set -euo pipefail
          detected=false
          if [[ -f .repository-environment.toml && -f scripts/codex-environment.sh ]]; then
            detected=true
          fi
          echo "detected=$detected" >> "$GITHUB_OUTPUT"

      - name: Run repository bootstrap
        id: bootstrap
        if: ${{ steps.reuse.outputs.hit != 'true' && inputs.setup_command != '' }}
        continue-on-error: true
        run: ${{ inputs.setup_command }}

      - name: Run standard environment-v1 setup
        id: environment-setup
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.environment.outputs.detected == 'true' && (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped') }}
        continue-on-error: true
        working-directory: .
        run: bash scripts/codex-environment.sh setup

      - name: Verify environment-v1 preserves tracked state
        id: environment-state
        if: ${{ steps.environment-setup.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Run repository validation
        id: command
        if: ${{ steps.reuse.outputs.hit != 'true' && (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped') && (steps.environment-setup.outcome == 'success' || steps.environment-setup.outcome == 'skipped') && (steps.environment-state.outcome == 'success' || steps.environment-state.outcome == 'skipped') }}
        continue-on-error: true
        run: ${{ inputs.command }}

      - name: Determine validation outcome
        id: status
        if: ${{ always() }}
        working-directory: .
        env:
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ENVIRONMENT_SETUP_OUTCOME: ${{ steps.environment-setup.outcome }}
          ENVIRONMENT_STATE_OUTCOME: ${{ steps.environment-state.outcome }}
          COMMAND_OUTCOME: ${{ steps.command.outcome }}
        run: |
          set -euo pipefail
          outcome=failure
          if [[ "$REUSE_HIT" == "true" ]]; then
            outcome=success
          elif [[ "$BOOTSTRAP_OUTCOME" == "success" || "$BOOTSTRAP_OUTCOME" == "skipped" ]]             && [[ "$ENVIRONMENT_SETUP_OUTCOME" == "success" || "$ENVIRONMENT_SETUP_OUTCOME" == "skipped" ]]             && [[ "$ENVIRONMENT_STATE_OUTCOME" == "success" || "$ENVIRONMENT_STATE_OUTCOME" == "skipped" ]]             && [[ "$COMMAND_OUTCOME" == "success" ]]; then
            outcome=success
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Write validation evidence receipt
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          UNIT_NAME: ${{ inputs.unit_name }}
          FINGERPRINT_AVAILABLE: ${{ steps.fingerprint.outputs.fingerprint_available }}
          FINGERPRINT_DIGEST: ${{ steps.fingerprint.outputs.fingerprint_digest }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ENVIRONMENT_SETUP_OUTCOME: ${{ steps.environment-setup.outcome }}
          ENVIRONMENT_STATE_OUTCOME: ${{ steps.environment-state.outcome }}
          COMMAND_OUTCOME: ${{ steps.command.outcome }}
          OUTCOME: ${{ steps.status.outputs.outcome }}
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = []
          if os.environ["FINGERPRINT_AVAILABLE"] == "true":
              evidence.append(
                  {
                      "role": "validation-fingerprint",
                      "name": os.environ["UNIT_NAME"],
                      "path": None,
                      "digest": os.environ["FINGERPRINT_DIGEST"],
                  }
              )

          receipt = {
              "schemaVersion": 1,
              "kind": "reusable-workflows/execution-receipt",
              "capability": {"name": "validation-evidence", "interfaceVersion": 1},
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["SOURCE_SHA"].lower(),
              },
              "result": {
                  "outcome": os.environ["OUTCOME"],
                  "steps": {
                      "fingerprint": "success"
                      if os.environ["FINGERPRINT_AVAILABLE"] == "true"
                      else "skipped",
                      "bootstrap": os.environ["BOOTSTRAP_OUTCOME"],
                      "environmentSetup": os.environ["ENVIRONMENT_SETUP_OUTCOME"],
                      "environmentState": os.environ["ENVIRONMENT_STATE_OUTCOME"],
                      "command": os.environ["COMMAND_OUTCOME"],
                  },
              },
              "evidence": evidence,
              "run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "callerWorkflowRef": os.environ.get("GITHUB_WORKFLOW_REF"),
              },
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate validation evidence receipt
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        working-directory: .
        env:
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
          FINGERPRINT_AVAILABLE: ${{ steps.fingerprint.outputs.fingerprint_available }}
          FINGERPRINT_DIGEST: ${{ steps.fingerprint.outputs.fingerprint_digest }}
          UNIT_NAME: ${{ inputs.unit_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["RECEIPT_PATH"], encoding="utf-8") as handle:
              receipt = json.load(handle)

          outcomes = {"success", "failure", "cancelled", "skipped"}
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "validation-evidence", "interfaceVersion": 1}
          assert re.fullmatch(r"[^/]+/[^/]+", receipt["source"]["repository"])
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])
          assert receipt["result"]["outcome"] in outcomes
          assert all(outcome in outcomes for outcome in receipt["result"]["steps"].values())
          if os.environ["FINGERPRINT_AVAILABLE"] == "true":
              assert receipt["evidence"] == [
                  {
                      "role": "validation-fingerprint",
                      "name": os.environ["UNIT_NAME"],
                      "path": None,
                      "digest": os.environ["FINGERPRINT_DIGEST"],
                  }
              ]
          else:
              assert receipt["evidence"] == []
          assert re.fullmatch(r"[0-9]+", receipt["run"]["id"])
          assert isinstance(receipt["run"]["attempt"], int) and receipt["run"]["attempt"] >= 1
          assert receipt["run"]["callerWorkflowRef"] is None or isinstance(
              receipt["run"]["callerWorkflowRef"], str
          )
          PY

      - name: Upload validation evidence receipt
        id: receipt-upload
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.receipt_artifact_name }}
          path: ${{ steps.metadata.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Resolve validation evidence result
        id: result
        if: ${{ always() }}
        working-directory: .
        env:
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          REUSED_RUN_ID: ${{ steps.reuse.outputs.producer_run_id }}
          REUSED_SOURCE_SHA: ${{ steps.reuse.outputs.producer_source_sha }}
          REUSED_RECEIPT_NAME: ${{ steps.reuse.outputs.receipt_artifact_name }}
          STATUS_OUTCOME: ${{ steps.status.outputs.outcome }}
          RECEIPT_UPLOAD_OUTCOME: ${{ steps.receipt-upload.outcome }}
          CURRENT_SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_RECEIPT_NAME: ${{ steps.metadata.outputs.receipt_artifact_name }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_HIT" == "true" ]]; then
            {
              echo "producer_run_id=$REUSED_RUN_ID"
              echo "producer_source_sha=$REUSED_SOURCE_SHA"
              echo "receipt_artifact_name=$REUSED_RECEIPT_NAME"
              echo "reused=true"
              echo "outcome=success"
            } >> "$GITHUB_OUTPUT"
          else
            outcome=failure
            if [[ "$STATUS_OUTCOME" == "success" && "$RECEIPT_UPLOAD_OUTCOME" == "success" ]]; then
              outcome=success
            fi
            {
              echo "producer_run_id=${GITHUB_RUN_ID}"
              echo "producer_source_sha=$(printf '%s' "$CURRENT_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
              echo "receipt_artifact_name=$CURRENT_RECEIPT_NAME"
              echo "reused=false"
              echo "outcome=$outcome"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write validation evidence summary
        if: ${{ always() }}
        working-directory: .
        env:
          UNIT_NAME: ${{ inputs.unit_name }}
          FINGERPRINT_DIGEST: ${{ steps.fingerprint.outputs.fingerprint_digest }}
          REUSED: ${{ steps.result.outputs.reused }}
          REUSE_REASON: ${{ steps.reuse-status.outputs.reason }}
          PRODUCER_RUN_ID: ${{ steps.result.outputs.producer_run_id }}
          PRODUCER_SOURCE_SHA: ${{ steps.result.outputs.producer_source_sha }}
        run: |
          {
            echo "## Validation evidence"
            echo
            echo "- Unit: \\`$UNIT_NAME\\`"
            echo "- Fingerprint: \\`${FINGERPRINT_DIGEST:-unavailable}\\`"
            echo "- Reused: \\`$REUSED\\`"
            echo "- Reason: \\`$REUSE_REASON\\`"
            echo "- Producer run: \\`$PRODUCER_RUN_ID\\`"
            echo "- Producer source: \\`$PRODUCER_SOURCE_SHA\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Propagate validation evidence failure
        if: ${{ always() && steps.result.outputs.outcome != 'success' }}
        working-directory: .
        run: exit 1
