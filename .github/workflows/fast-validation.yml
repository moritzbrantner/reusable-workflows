name: Fast Validation

on:
  workflow_call:
    inputs:
      working_directory:
        description: Repository-relative directory in which setup and validation run.
        required: false
        type: string
        default: "."
      node_version:
        description: Node.js version to install. Empty disables Node setup.
        required: false
        type: string
        default: "24"
      bun_version:
        description: Bun version to install. Empty disables Bun setup.
        required: false
        type: string
        default: "1.3.14"
      install_command:
        description: Repository-owned dependency/setup command. Empty skips setup.
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      command:
        description: Repository-owned fast validation command.
        required: true
        type: string
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        type: number
        default: 20
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  fast-validation:
    name: Fast Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run repository validation
        run: ${{ inputs.command }}
