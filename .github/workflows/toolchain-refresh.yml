name: Toolchain Refresh

on:
  workflow_call:
    inputs:
      platform_upgrader_ref:
        description: Exact 40-character platform-upgrader commit SHA to execute.
        required: true
        type: string
      full_gate_command:
        description: Repository-owned deterministic full validation command.
        required: true
        type: string
      environment_setup_command:
        description: Command that installs the candidate repository environment before validation.
        required: false
        type: string
        default: "bash scripts/codex-environment.sh setup"
      update_command:
        description: Optional repository-owned mutation for lock/generated metadata after exact pins change.
        required: false
        type: string
        default: ""
      base_branch:
        description: Pull request base branch. Empty uses the caller repository default branch.
        required: false
        type: string
        default: ""
      upgrade_branch:
        description: Bot-owned branch reused for successful toolchain refresh pull requests.
        required: false
        type: string
        default: "automation/toolchain-refresh"
      hold_branch:
        description: Bot-owned branch reused for compatibility-hold pull requests.
        required: false
        type: string
        default: "automation/toolchain-compatibility-hold"
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        type: number
        default: 45
    secrets:
      platform_upgrader_token:
        description: Token with read access to the private moritzbrantner/platform-upgrader repository.
        required: true

jobs:
  toolchain-refresh:
    name: Toolchain Refresh
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM_UPGRADER_REF: ${{ inputs.platform_upgrader_ref }}
      UPGRADE_BRANCH: ${{ inputs.upgrade_branch }}
      HOLD_BRANCH: ${{ inputs.hold_branch }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Validate refresh context
        id: context
        shell: bash
        env:
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ ! "$PLATFORM_UPGRADER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::platform_upgrader_ref must be an exact 40-character commit SHA"
            exit 2
          fi

          base_branch="$INPUT_BASE_BRANCH"
          if [[ -z "$base_branch" ]]; then
            base_branch="$DEFAULT_BRANCH"
          fi
          if [[ -z "$base_branch" ]]; then
            echo "::error::Could not determine the consumer base branch"
            exit 2
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$base_branch" ]]; then
            echo "::error::Toolchain refresh must run from refs/heads/$base_branch, got $GITHUB_REF"
            exit 2
          fi

          if [[ ! -f .repository-environment.toml || ! -f scripts/codex-environment.sh ]]; then
            echo "::error::environment-v1 must be adopted before toolchain refresh"
            exit 2
          fi

          base_sha="$(git rev-parse HEAD)"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          mkdir -p .tooling
          echo "/.tooling/" >> .git/info/exclude

          open_hold_pr="$(gh pr list --state open --head "$HOLD_BRANCH" --base "$base_branch" --json number,url --jq '.[0].url // empty')"
          if [[ -n "$open_hold_pr" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Toolchain refresh deferred"
              echo
              echo "An unresolved compatibility-hold pull request already exists: $open_hold_pr"
              echo
              echo "Resolve that hold PR before evaluating another candidate."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pinned platform-upgrader
        if: steps.context.outputs.blocked != 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/platform-upgrader
          ref: ${{ inputs.platform_upgrader_ref }}
          token: ${{ secrets.platform_upgrader_token }}
          path: .tooling/platform-upgrader
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve platform-upgrader Bun
        if: steps.context.outputs.blocked != 'true'
        id: updater
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./.tooling/platform-upgrader/package.json').packageManager.split('@')[1]")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::platform-upgrader must declare an exact Bun version"
            exit 2
          fi
          echo "bun_version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up platform-upgrader Bun
        if: steps.context.outputs.blocked != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.updater.outputs.bun_version }}

      - name: Preserve platform-upgrader runtime
        if: steps.context.outputs.blocked != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$(command -v bun)" "$RUNNER_TEMP/platform-upgrader-bun"
          chmod +x "$RUNNER_TEMP/platform-upgrader-bun"

      - name: Discover latest stable toolchains
        if: steps.context.outputs.blocked != 'true'
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/toolchain-refresh.json"
          "$RUNNER_TEMP/platform-upgrader-bun" .tooling/platform-upgrader/src/cli.js refresh latest-stable . > "$report"

          changed_count="$(jq '.changedFiles | length' "$report")"
          held_count="$(jq '[.proposals[] | select(.status == "held")] | length' "$report")"
          if [[ "$changed_count" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "held_count=$held_count" >> "$GITHUB_OUTPUT"

          {
            echo "## Toolchain freshness"
            echo
            jq -r '.proposals[] | "- **\(.tool)**: `\(.oldVersion)` → `\(.newVersion)` — \(.status)"' "$report"
            if [[ "$changed_count" -eq 0 ]]; then
              echo
              if [[ "$held_count" -gt 0 ]]; then
                echo "No candidate was applied because the current stable candidate is covered by a compatibility hold."
              else
                echo "Repository toolchains are already current for the supported resolvers."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare and validate candidate
        if: steps.refresh.outputs.changed == 'true'
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT_SETUP_COMMAND: ${{ inputs.environment_setup_command }}
          UPDATE_COMMAND: ${{ inputs.update_command }}
          FULL_GATE_COMMAND: ${{ inputs.full_gate_command }}
        run: |
          set -euo pipefail

          echo "stage=environment" >> "$GITHUB_OUTPUT"
          if [[ -n "$ENVIRONMENT_SETUP_COMMAND" ]]; then
            bash -lc "$ENVIRONMENT_SETUP_COMMAND"
          fi

          echo "stage=metadata" >> "$GITHUB_OUTPUT"
          if [[ -n "$UPDATE_COMMAND" ]]; then
            bash -lc "$UPDATE_COMMAND"
          fi

          echo "stage=full-gate" >> "$GITHUB_OUTPUT"
          bash -lc "$FULL_GATE_COMMAND"
          echo "stage=passed" >> "$GITHUB_OUTPUT"

      - name: Publish verified toolchain refresh PR
        if: steps.refresh.outputs.changed == 'true' && steps.candidate.outcome == 'success'
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.context.outputs.base_branch }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          FULL_GATE_COMMAND: ${{ inputs.full_gate_command }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/toolchain-refresh.json"

          while IFS=$'\t' read -r tool _version; do
            "$RUNNER_TEMP/platform-upgrader-bun" .tooling/platform-upgrader/src/cli.js hold clear "$tool" . >/dev/null
          done < <(jq -r '.proposals[] | select(.status == "updated") | [.tool, .newVersion] | @tsv' "$report")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPGRADE_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Refresh reported changed pins but no reviewable repository diff remains"
            exit 1
          fi
          git commit -m "chore: refresh stable toolchains"
          git push --force origin "HEAD:refs/heads/$UPGRADE_BRANCH"

          body="$RUNNER_TEMP/toolchain-refresh-pr.md"
          {
            echo "Automated exact-pin refresh to the newest stable toolchains accepted by the candidate gate."
            echo
            echo "Base revision: \`$BASE_SHA\`"
            echo
            jq -r '.proposals[] | select(.status == "updated") | "- **\(.tool)**: `\(.oldVersion)` → `\(.newVersion)`"' "$report"
            echo
            echo "Repository full gate passed: \`$FULL_GATE_COMMAND\`"
            echo
            echo "This PR updates exact repository-native pins; it does not introduce floating versions."
          } > "$body"

          existing="$(gh pr list --state open --head "$UPGRADE_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "Refresh stable toolchains" --body-file "$body" >/dev/null
            pr_url="$(gh pr view "$existing" --json url --jq .url)"
          else
            pr_url="$(gh pr create --head "$UPGRADE_BRANCH" --base "$BASE_BRANCH" --title "Refresh stable toolchains" --body-file "$body")"
          fi

          {
            echo
            echo "Verified refresh PR: $pr_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore accepted pins and publish compatibility hold
        if: steps.refresh.outputs.changed == 'true' && steps.candidate.outcome != 'success'
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.context.outputs.base_branch }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          FAILURE_STAGE: ${{ steps.candidate.outputs.stage }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/toolchain-refresh.json"
          stage="${FAILURE_STAGE:-candidate-validation}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          reason="candidate $stage failed in $run_url"

          git reset --hard "$BASE_SHA"

          while IFS=$'\t' read -r tool version; do
            "$RUNNER_TEMP/platform-upgrader-bun" .tooling/platform-upgrader/src/cli.js hold record "$tool" "$version" "$BASE_SHA" "$reason" . >/dev/null
          done < <(jq -r '.proposals[] | select(.status == "updated") | [.tool, .newVersion] | @tsv' "$report")

          stale_upgrade_pr="$(gh pr list --state open --head "$UPGRADE_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$stale_upgrade_pr" ]]; then
            gh pr close "$stale_upgrade_pr" --comment "Closed because revalidation of the current candidate failed: $run_url" >/dev/null
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$HOLD_BRANCH"
          git add .repository-environment.toml
          git commit -m "chore: record toolchain compatibility hold"
          git push --force origin "HEAD:refs/heads/$HOLD_BRANCH"

          body="$RUNNER_TEMP/toolchain-hold-pr.md"
          {
            echo "A latest-stable toolchain candidate failed repository validation."
            echo
            echo "The accepted toolchain pins were restored. This PR records only the durable compatibility hold so scheduled refreshes do not retry the same rejected candidate against unchanged compatibility inputs."
            echo
            echo "Tested revision: \`$BASE_SHA\`"
            echo "Failure stage: \`$stage\`"
            echo "Run: $run_url"
            echo
            jq -r '.proposals[] | select(.status == "updated") | "- **\(.tool)** candidate: `\(.newVersion)`"' "$report"
          } > "$body"

          existing="$(gh pr list --state open --head "$HOLD_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "Record toolchain compatibility hold" --body-file "$body" >/dev/null
            pr_url="$(gh pr view "$existing" --json url --jq .url)"
          else
            pr_url="$(gh pr create --head "$HOLD_BRANCH" --base "$BASE_BRANCH" --title "Record toolchain compatibility hold" --body-file "$body")"
          fi

          {
            echo
            echo "Candidate validation failed during **$stage**."
            echo "Accepted pins were restored; compatibility hold PR: $pr_url"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Toolchain candidate failed during $stage. Accepted pins were restored and a compatibility hold PR was published."
          exit 1
