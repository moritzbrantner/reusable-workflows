name: Branch Format Diagnostic

on:
  push:
    branches:
      - refactor/simplify-default-validation-20260925
    paths:
      - ".github/workflows/branch-format-diagnostic.yml"
      - ".github/workflows/**"
      - "README.md"
      - "CONTEXT.md"
      - "IMPLEMENTING_WORKFLOWS.md"
      - "scripts/**"
      - "src/**"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refactor/simplify-default-validation-20260925
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          bun run format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply repository formatting"
          git push origin HEAD:refactor/simplify-default-validation-20260925
