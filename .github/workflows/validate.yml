      prebuilt_artifact_receipt_name: ${{ needs.prebuilt-smoke-build-artifact.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.prebuilt-smoke-build-artifact.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.prebuilt-smoke-build-artifact.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.prebuilt-smoke-build-artifact.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.prebuilt-smoke-build-artifact.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.prebuilt-smoke-build-artifact.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/integration-consumed
      integration_command: test "$(cat .artifacts/integration-consumed/artifact.txt)" = "verified integration artifact"
      artifact_paths: ""

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs:
      [
        "validation-scope",
        "coding-tooling-fast",
        "actionlint",
        "artifact-build",
        "e2e-validation",
        "storybook-validation",
        "link-validation",
        "performance-validation",
        "smoke-verified-wasm-cli",
        "smoke-fast-validation",
        "smoke-build-artifact",
        "smoke-build-artifact-reuse",
        "smoke-consume-build-artifact",
        "smoke-command-validation",
        "smoke-command-validation-second",
        "smoke-public-contract-validation",
        "smoke-repository-pages-build",
        "smoke-integration-validation",
        "smoke-e2e-validation",
