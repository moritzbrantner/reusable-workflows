name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      run_full_validation:
        description: "Run all validation jobs."
        required: false
        type: boolean
        default: false
      run_e2e:
        description: "Run E2E validation."
        required: false
        type: boolean
        default: false
      run_storybook:
        description: "Run Storybook validation."
        required: false
        type: boolean
        default: false
      run_link_validation:
        description: "Run link validation."
        required: false
        type: boolean
        default: false
      run_performance:
        description: "Run performance validation."
        required: false
        type: boolean
        default: false

      run_smoke_workflows:
        description: "Run the existing reusable-workflow smoke suite."
        required: false
        type: boolean
        default: false
      run_integration_prebuilt:
        description: "Run the existing integration prebuilt artifact smoke."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      e2e-validation: ${{ steps.scope.outputs.e2e-validation }}
      storybook-validation: ${{ steps.scope.outputs.storybook-validation }}
      link-validation: ${{ steps.scope.outputs.link-validation }}
      performance-validation: ${{ steps.scope.outputs.performance-validation }}
      artifact-build: ${{ steps.scope.outputs.artifact-build }}
      smoke: ${{ steps.scope.outputs.smoke }}
      prebuilt: ${{ steps.scope.outputs.prebuilt }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import fnmatch
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          event_name = os.environ["GITHUB_EVENT_NAME"]
          inputs = event.get("inputs") or {}
          def enabled(name):
              return str(inputs.get(name, False)).lower() == "true"
          labels = set()
          if event_name == "pull_request":
              current = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{event['number']}"
              ]))
              if current["head"]["sha"] != os.environ["HEAD_SHA"]:
                  raise RuntimeError("PR head changed; this validation scope is stale")
              labels = {label["name"].casefold() for label in current["labels"]}
          def optional(flag, label):
              return event_name == "push" or (
                  event_name == "workflow_dispatch" and (enabled("run_full_validation") or enabled(flag))
              ) or (event_name == "pull_request" and bool(labels & {"ci:full", label}))
          selected = {
              "e2e-validation": optional("run_e2e", "ci:e2e"),
              "storybook-validation": optional("run_storybook", "ci:storybook"),
              "link-validation": optional("run_link_validation", "ci:links"),
              "performance-validation": optional("run_performance", "ci:perf"),
              "artifact-build": event_name in {"push", "pull_request"} or any(
                  enabled(flag) for flag in ["run_full_validation", "run_e2e", "run_storybook", "run_link_validation"]
              ),
          }
          smoke = enabled("run_smoke_workflows") or enabled("run_full_validation")
          prebuilt = enabled("run_integration_prebuilt") or enabled("run_full_validation")
          if event_name != "workflow_dispatch":
              revision = [os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]
              if event_name == "pull_request":
                  revision = ["...".join(revision)]
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", *revision]).decode().split("\0")
              smoke_patterns = [
                  ".github/actions/**", ".github/workflows/**", "repository-pages/**",
                  "scripts/generate-workflow-manifest.ts", "scripts/validate-workflow-contracts.ts",
                  "scripts/workflow-catalog-data.ts", "src/app/workflowCatalog.ts",
                  "src/validate-workflow-contracts.test.ts",
              ]
              prebuilt_patterns = [
                  ".github/actions/consume-build-artifact/**", ".github/workflows/build-artifact.yml",
                  ".github/workflows/integration-validation.yml", ".github/workflows/smoke-integration-prebuilt.yml",
                  ".github/workflows/validate.yml",
              ]
              smoke = any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in smoke_patterns)
              prebuilt = event_name == "pull_request" and any(
                  fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in prebuilt_patterns
              )
          # Paths the Pages build (Vite graph, workflow catalog, agent pages, metrics, size check)
          # provably never reads. Anything else, an empty diff, or a requested browser check builds.
          def site_independent(path):
              return (
                  ("/" not in path and path.endswith(".md"))
                  or path.startswith(("docs/", "experiments/", "examples/", "tests/"))
                  or (path.startswith("src/") and path.endswith((".unit.test.ts", ".unit.test.tsx")))
              )
          changed = [path for path in paths if path] if event_name == "pull_request" else []
          browser_requested = any(
              selected[job] for job in ["e2e-validation", "storybook-validation", "link-validation"]
          )
          if changed and not browser_requested and all(site_independent(path) for path in changed):
              selected["artifact-build"] = False
              with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as summary:
                  print("Pages artifact build skipped: every changed path is outside the site build inputs:", file=summary)
                  for path in changed:
                      print(f"- `{path}`", file=summary)
          selected.update({"smoke-verified-wasm-cli": smoke, "smoke-fast-validation": smoke, "smoke-build-artifact": smoke, "smoke-build-artifact-reuse": smoke, "smoke-consume-build-artifact": smoke, "smoke-command-validation": smoke, "smoke-command-validation-second": smoke, "smoke-public-contract-validation": smoke, "smoke-repository-pages-build": smoke, "smoke-integration-validation": smoke, "smoke-e2e-validation": smoke, "smoke-storybook-validation": smoke, "smoke-link-validation": smoke, "smoke-performance-validation": smoke, "smoke-stage-validation": smoke, "smoke-validate-repo": smoke, "smoke-release-qualification": smoke, "smoke-artifact-promotion": smoke, "smoke-release-template": smoke, "prebuilt-smoke-build-artifact": prebuilt, "prebuilt-smoke-integration-validation": prebuilt})
          skipped = [job for job, required in selected.items() if not required]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job in ["e2e-validation", "storybook-validation", "link-validation", "performance-validation"]:
                  print(f"{job}={str(selected[job]).lower()}", file=output)
              print(f"artifact-build={str(selected['artifact-build']).lower()}", file=output)
              print(f"smoke={str(smoke).lower()}", file=output)
              print(f"prebuilt={str(prebuilt).lower()}", file=output)
              print(f"allow-skipped={json.dumps(skipped)}", file=output)

  coding-tooling-fast:
    uses: ./.github/workflows/coding-tooling-validation.yml
    permissions:
      contents: read
    with:
      operation: run
      tier: fast
      component: "."
      report_path: .artifacts/coding-tooling/fast.json
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  coding-tooling-score-history:
    needs: [coding-tooling-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coding-tooling-fast.outputs.outcome == 'success' }}
    uses: ./.github/workflows/coding-tooling-score-history.yml
    permissions:
      actions: read
      contents: write
    with:
      tier: fast

  artifact-build:
    needs: [validation-scope, coding-tooling-fast, actionlint, performance-validation]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.coding-tooling-fast.result == 'success' &&
        needs.actionlint.result == 'success' &&
        (needs.performance-validation.result == 'success' || needs.performance-validation.result == 'skipped') && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && needs.validation-scope.outputs.artifact-build == 'true') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_full_validation || inputs.run_e2e || inputs.run_storybook || inputs.run_link_validation))
        )
      }}
    uses: ./.github/workflows/build-artifact.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: reusable-workflows-web-dist-v1
      bun_version: "1.4.0"
      cache_bun: true
      build_command: "bun scripts/prepare-build-metrics-history.ts && bun run build && bun run size:check:dist"
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 1

  e2e-validation:
    needs: [validation-scope, artifact-build]
    if: >-
      ${{
        !cancelled() && needs.artifact-build.result == 'success' && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_full_validation || inputs.run_e2e)) ||
          (github.event_name == 'pull_request' && needs.validation-scope.outputs.e2e-validation == 'true')
        )
      }}
    uses: ./.github/workflows/e2e-validation.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      build_command: "bun run build"
      prebuilt_artifact_run_id: ${{ needs.artifact-build.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.artifact-build.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.artifact-build.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.artifact-build.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.artifact-build.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.artifact-build.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.artifact-build.outputs.identity_digest }}
      prebuilt_artifact_destination: dist
      install_playwright: true
      install_playwright_browsers: chromium
      e2e_command: "bunx playwright test"
      artifact_paths: |
        playwright-report
        test-results

  storybook-validation:
    needs: [validation-scope, artifact-build]
    if: >-
      ${{
        !cancelled() && needs.artifact-build.result == 'success' && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_full_validation || inputs.run_storybook)) ||
          (github.event_name == 'pull_request' && needs.validation-scope.outputs.storybook-validation == 'true')
        )
      }}
    uses: ./.github/workflows/storybook-validation.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      prebuilt_artifact_run_id: ${{ needs.artifact-build.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.artifact-build.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.artifact-build.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.artifact-build.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.artifact-build.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.artifact-build.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.artifact-build.outputs.identity_digest }}
      prebuilt_artifact_destination: dist
      pre_command: ""
      storybook_build_command: "bun run storybook:build"
      storybook_test_command: "bun run test:storybook"
      accessibility_command: "bun run test:a11y:dist"
      visual_command: "bun run test:visual:dist"
      install_playwright: true
      install_playwright_browsers: chromium
      artifact_paths: |
        storybook-static
        playwright-report
        test-results

  link-validation:
    needs: [validation-scope, artifact-build]
    if: >-
      ${{
        !cancelled() && needs.artifact-build.result == 'success' && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_full_validation || inputs.run_link_validation)) ||
          (github.event_name == 'pull_request' && needs.validation-scope.outputs.link-validation == 'true')
        )
      }}
    uses: ./.github/workflows/link-validation.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      build_command: "bun run build"
      prebuilt_artifact_run_id: ${{ needs.artifact-build.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.artifact-build.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.artifact-build.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.artifact-build.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.artifact-build.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.artifact-build.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.artifact-build.outputs.identity_digest }}
      prebuilt_artifact_destination: dist
      start_command: "bun run preview -- --host 127.0.0.1 --port 4173"
      link_check_url: "http://127.0.0.1:4173"
      link_check_command: >
        bunx linkinator@7.6.1 "$LINK_CHECK_URL" --recurse --check-fragments
        --retry-errors --retry-errors-count 2 --timeout 15000
        --skip "^mailto:" --skip "^tel:" --skip "^javascript:" --skip "^data:"
        --skip "^https?://(?!(127\\.0\\.0\\.1|localhost)(:[0-9]+)?(/|$))"
      artifact_paths: |
        link-check-results
        linkinator-report.json

  performance-validation:
    needs: [validation-scope, coding-tooling-fast, actionlint]
    if: >-
      ${{
        !cancelled() &&
        needs.coding-tooling-fast.result == 'success' &&
        needs.actionlint.result == 'success' && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_full_validation || inputs.run_performance)) ||
          (github.event_name == 'pull_request' && needs.validation-scope.outputs.performance-validation == 'true')
        )
      }}
    uses: ./.github/workflows/performance-validation.yml
    permissions:
      contents: read
      packages: read
    with:
      build_command: "bun scripts/run-measured-build.ts"
      unlighthouse_command: "bun scripts/run-unlighthouse.mjs"
      benchmark_command: "bun run bench"
      bundle_size_command: "bun run size:check:dist"
      metrics_command: "bun scripts/write-current-build-metrics.ts"
      artifact_paths: |
        .unlighthouse
        unlighthouse-reports
        benchmark-results
        performance-results
      summary_paths: |
        benchmark-results/*.md
        performance-results/current-build.md
      upload_artifacts_on: ${{ github.event_name == 'pull_request' && 'failure' || 'always' }}

  smoke-verified-wasm-cli:
    needs: ["validation-scope"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    name: Verified ${{ matrix.tool }} precompiled CLI
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: wasm-pack
            version: "0.14.0"
          - tool: wasm-bindgen
            version: "0.2.129"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install verified CLI
        uses: ./.github/actions/install-verified-wasm-cli
        with:
          tool: ${{ matrix.tool }}
          version: ${{ matrix.version }}
      - name: Validate exact released executable
        env:
          CLI_TOOL: ${{ matrix.tool }}
          CLI_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          command -v "$CLI_TOOL"
          test "$("$CLI_TOOL" --version)" = "$CLI_TOOL $CLI_VERSION"

  smoke-fast-validation:
    needs: ["validation-scope"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/fast-validation.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      command: "echo smoke fast validation"

  smoke-build-artifact:
    needs: ["validation-scope", "smoke-fast-validation"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-artifact.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: reusable-workflows-smoke-artifact-v1
      bun_version: "1.4.0"
      cache_bun: true
      cache_cargo: true
      cargo_tool_cache_key: smoke-cli-v1
      setup_command: "mkdir -p \"$CARGO_INSTALL_ROOT/bin\" && printf '#!/usr/bin/env bash\\necho cached-tool\\n' > \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && chmod +x \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && reusable-workflows-smoke-tool"
      build_command: "mkdir -p .artifacts/build-artifact-smoke && printf 'verified build artifact\n' > .artifacts/build-artifact-smoke/artifact.txt"
      artifact_paths: .artifacts/build-artifact-smoke/artifact.txt
      reuse_across_runs: true
      artifact_retention_days: 1

  smoke-build-artifact-reuse:
    needs: ["validation-scope", "smoke-build-artifact"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-artifact.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: reusable-workflows-smoke-artifact-v1
      bun_version: "1.4.0"
      cache_bun: true
      cache_cargo: true
      cargo_tool_cache_key: smoke-cli-v1
      setup_command: "mkdir -p \"$CARGO_INSTALL_ROOT/bin\" && printf '#!/usr/bin/env bash\\necho cached-tool\\n' > \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && chmod +x \"$CARGO_INSTALL_ROOT/bin/reusable-workflows-smoke-tool\" && reusable-workflows-smoke-tool"
      build_command: "mkdir -p .artifacts/build-artifact-smoke && printf 'verified build artifact\n' > .artifacts/build-artifact-smoke/artifact.txt"
      artifact_paths: .artifacts/build-artifact-smoke/artifact.txt
      reuse_across_runs: true
      artifact_retention_days: 1

  smoke-consume-build-artifact:
    needs: ["validation-scope", "smoke-build-artifact", "smoke-build-artifact-reuse"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify resolver reused the existing build
        env:
          REUSED: ${{ needs.smoke-build-artifact-reuse.outputs.reused }}
        run: test "$REUSED" = "true"
      - name: Consume exact build artifact
        id: consume
        uses: ./.github/actions/consume-build-artifact
        with:
          producer_run_id: ${{ needs.smoke-build-artifact-reuse.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.smoke-build-artifact-reuse.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.smoke-build-artifact-reuse.outputs.artifact_name }}
          artifact_digest: ${{ needs.smoke-build-artifact-reuse.outputs.artifact_digest }}
          source_sha: ${{ needs.smoke-build-artifact-reuse.outputs.source_sha }}
          artifact_key: ${{ needs.smoke-build-artifact-reuse.outputs.artifact_key }}
          identity_digest: ${{ needs.smoke-build-artifact-reuse.outputs.identity_digest }}
          destination_path: .artifacts/consumed-build-artifact
          github_token: ${{ github.token }}
      - name: Verify consumed bytes and reuse timing
        env:
          REUSE_LOOKUP_MS: ${{ needs.smoke-build-artifact-reuse.outputs.reuse_lookup_ms }}
          SETUP_MS: ${{ needs.smoke-build-artifact.outputs.setup_ms }}
          BUILD_MS: ${{ needs.smoke-build-artifact.outputs.build_ms }}
          UPLOAD_MS: ${{ needs.smoke-build-artifact.outputs.upload_ms }}
          ARTIFACT_BYTES: ${{ needs.smoke-build-artifact.outputs.artifact_bytes }}
          CONSUME_MS: ${{ steps.consume.outputs.consume_ms }}
          MATERIALIZED_BYTES: ${{ steps.consume.outputs.materialized_bytes }}
        run: |
          test "$(cat .artifacts/consumed-build-artifact/artifact.txt)" = "verified build artifact"
          [[ "$REUSE_LOOKUP_MS" =~ ^[0-9]+$ ]]
          [[ "$SETUP_MS" =~ ^[0-9]+$ ]]
          [[ "$BUILD_MS" =~ ^[0-9]+$ ]]
          [[ "$UPLOAD_MS" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_BYTES" =~ ^[0-9]+$ ]]
          [[ "$CONSUME_MS" =~ ^[0-9]+$ ]]
          [[ "$MATERIALIZED_BYTES" =~ ^[0-9]+$ ]]

  smoke-command-validation:
    needs: ["validation-scope", "smoke-fast-validation"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/command-validation.yml
    with:
      setup_command: "npm install --global bun@1.4.0 && echo smoke generic bootstrap"
      command: "echo smoke generic validation"

  smoke-command-validation-second:
    needs: ["validation-scope", "smoke-fast-validation"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/command-validation.yml
    with:
      setup_command: "npm install --global bun@1.4.0"
      command: "echo smoke second generic validation"

  smoke-public-contract-validation:
    needs: ["validation-scope", "smoke-fast-validation"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/public-contract-validation.yml

  smoke-repository-pages-build:
    needs: ["validation-scope", "smoke-fast-validation"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install repository Pages dependencies
        working-directory: repository-pages
        run: bun install
      - name: Build repository Pages static export
        working-directory: repository-pages
        env:
          NEXT_PUBLIC_REPOSITORY: moritzbrantner/reusable-workflows
          NEXT_PUBLIC_BASE_PATH: /reusable-workflows
        run: bun run build

  smoke-integration-validation:
    needs: ["validation-scope", "smoke-fast-validation"]
    if: ${{ needs.validation-scope.outputs.smoke == 'true' }}
    permissions:
