        "smoke-link-validation",
        "smoke-performance-validation",
        "smoke-stage-validation",
        "smoke-validate-repo",
        "smoke-release-qualification",
        "smoke-artifact-promotion",
        "smoke-release-template",
        "prebuilt-smoke-build-artifact",
        "prebuilt-smoke-integration-validation",
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validation-scope", "coding-tooling-fast", "actionlint", "artifact-build", "e2e-validation", "storybook-validation", "link-validation", "performance-validation", "smoke-verified-wasm-cli", "smoke-fast-validation", "smoke-build-artifact", "smoke-build-artifact-reuse", "smoke-consume-build-artifact", "smoke-command-validation", "smoke-command-validation-second", "smoke-public-contract-validation", "smoke-repository-pages-build", "smoke-integration-validation", "smoke-e2e-validation", "smoke-storybook-validation", "smoke-link-validation", "smoke-performance-validation", "smoke-stage-validation", "smoke-validate-repo", "smoke-release-qualification", "smoke-artifact-promotion", "smoke-release-template", "prebuilt-smoke-build-artifact", "prebuilt-smoke-integration-validation"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
