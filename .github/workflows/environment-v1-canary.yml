name: Environment v1 Setup Smoke

on:
  workflow_call:
    inputs:
      environment_profile:
        description: Retained for compatibility; setup does not verify environment identity.
        required: false
        type: string
        default: default
      bun_version:
        description: Retained for compatibility; setup uses the repository's declared tools.
        required: false
        type: string
        default: 1.4.0
      timeout_minutes:
        description: Maximum smoke job runtime.
        required: false
        type: number
        default: 30
      artifact_retention_days:
        description: Retained for compatibility; no environment evidence is uploaded.
        required: false
        type: number
        default: 7
    outputs:
      artifact_name:
        description: Deprecated; no artifact is uploaded.
        value: ${{ jobs.environment-canary.outputs.artifact_name }}
      expected_fingerprint:
        description: Deprecated; no fingerprint is computed.
        value: ${{ jobs.environment-canary.outputs.expected_fingerprint }}

jobs:
  environment-canary:
    name: Environment v1 Setup Smoke
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      artifact_name: ""
      expected_fingerprint: ""
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v6
      - name: Prepare declared environment
        shell: bash
        run: bash scripts/codex-environment.sh setup
