name: Release Qualification

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character consumer commit SHA to qualify.
        required: true
        type: string
      working_directory:
        description: Repository-relative directory in which bootstrap, qualification, and build commands run.
        required: false
        type: string
        default: "."
      setup_command:
        description: Optional repository-owned bootstrap/setup command. For environment-v1 consumers it runs before the standard environment-v1 setup entrypoint.
        required: false
        type: string
        default: ""
      qualification_command:
        description: Repository-owned deterministic release qualification command.
        required: true
        type: string
      build_command:
        description: Repository-owned command that builds the artifact to preserve.
        required: true
        type: string
      artifact_paths:
        description: Newline-separated repository-relative paths for the qualified artifact.
        required: true
        type: string
      timeout_minutes:
        description: Maximum qualification job runtime.
        required: false
        type: number
        default: 45
      artifact_retention_days:
        description: Retention period for the qualified artifact, provenance predicate, and execution receipt.
        required: false
        type: number
        default: 14
    outputs:
      artifact_name:
        description: Name of the uploaded qualified artifact.
        value: ${{ jobs.release-qualification.outputs.artifact_name }}
      artifact_digest:
        description: SHA-256 digest reported by actions/upload-artifact for the qualified artifact archive.
        value: ${{ jobs.release-qualification.outputs.artifact_digest }}
      attestation_id:
        description: GitHub artifact attestation ID for the qualified artifact.
        value: ${{ jobs.release-qualification.outputs.attestation_id }}
      attestation_url:
        description: GitHub URL for the qualified artifact provenance attestation.
        value: ${{ jobs.release-qualification.outputs.attestation_url }}
      provenance_predicate_path:
        description: Repository-relative exact-source provenance predicate path.
        value: ${{ jobs.release-qualification.outputs.provenance_predicate_path }}
      receipt_artifact_name:
        description: Name of the uploaded execution receipt artifact.
        value: ${{ jobs.release-qualification.outputs.receipt_artifact_name }}
      receipt_path:
        description: Repository-relative execution receipt path.
        value: ${{ jobs.release-qualification.outputs.receipt_path }}
      outcome:
        description: Qualification outcome before final failure propagation.
        value: ${{ jobs.release-qualification.outputs.outcome }}

jobs:
  release-qualification:
    name: Release Qualification
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      attestation_id: ${{ steps.provenance.outputs.attestation-id }}
      attestation_url: ${{ steps.provenance.outputs.attestation-url }}
      provenance_predicate_path: ${{ steps.metadata.outputs.provenance_predicate_path }}
      receipt_artifact_name: ${{ steps.metadata.outputs.receipt_artifact_name }}
      receipt_path: ${{ steps.metadata.outputs.receipt_path }}
      outcome: ${{ steps.status.outputs.outcome }}
    steps:
      - name: Validate exact source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be an exact 40-character commit SHA." >&2
            exit 2
          fi

      - name: Check out exact consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify checked-out commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Detect environment-v1 declaration
        id: environment
        working-directory: .
        run: |
          set -euo pipefail
          detected=false
          if [[ -f .repository-environment.toml && -f scripts/codex-environment.sh ]]; then
            detected=true
          fi
          echo "detected=$detected" >> "$GITHUB_OUTPUT"

      - name: Run repository bootstrap
        id: bootstrap
        if: ${{ inputs.setup_command != '' }}
        continue-on-error: true
        run: ${{ inputs.setup_command }}

      - name: Run standard environment-v1 setup
        id: environment-setup
        if: ${{ steps.environment.outputs.detected == 'true' && (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped') }}
        continue-on-error: true
        working-directory: .
        run: bash scripts/codex-environment.sh setup

      - name: Verify environment-v1 preserves tracked state
        id: environment-state
        if: ${{ steps.environment-setup.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Run release qualification
        id: qualification
        if: ${{ (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped') && (steps.environment-setup.outcome == 'success' || steps.environment-setup.outcome == 'skipped') && (steps.environment-state.outcome == 'success' || steps.environment-state.outcome == 'skipped') }}
        continue-on-error: true
        run: ${{ inputs.qualification_command }}

      - name: Build qualified artifact once
        id: build
        if: ${{ steps.qualification.outcome == 'success' }}
        continue-on-error: true
        run: ${{ inputs.build_command }}

      - name: Define qualification metadata
        id: metadata
        if: ${{ always() }}
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          {
            echo "artifact_name=release-qualification-${short_sha}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "provenance_predicate_path=.artifacts/reusable-workflows/release-qualification-provenance.json"
            echo "receipt_artifact_name=execution-receipt-release-qualification-${short_sha}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "receipt_path=.artifacts/reusable-workflows/release-qualification-receipt.json"
          } >> "$GITHUB_OUTPUT"

      - name: Upload qualified artifact
        id: artifact
        if: ${{ steps.qualification.outcome == 'success' && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Write exact-source provenance predicate
        id: predicate
        if: ${{ steps.artifact.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          PREDICATE_PATH: ${{ steps.metadata.outputs.provenance_predicate_path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PREDICATE_PATH")"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          predicate = {
              "schemaVersion": 1,
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["SOURCE_SHA"].lower(),
              },
              "artifact": {
                  "name": os.environ["ARTIFACT_NAME"],
                  "digest": f"sha256:{os.environ['ARTIFACT_DIGEST']}",
              },
              "qualification": {
                  "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
          }
          Path(os.environ["PREDICATE_PATH"]).write_text(
              json.dumps(predicate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate exact-source provenance predicate
        id: predicate-validation
        if: ${{ steps.predicate.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          PREDICATE_PATH: ${{ steps.metadata.outputs.provenance_predicate_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["PREDICATE_PATH"], encoding="utf-8") as handle:
              predicate = json.load(handle)

          assert predicate["schemaVersion"] == 1
          assert predicate["source"]["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert predicate["source"]["sha"] == os.environ["SOURCE_SHA"].lower()
          assert re.fullmatch(r"[0-9a-f]{40}", predicate["source"]["sha"])
          assert predicate["artifact"]["name"] == os.environ["ARTIFACT_NAME"]
          assert predicate["artifact"]["digest"] == f"sha256:{os.environ['ARTIFACT_DIGEST']}"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", predicate["artifact"]["digest"])
          assert predicate["qualification"]["workflowRef"] == os.environ["GITHUB_WORKFLOW_REF"]
          assert predicate["qualification"]["runId"] == os.environ["GITHUB_RUN_ID"]
          assert predicate["qualification"]["runAttempt"] == int(os.environ["GITHUB_RUN_ATTEMPT"])
          PY

      - name: Attest qualified artifact provenance
        id: provenance
        if: ${{ steps.predicate-validation.outcome == 'success' }}
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.artifact_name }}
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}
          predicate-type: https://github.com/moritzbrantner/reusable-workflows/attestations/artifact-provenance/v1
          predicate-path: ${{ steps.metadata.outputs.provenance_predicate_path }}

      - name: Determine qualification outcome
        id: status
        if: ${{ always() }}
        working-directory: .
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ENVIRONMENT_SETUP_OUTCOME: ${{ steps.environment-setup.outcome }}
          ENVIRONMENT_STATE_OUTCOME: ${{ steps.environment-state.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PREDICATE_OUTCOME: ${{ steps.predicate.outcome }}
          PREDICATE_VALIDATION_OUTCOME: ${{ steps.predicate-validation.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
        run: |
          set -euo pipefail
          outcome=failure
          if [[ "$SOURCE_OUTCOME" == "success" ]] \
            && [[ "$BOOTSTRAP_OUTCOME" == "success" || "$BOOTSTRAP_OUTCOME" == "skipped" ]] \
            && [[ "$ENVIRONMENT_SETUP_OUTCOME" == "success" || "$ENVIRONMENT_SETUP_OUTCOME" == "skipped" ]] \
            && [[ "$ENVIRONMENT_STATE_OUTCOME" == "success" || "$ENVIRONMENT_STATE_OUTCOME" == "skipped" ]] \
            && [[ "$QUALIFICATION_OUTCOME" == "success" ]] \
            && [[ "$BUILD_OUTCOME" == "success" ]] \
            && [[ "$ARTIFACT_OUTCOME" == "success" ]] \
            && [[ "$PREDICATE_OUTCOME" == "success" ]] \
            && [[ "$PREDICATE_VALIDATION_OUTCOME" == "success" ]] \
            && [[ "$PROVENANCE_OUTCOME" == "success" ]]; then
            outcome=success
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Write execution receipt
        if: ${{ always() }}
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ENVIRONMENT_SETUP_OUTCOME: ${{ steps.environment-setup.outcome }}
          ENVIRONMENT_STATE_OUTCOME: ${{ steps.environment-state.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PREDICATE_OUTCOME: ${{ steps.predicate.outcome }}
          PREDICATE_VALIDATION_OUTCOME: ${{ steps.predicate-validation.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          PREDICATE_PATH: ${{ steps.metadata.outputs.provenance_predicate_path }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
          OUTCOME: ${{ steps.status.outputs.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          digest = os.environ.get("ARTIFACT_DIGEST") or None
          predicate_path = Path(os.environ["PREDICATE_PATH"])
          evidence = [
              {
                  "role": "qualified-artifact",
                  "name": os.environ["ARTIFACT_NAME"],
                  "path": None,
                  "digest": f"sha256:{digest}" if digest else None,
              }
          ]
          if predicate_path.is_file():
              predicate_digest = hashlib.sha256(predicate_path.read_bytes()).hexdigest()
              evidence.append(
                  {
                      "role": "artifact-provenance-predicate",
                      "name": "artifact-provenance-v1",
                      "path": os.environ["PREDICATE_PATH"],
                      "digest": f"sha256:{predicate_digest}",
                  }
              )

          attestations = []
          attestation_id = os.environ.get("ATTESTATION_ID") or ""
          attestation_url = os.environ.get("ATTESTATION_URL") or ""
          if attestation_id and attestation_url and digest:
              attestations.append(
                  {
                      "role": "artifact-provenance",
                      "predicateType": "https://github.com/moritzbrantner/reusable-workflows/attestations/artifact-provenance/v1",
                      "id": attestation_id,
                      "url": attestation_url,
                      "subjectName": os.environ["ARTIFACT_NAME"],
                      "subjectDigest": f"sha256:{digest}",
                  }
              )

          receipt = {
              "schemaVersion": 1,
              "kind": "reusable-workflows/execution-receipt",
              "capability": {"name": "release-qualification", "interfaceVersion": 1},
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["SOURCE_SHA"].lower(),
              },
              "result": {
                  "outcome": os.environ["OUTCOME"],
                  "steps": {
                      "bootstrap": os.environ["BOOTSTRAP_OUTCOME"],
                      "environmentSetup": os.environ["ENVIRONMENT_SETUP_OUTCOME"],
                      "environmentState": os.environ["ENVIRONMENT_STATE_OUTCOME"],
                      "qualification": os.environ["QUALIFICATION_OUTCOME"],
                      "build": os.environ["BUILD_OUTCOME"],
                      "artifactUpload": os.environ["ARTIFACT_OUTCOME"],
                      "provenancePredicate": os.environ["PREDICATE_OUTCOME"],
                      "provenanceValidation": os.environ["PREDICATE_VALIDATION_OUTCOME"],
                      "provenanceAttestation": os.environ["PROVENANCE_OUTCOME"],
                  },
              },
              "evidence": evidence,
              "attestations": attestations,
              "run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "callerWorkflowRef": os.environ.get("GITHUB_WORKFLOW_REF"),
              },
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate execution receipt contract
        if: ${{ always() }}
        working-directory: .
        env:
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["RECEIPT_PATH"], encoding="utf-8") as handle:
              receipt = json.load(handle)

          outcomes = {"success", "failure", "cancelled", "skipped"}
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "release-qualification", "interfaceVersion": 1}
          assert re.fullmatch(r"[^/]+/[^/]+", receipt["source"]["repository"])
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])
          assert receipt["result"]["outcome"] in outcomes
          assert all(outcome in outcomes for outcome in receipt["result"]["steps"].values())
          assert isinstance(receipt["evidence"], list) and len(receipt["evidence"]) >= 1
          artifact = receipt["evidence"][0]
          assert artifact["role"] == "qualified-artifact"
          assert isinstance(artifact["name"], str) and artifact["name"]
          assert artifact["path"] is None
          assert artifact["digest"] is None or re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])
          assert isinstance(receipt["attestations"], list)
          if receipt["result"]["outcome"] == "success":
              assert len(receipt["evidence"]) == 2
              assert len(receipt["attestations"]) == 1
              attestation = receipt["attestations"][0]
              assert attestation["role"] == "artifact-provenance"
              assert attestation["predicateType"].endswith("/artifact-provenance/v1")
              assert attestation["subjectName"] == artifact["name"]
              assert attestation["subjectDigest"] == artifact["digest"]
              assert attestation["id"]
              assert attestation["url"].startswith("https://github.com/")
          assert re.fullmatch(r"[0-9]+", receipt["run"]["id"])
          assert isinstance(receipt["run"]["attempt"], int) and receipt["run"]["attempt"] >= 1
          assert receipt["run"]["callerWorkflowRef"] is None or isinstance(receipt["run"]["callerWorkflowRef"], str)
          PY

      - name: Upload execution receipt and provenance predicate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.receipt_artifact_name }}
          path: |
            ${{ steps.metadata.outputs.receipt_path }}
            ${{ steps.metadata.outputs.provenance_predicate_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Propagate qualification failure
        if: ${{ always() && steps.status.outputs.outcome != 'success' }}
        working-directory: .
        run: exit 1
