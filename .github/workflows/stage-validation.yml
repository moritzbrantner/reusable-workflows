name: Stage Validation

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.12"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      develop_command:
        required: false
        type: string
        default: ""
      nightly_command:
        required: false
        type: string
        default: ""
      beta_command:
        required: false
        type: string
        default: ""
      staging_command:
        required: false
        type: string
        default: ""
      production_command:
        required: false
        type: string
        default: ""
      post_command:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 60
      cache_bun:
        required: false
        type: boolean
        default: true
      cache_node:
        required: false
        type: boolean
        default: false
      cache_cargo:
        required: false
        type: boolean
        default: false
      install_playwright:
        required: false
        type: boolean
        default: false
      install_xvfb:
        required: false
        type: boolean
        default: false
      artifact_paths:
        required: false
        type: string
        default: |
          playwright-report
          test-results
          .unlighthouse
          benchmark-results
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: true
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  stage-validation:
    name: Stage Validation (${{ inputs.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-{2}-stage-validation', github.workflow, github.ref, inputs.stage) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Cargo
        if: ${{ inputs.cache_cargo }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Xvfb
        if: ${{ inputs.install_xvfb }}
        run: sudo apt-get update && sudo apt-get install -y xvfb
        working-directory: .

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Install Playwright browsers
        if: ${{ inputs.install_playwright }}
        run: bunx playwright install --with-deps

      - name: Run pre-command
        if: ${{ inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Run develop stage
        if: ${{ inputs.stage == 'develop' && inputs.develop_command != '' }}
        run: ${{ inputs.install_xvfb && format('xvfb-run -a {0}', inputs.develop_command) || inputs.develop_command }}

      - name: Run nightly stage
        if: ${{ inputs.stage == 'nightly' && inputs.nightly_command != '' }}
        run: ${{ inputs.install_xvfb && format('xvfb-run -a {0}', inputs.nightly_command) || inputs.nightly_command }}

      - name: Run beta stage
        if: ${{ inputs.stage == 'beta' && inputs.beta_command != '' }}
        run: ${{ inputs.install_xvfb && format('xvfb-run -a {0}', inputs.beta_command) || inputs.beta_command }}

      - name: Run staging stage
        if: ${{ inputs.stage == 'staging' && inputs.staging_command != '' }}
        run: ${{ inputs.install_xvfb && format('xvfb-run -a {0}', inputs.staging_command) || inputs.staging_command }}

      - name: Run production stage
        if: ${{ inputs.stage == 'production' && inputs.production_command != '' }}
        run: ${{ inputs.install_xvfb && format('xvfb-run -a {0}', inputs.production_command) || inputs.production_command }}

      - name: Upload failure artifacts
        if: ${{ failure() && inputs.artifact_paths != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: stage-validation-${{ inputs.stage }}-artifacts
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: ignore

      - name: Run post-command
        if: ${{ always() && inputs.post_command != '' }}
        run: ${{ inputs.post_command }}
