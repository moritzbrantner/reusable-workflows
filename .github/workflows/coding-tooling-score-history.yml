name: Coding Tooling Score History

on:
  workflow_call:
    inputs:
      tier:
        description: Consumer-owned coding-tooling validation tier captured as score evidence.
        required: false
        type: string
        default: full
      config:
        description: Repository-relative coding-tooling configuration path.
        required: false
        type: string
        default: .coding-tooling.json
      strict:
        description: Fail selected validation when a required coding-tooling capability is unavailable.
        required: false
        type: boolean
        default: true
      install_mode:
        description: Let coding-tooling install supported consumer dependencies or skip installation.
        required: false
        type: string
        default: auto
      validation_report_artifact_name:
        description: Optional coding-tooling-validation report artifact from the current workflow run. Supply with validation_receipt_artifact_name and validation_source_sha to reuse exact completed verification.
        required: false
        type: string
        default: ""
      validation_receipt_artifact_name:
        description: Optional coding-tooling-validation execution receipt artifact from the current workflow run.
        required: false
        type: string
        default: ""
      validation_source_sha:
        description: Exact source SHA expected in the reused coding-tooling validation receipt.
        required: false
        type: string
        default: ""
      history_branch:
        description: Reserved data-only branch used to persist history.json.
        required: false
        type: string
        default: score-history
      timeout_minutes:
        description: Maximum history publication runtime.
        required: false
        type: number
        default: 30

concurrency:
  group: coding-tooling-score-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Coding Tooling Score History
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.validation_source_sha != '' && inputs.validation_source_sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Validate reusable verification coordinates
        id: verification-inputs
        shell: bash
        env:
          REPORT_ARTIFACT_NAME: ${{ inputs.validation_report_artifact_name }}
          RECEIPT_ARTIFACT_NAME: ${{ inputs.validation_receipt_artifact_name }}
          SOURCE_SHA: ${{ inputs.validation_source_sha }}
        run: |
          set -euo pipefail
          populated=0
          for value in "$REPORT_ARTIFACT_NAME" "$RECEIPT_ARTIFACT_NAME" "$SOURCE_SHA"; do
            if [[ -n "$value" ]]; then
              populated=$((populated + 1))
            fi
          done
          if [[ "$populated" -ne 0 && "$populated" -ne 3 ]]; then
            echo "::error::validation_report_artifact_name, validation_receipt_artifact_name, and validation_source_sha must be supplied together." >&2
            exit 2
          fi
          if [[ "$populated" -eq 3 && ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::validation_source_sha must be an exact 40-character commit SHA." >&2
            exit 2
          fi
          echo "reuse=$([[ "$populated" -eq 3 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download reusable verification report
        id: reused-report
        if: ${{ steps.verification-inputs.outputs.reuse == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.validation_report_artifact_name }}
          path: .artifacts/coding-tooling/reused-report

      - name: Download reusable verification receipt
        id: reused-receipt
        if: ${{ steps.verification-inputs.outputs.reuse == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.validation_receipt_artifact_name }}
          path: .artifacts/coding-tooling/reused-receipt

      - name: Reuse exact repository verification
        id: existing-verification
        if: ${{ steps.reused-report.outcome == 'success' && steps.reused-receipt.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.validation_source_sha }}
          REPORT_ARTIFACT_NAME: ${{ inputs.validation_report_artifact_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          report_paths = list(Path(".artifacts/coding-tooling/reused-report").rglob("*.json"))
          receipt_paths = list(Path(".artifacts/coding-tooling/reused-receipt").rglob("*.json"))
          assert len(report_paths) == 1, report_paths
          assert len(receipt_paths) == 1, receipt_paths

          receipt = json.loads(receipt_paths[0].read_text(encoding="utf-8"))
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "coding-tooling-validation", "interfaceVersion": 1}
          assert receipt["source"]["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["source"]["sha"] == os.environ["EXPECTED_SOURCE_SHA"].lower()
          assert receipt["result"]["outcome"] in {"success", "failure"}

          report_evidence = [
              entry
              for entry in receipt.get("evidence", [])
              if entry.get("role") == "coding-tooling-report"
          ]
          assert len(report_evidence) == 1, report_evidence
          assert report_evidence[0]["name"] == os.environ["REPORT_ARTIFACT_NAME"]

          target = Path(".artifacts/coding-tooling/history-run.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(report_paths[0], target)
          PY

      - name: Capture repository verification
        id: verification
        if: ${{ steps.verification-inputs.outputs.reuse != 'true' || steps.existing-verification.outcome != 'success' }}
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@3f7e2387dda68fd27ddd72a8b995f126678ff4ff
        with:
          tier: ${{ inputs.tier }}
          config: ${{ inputs.config }}
          strict: ${{ inputs.strict }}
          install-mode: ${{ inputs.install_mode }}
          report-path: .artifacts/coding-tooling/history-run.json

      - name: Produce repository score snapshot
        id: score
        if: ${{ always() }}
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@3f7e2387dda68fd27ddd72a8b995f126678ff4ff
        with:
          operation: score
          validation-report: .artifacts/coding-tooling/history-run.json
          report-path: .artifacts/coding-tooling/history-score.json
          install-mode: none

      - name: Check out score-history writer
        if: ${{ always() }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/coding-tooling
          ref: 3f7e2387dda68fd27ddd72a8b995f126678ff4ff
          path: .coding-tooling-source
          persist-credentials: false

      - name: Ensure history branch exists
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          history_branch="${{ inputs.history_branch }}"
          git check-ref-format --branch "$history_branch" >/dev/null
          if ! git ls-remote --exit-code --heads origin "$history_branch" >/dev/null 2>&1; then
            git push origin "$GITHUB_SHA:refs/heads/$history_branch"
          fi

      - name: Check out history branch
        if: ${{ always() }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.history_branch }}
          path: .score-history
          fetch-depth: 1

      - name: Append score snapshot
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          commit_timestamp="$(git show -s --format=%cI "$GITHUB_SHA")"
          validation_tier="${{ inputs.tier }}"
          bun .coding-tooling-source/scripts/append-score-history.mjs \
            --history .score-history/history.json \
            --score .artifacts/coding-tooling/history-score.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --timestamp "$commit_timestamp" \
            --producer-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --validation-tier "$validation_tier"

      - name: Publish history branch
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          history_branch="${{ inputs.history_branch }}"
          git -C .score-history config user.name "github-actions[bot]"
          git -C .score-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          unexpected="$(git -C .score-history ls-files | grep -vx 'history.json' || true)"
          if [[ -n "$unexpected" ]]; then
            cp .score-history/history.json "$RUNNER_TEMP/score-history.json"
            git -C .score-history reset --hard
            git -C .score-history clean -fdx
            git -C .score-history checkout --orphan score-history-clean
            git -C .score-history rm -rf .
            cp "$RUNNER_TEMP/score-history.json" .score-history/history.json
            git -C .score-history add history.json
            git -C .score-history commit -m "score-history: isolate persistence branch"
            git -C .score-history push --force origin "HEAD:$history_branch"
          else
            git -C .score-history add history.json
            if ! git -C .score-history diff --cached --quiet; then
              git -C .score-history commit -m "score-history: ${GITHUB_SHA:0:12}"
              git -C .score-history push origin "HEAD:$history_branch"
            fi
          fi

      - name: Verify data-only history branch
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git -C .score-history ls-files)"
          if [[ "$tracked" != "history.json" ]]; then
            echo "::error::Score history must track only history.json; found:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Write score-history summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          bun - "$GITHUB_STEP_SUMMARY" .score-history/history.json "$GITHUB_SHA" "${{ inputs.history_branch }}" <<'BUN'
          import { readFileSync, appendFileSync } from "node:fs";

          const [summaryPath, historyPath, commit, historyBranch] = process.argv.slice(2);
          const history = JSON.parse(readFileSync(historyPath, "utf8"));
          const entry = history.entries?.find((candidate) => candidate.commit === commit);
          const lines = ["## coding-tooling score history", ""];
          if (!entry) {
            lines.push("- Snapshot: **unavailable**");
          } else {
            lines.push(`- Score: **${entry.score ?? "unavailable"}**`);
            lines.push(`- Completeness: **${entry.completeness ?? "unavailable"}**`);
            lines.push(`- Verification: **${entry.verification?.status ?? "unavailable"}**`);
            lines.push(`- Definition: \`${entry.definitionFingerprint ?? "unavailable"}\``);
            lines.push(`- History branch: \`${historyBranch}\``);
          }
          appendFileSync(summaryPath, `${lines.join("\n")}\n`, "utf8");
          BUN

      - name: Surface score production failure
        if: ${{ steps.score.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Repository score production failed; its error tombstone was published to ${{ inputs.history_branch }}."
          exit 1
