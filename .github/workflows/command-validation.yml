name: Command Validation

on:
  workflow_call:
    inputs:
      working_directory:
        description: Repository-relative directory in which setup and validation commands run.
        required: false
        type: string
        default: "."
      setup_command:
        description: Optional repository-owned setup command.
        required: false
        type: string
        default: ""
      command:
        description: Repository-owned validation command.
        required: true
        type: string
      timeout_minutes:
        description: Maximum validation job runtime.
        required: false
        type: number
        default: 20

jobs:
  command-validation:
    name: Command Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run repository setup
        if: ${{ inputs.setup_command != '' }}
        run: ${{ inputs.setup_command }}

      - name: Run repository validation
        run: ${{ inputs.command }}
