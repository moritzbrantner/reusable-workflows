name: Integration Validation

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Failure or requested artifact name for this validation job."
        value: ${{ jobs.integration-validation.outputs.artifact_name }}
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.14"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      prebuilt_artifact_run_id:
        description: Exact build-artifact producer run ID. Empty keeps the existing source-only path.
        required: false
        type: string
        default: ""
      prebuilt_artifact_receipt_name:
        description: Exact build-artifact Execution Receipt artifact name.
        required: false
        type: string
        default: ""
      prebuilt_artifact_name:
        description: Exact immutable build artifact name.
        required: false
        type: string
        default: ""
      prebuilt_artifact_digest:
        description: Raw 64-character SHA-256 digest emitted by build-artifact.yml.
        required: false
        type: string
        default: ""
      prebuilt_source_sha:
        description: Exact source SHA bound to the prebuilt artifact.
        required: false
        type: string
        default: ""
      prebuilt_artifact_key:
        description: Caller-owned semantic artifact key bound to the prebuilt artifact.
        required: false
        type: string
        default: ""
      prebuilt_identity_digest:
        description: sha256-prefixed deterministic artifact identity digest.
        required: false
        type: string
        default: ""
      prebuilt_artifact_destination:
        description: Repository-root-relative empty/absent destination for verified extraction.
        required: false
        type: string
        default: ""
      integration_command:
        required: false
        type: string
        default: ""
      migration_command:
        required: false
        type: string
        default: ""
      package_check_command:
        required: false
        type: string
        default: ""
      post_command:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 30
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      cache_cargo:
        required: false
        type: boolean
        default: false
      cargo_cache_dependency_path:
        required: false
        type: string
        default: "**/Cargo.lock"
      artifact_paths:
        required: false
        type: string
        default: ""
      upload_artifacts_on:
        required: false
        type: string
        default: "failure"
      artifact_retention_days:
        required: false
        type: number
        default: 7
      artifact_name_suffix:
        required: false
        type: string
        default: ""
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: true
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        description: Deprecated and unused. Accepted only so callers that still pass it do not fail; owner packages install without a registry token.
        required: false

jobs:
  integration-validation:
    name: Integration Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    permissions:
      actions: read
      contents: read
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-integration-validation', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.prebuilt_source_sha != '' && inputs.prebuilt_source_sha || github.sha }}

      - name: Set artifact name
        id: artifact-name
        run: echo "name=integration-validation-artifacts${{ inputs.artifact_name_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate artifact upload mode
        if: ${{ inputs.upload_artifacts_on != 'failure' && inputs.upload_artifacts_on != 'always' && inputs.upload_artifacts_on != 'never' }}
        run: |
          echo "::error::upload_artifacts_on must be one of: failure, always, never." >&2
          exit 1

      - name: Validate prebuilt artifact coordinates
        working-directory: .
        env:
          RUN_ID: ${{ inputs.prebuilt_artifact_run_id }}
          RECEIPT_NAME: ${{ inputs.prebuilt_artifact_receipt_name }}
          ARTIFACT_NAME: ${{ inputs.prebuilt_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.prebuilt_artifact_digest }}
          SOURCE_SHA: ${{ inputs.prebuilt_source_sha }}
          ARTIFACT_KEY: ${{ inputs.prebuilt_artifact_key }}
          IDENTITY_DIGEST: ${{ inputs.prebuilt_identity_digest }}
          DESTINATION: ${{ inputs.prebuilt_artifact_destination }}
        run: |
          set -euo pipefail
          values=("$RUN_ID" "$RECEIPT_NAME" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" "$SOURCE_SHA" "$ARTIFACT_KEY" "$IDENTITY_DIGEST" "$DESTINATION")
          populated=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              populated=$((populated + 1))
            fi
          done
          if [[ "$populated" -ne 0 && "$populated" -ne "${#values[@]}" ]]; then
            echo "::error::Prebuilt artifact coordinates must be supplied all-or-none." >&2
            exit 2
          fi

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Cargo
        if: ${{ inputs.cache_cargo }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles(inputs.cargo_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run pre-command
        if: ${{ inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Consume verified prebuilt artifact
        if: ${{ inputs.prebuilt_artifact_run_id != '' }}
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@main
        with:
          producer_run_id: ${{ inputs.prebuilt_artifact_run_id }}
          receipt_artifact_name: ${{ inputs.prebuilt_artifact_receipt_name }}
          artifact_name: ${{ inputs.prebuilt_artifact_name }}
          artifact_digest: ${{ inputs.prebuilt_artifact_digest }}
          source_sha: ${{ inputs.prebuilt_source_sha }}
          artifact_key: ${{ inputs.prebuilt_artifact_key }}
          identity_digest: ${{ inputs.prebuilt_identity_digest }}
          destination_path: ${{ inputs.prebuilt_artifact_destination }}
          github_token: ${{ github.token }}

      - name: Run integration tests
        if: ${{ inputs.integration_command != '' }}
        run: ${{ inputs.integration_command }}

      - name: Check migrations
        if: ${{ inputs.migration_command != '' }}
        run: ${{ inputs.migration_command }}

      - name: Check packages
        if: ${{ inputs.package_check_command != '' }}
        run: ${{ inputs.package_check_command }}

      - name: Upload artifacts
        if: ${{ inputs.artifact_paths != '' && (inputs.upload_artifacts_on == 'always' || (failure() && inputs.upload_artifacts_on == 'failure')) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Run post-command
        if: ${{ always() && inputs.post_command != '' }}
        run: ${{ inputs.post_command }}
