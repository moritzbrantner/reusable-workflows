name: Link Validation

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Failure or requested artifact name for this link validation job."
        value: ${{ jobs.link-validation.outputs.artifact_name }}
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.14"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      prebuilt_artifact_run_id:
        description: Exact build-artifact producer run ID. Empty keeps the existing local-build path.
        required: false
        type: string
        default: ""
      prebuilt_artifact_receipt_name:
        description: Exact build-artifact Execution Receipt artifact name.
        required: false
        type: string
        default: ""
      prebuilt_artifact_name:
        description: Exact immutable build artifact name.
        required: false
        type: string
        default: ""
      prebuilt_artifact_digest:
        description: Raw 64-character SHA-256 digest emitted by build-artifact.yml.
        required: false
        type: string
        default: ""
      prebuilt_source_sha:
        description: Exact source SHA bound to the prebuilt artifact.
        required: false
        type: string
        default: ""
      prebuilt_artifact_key:
        description: Caller-owned semantic artifact key bound to the prebuilt artifact.
        required: false
        type: string
        default: ""
      prebuilt_identity_digest:
        description: sha256-prefixed deterministic artifact identity digest.
        required: false
        type: string
        default: ""
      prebuilt_artifact_destination:
        description: Repository-root-relative empty/absent destination for verified extraction.
        required: false
        type: string
        default: ""
      start_command:
        required: false
        type: string
        default: ""
      link_check_url:
        required: false
        type: string
        default: "http://127.0.0.1:3000"
      link_check_command:
        required: false
        type: string
        default: 'bunx linkinator@7.6.1 "$LINK_CHECK_URL" --recurse --check-fragments --retry-errors --retry-errors-count 2 --timeout 15000 --skip "^mailto:" --skip "^tel:" --skip "^javascript:" --skip "^data:" --skip "^https?://(?!(127\\.0\\.0\\.1|localhost)(:[0-9]+)?(/|$))"'
      post_command:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 30
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      artifact_paths:
        required: false
        type: string
        default: |
          link-check-results
          linkinator-report.json
      upload_artifacts_on:
        required: false
        type: string
        default: "failure"
      artifact_retention_days:
        required: false
        type: number
        default: 7
      artifact_name_suffix:
        required: false
        type: string
        default: ""
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: true
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  link-validation:
    name: Link Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    permissions:
      actions: read
      contents: read
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-link-validation', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.prebuilt_source_sha != '' && inputs.prebuilt_source_sha || github.sha }}

      - name: Set artifact name
        id: artifact-name
        run: echo "name=link-validation-artifacts${{ inputs.artifact_name_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate artifact upload mode
        if: ${{ inputs.upload_artifacts_on != 'failure' && inputs.upload_artifacts_on != 'always' && inputs.upload_artifacts_on != 'never' }}
        run: |
          echo "::error::upload_artifacts_on must be one of: failure, always, never." >&2
          exit 1

      - name: Validate prebuilt artifact coordinates
        working-directory: .
        env:
          RUN_ID: ${{ inputs.prebuilt_artifact_run_id }}
          RECEIPT_NAME: ${{ inputs.prebuilt_artifact_receipt_name }}
          ARTIFACT_NAME: ${{ inputs.prebuilt_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.prebuilt_artifact_digest }}
          SOURCE_SHA: ${{ inputs.prebuilt_source_sha }}
          ARTIFACT_KEY: ${{ inputs.prebuilt_artifact_key }}
          IDENTITY_DIGEST: ${{ inputs.prebuilt_identity_digest }}
          DESTINATION: ${{ inputs.prebuilt_artifact_destination }}
        run: |
          set -euo pipefail
          values=("$RUN_ID" "$RECEIPT_NAME" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" "$SOURCE_SHA" "$ARTIFACT_KEY" "$IDENTITY_DIGEST" "$DESTINATION")
          populated=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              populated=$((populated + 1))
            fi
          done
          if [[ "$populated" -ne 0 && "$populated" -ne "${#values[@]}" ]]; then
            echo "::error::Prebuilt artifact coordinates must be supplied all-or-none." >&2
            exit 2
          fi

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run pre-command
        if: ${{ inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Consume verified prebuilt artifact
        if: ${{ inputs.prebuilt_artifact_run_id != '' }}
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@14d111fe589f21fe7254354713320ab0a832a101
        with:
          producer_run_id: ${{ inputs.prebuilt_artifact_run_id }}
          receipt_artifact_name: ${{ inputs.prebuilt_artifact_receipt_name }}
          artifact_name: ${{ inputs.prebuilt_artifact_name }}
          artifact_digest: ${{ inputs.prebuilt_artifact_digest }}
          source_sha: ${{ inputs.prebuilt_source_sha }}
          artifact_key: ${{ inputs.prebuilt_artifact_key }}
          identity_digest: ${{ inputs.prebuilt_identity_digest }}
          destination_path: ${{ inputs.prebuilt_artifact_destination }}
          github_token: ${{ github.token }}

      - name: Build
        if: ${{ inputs.build_command != '' && inputs.prebuilt_artifact_run_id == '' }}
        run: ${{ inputs.build_command }}

      - name: Start site
        if: ${{ inputs.start_command != '' }}
        env:
          START_COMMAND: ${{ inputs.start_command }}
          LINK_CHECK_URL: ${{ inputs.link_check_url }}
        run: |
          setsid bash -c "${START_COMMAND}" &
          server_pid="$!"
          echo "${server_pid}" > "$RUNNER_TEMP/link-validation-server.pid"

          for _ in {1..120}; do
            if curl -fsS "${LINK_CHECK_URL}" >/dev/null; then
              echo "Site is reachable at ${LINK_CHECK_URL}."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Site did not become reachable at ${LINK_CHECK_URL} within 120 seconds." >&2
          exit 1

      - name: Validate link check command
        if: ${{ inputs.link_check_command == '' }}
        run: |
          echo "::error::link_check_command is required." >&2
          exit 1

      - name: Check links
        env:
          LINK_CHECK_URL: ${{ inputs.link_check_url }}
          LINK_CHECK_BASE_URL: ${{ inputs.link_check_url }}
        run: ${{ inputs.link_check_command }}

      - name: Upload artifacts
        if: ${{ inputs.artifact_paths != '' && (inputs.upload_artifacts_on == 'always' || (failure() && inputs.upload_artifacts_on == 'failure')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Stop site
        if: ${{ always() && inputs.start_command != '' }}
        working-directory: .
        run: |
          if [ ! -f "$RUNNER_TEMP/link-validation-server.pid" ]; then
            exit 0
          fi

          server_pid="$(cat "$RUNNER_TEMP/link-validation-server.pid")"
          if [ -n "${server_pid}" ] && kill -0 "${server_pid}" 2>/dev/null; then
            kill -- "-${server_pid}" 2>/dev/null || kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          fi

      - name: Run post-command
        if: ${{ always() && inputs.post_command != '' }}
        run: ${{ inputs.post_command }}
