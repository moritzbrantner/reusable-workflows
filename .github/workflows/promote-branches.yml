name: Promote Branches

on:
  workflow_call:
    inputs:
      source_branch:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 10
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: false
      dispatch_workflows:
        description: Space-separated workflow files to dispatch on target_branch after promotion. Pushes made with GITHUB_TOKEN do not start push-triggered workflows.
        required: false
        type: string
        default: ""

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
      actions: write
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-{2}-promotion', github.workflow, inputs.source_branch, inputs.target_branch) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify branch promotion contract
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          for branch in "${SOURCE_BRANCH}" "${TARGET_BRANCH}"; do
            if [[ "${branch}" == refs/* ]]; then
              echo "::error::Use branch names without refs/* prefixes: ${branch}" >&2
              exit 1
            fi

            if ! git check-ref-format --branch "${branch}" >/dev/null; then
              echo "::error::Invalid branch name: ${branch}" >&2
              exit 1
            fi
          done

          if [ "${SOURCE_BRANCH}" = "${TARGET_BRANCH}" ]; then
            echo "::error::source_branch and target_branch must differ." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          tested_commit="$(git rev-parse --verify "${TESTED_SHA}^{commit}")"

          if ! git merge-base --is-ancestor "${tested_commit}" "origin/${SOURCE_BRANCH}"; then
            echo "::error::tested_sha must be reachable from origin/${SOURCE_BRANCH}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "${tested_commit}"; then
            echo "::error::${TARGET_BRANCH} contains commits outside ${tested_commit}." >&2
            exit 1
          fi
      - name: Promote exact tested commit
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          REMOTE_REF="refs/remotes/origin/${TARGET_BRANCH}"
          EXPECTED_TARGET="$(git rev-parse "${REMOTE_REF}")"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET}" \
            origin \
            "${TESTED_SHA}:refs/heads/${TARGET_BRANCH}"
      - name: Dispatch target branch workflows
        if: inputs.dispatch_workflows != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          DISPATCH_WORKFLOWS: ${{ inputs.dispatch_workflows }}
        run: |
          for workflow in ${DISPATCH_WORKFLOWS}; do
            gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          done
