name: Coding Tooling Validation

on:
  workflow_call:
    inputs:
      operation:
        description: "coding-tooling operation to execute: run, findings, or public-contract."
        required: false
        type: string
        default: run
      tier:
        description: Validation tier declared by coding-tooling or the consumer repository. Ignored for findings and public-contract.
        required: false
        type: string
        default: fast
      component:
        description: Optional component name or repository-relative path.
        required: false
        type: string
        default: ""
      config:
        description: Repository-relative coding-tooling configuration path.
        required: false
        type: string
        default: .coding-tooling.json
      strict:
        description: Fail when a selected coding-tooling capability is unavailable.
        required: false
        type: boolean
        default: true
      install_mode:
        description: Let coding-tooling install supported consumer dependencies or skip installation.
        required: false
        type: string
        default: auto
      report_path:
        description: Repository-relative path for the machine-readable coding-tooling report.
        required: false
        type: string
        default: .artifacts/coding-tooling/report.json
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        type: number
        default: 30
      artifact_retention_days:
        description: Retention period for the coding-tooling report artifact.
        required: false
        type: number
        default: 7
    outputs:
      artifact_name:
        description: Name of the uploaded coding-tooling report artifact.
        value: ${{ jobs.coding-tooling.outputs.artifact_name }}
      report_path:
        description: Repository-relative path used for the coding-tooling JSON report.
        value: ${{ jobs.coding-tooling.outputs.report_path }}
      outcome:
        description: Outcome of the coding-tooling Action before failure propagation.
        value: ${{ jobs.coding-tooling.outputs.outcome }}

jobs:
  coding-tooling:
    name: Coding Tooling Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.report.outputs.artifact_name }}
      report_path: ${{ steps.report.outputs.report_path }}
      outcome: ${{ steps.tooling.outcome }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run coding-tooling
        id: tooling
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@c5ea824243d5fa9a28d291a6cf870b7fc5a79ebe
        with:
          operation: ${{ inputs.operation }}
          tier: ${{ inputs.tier }}
          component: ${{ inputs.component }}
          config: ${{ inputs.config }}
          report-path: ${{ inputs.report_path }}
          strict: ${{ inputs.strict }}
          install-mode: ${{ inputs.install_mode }}

      - name: Define report metadata
        id: report
        if: ${{ always() }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REPORT_PATH: ${{ inputs.report_path }}
        run: |
          artifact_name="coding-tooling-${{ inputs.operation }}-${{ inputs.tier }}-${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ "$OPERATION" == "public-contract" && -f "$REPORT_PATH" ]]; then
            summary_slug="$(node - "$REPORT_PATH" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const summary = report?.data?.summary;
          const schema = report?.data?.schemaVersion ?? report?.schemaVersion;
          if (!summary || !Number.isInteger(schema)) process.exit(0);
          const values = [summary.discovered, summary.verified, summary.unverified, summary.unsupported, summary.failedEvidence];
          if (!values.every(Number.isInteger)) process.exit(0);
          process.stdout.write(`v${schema}-d${summary.discovered}-vfy${summary.verified}-u${summary.unverified}-i${summary.unsupported}-f${summary.failedEvidence}`);
          NODE
            )"
            if [[ -n "$summary_slug" ]]; then
              artifact_name="coding-tooling-public-contract-${summary_slug}-${{ github.run_id }}-${{ github.run_attempt }}"
            fi
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "report_path=${{ inputs.report_path }}" >> "$GITHUB_OUTPUT"

      - name: Write validation summary
        if: ${{ always() }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REPORT_PATH: ${{ inputs.report_path }}
        run: |
          {
            echo "## coding-tooling validation"
            echo
            echo "- Operation: \`${{ inputs.operation }}\`"
            echo "- Tier: \`${{ inputs.tier }}\`"
            echo "- Outcome: \`${{ steps.tooling.outcome }}\`"
            echo "- coding-tooling revision: \`c5ea824243d5fa9a28d291a6cf870b7fc5a79ebe\`"
            echo "- Report path: \`${{ inputs.report_path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$OPERATION" == "public-contract" && -f "$REPORT_PATH" ]]; then
            node - "$REPORT_PATH" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const summary = report?.data?.summary;
          if (!summary) process.exit(0);
          const percent = Number.isFinite(summary.verifiedRatio)
            ? `${(summary.verifiedRatio * 100).toFixed(1)}%`
            : "unknown";
          console.log("");
          console.log("### Public contract");
          console.log("");
          console.log(`- Discovered: **${summary.discovered}**`);
          console.log(`- Verified: **${summary.verified}** (${percent})`);
          console.log(`- Unverified: **${summary.unverified}**`);
          console.log(`- Incomplete discovery: **${summary.unsupported}**`);
          console.log(`- Failed evidence: **${summary.failedEvidence}**`);
          console.log(`- Strict ready: **${summary.strictReady ? "yes" : "no"}**`);
          NODE
          fi

      - name: Upload coding-tooling report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.report.outputs.artifact_name }}
          path: ${{ inputs.report_path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Propagate coding-tooling failure
        if: ${{ steps.tooling.outcome != 'success' }}
        shell: bash
        run: exit 1
