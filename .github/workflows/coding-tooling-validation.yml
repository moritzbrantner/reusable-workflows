name: Coding Tooling Validation

on:
  workflow_call:
    inputs:
      operation:
        description: "coding-tooling operation to execute: run, findings, foundation, bootstrap-plan, or public-contract."
        required: false
        type: string
        default: run
      tier:
        description: Validation tier declared by coding-tooling or the consumer repository.
        required: false
        type: string
        default: fast
      component:
        description: Optional component name or repository-relative path.
        required: false
        type: string
        default: ""
      config:
        description: Repository-relative coding-tooling configuration path.
        required: false
        type: string
        default: .coding-tooling.json
      source_sha:
        description: Caller-established source revision. Defaults to the triggering PR head or workflow SHA.
        required: false
        type: string
        default: ""
      strict:
        description: Fail when a selected coding-tooling capability is unavailable.
        required: false
        type: boolean
        default: true
      allow_missing_foundation:
        description: For foundation audits only, allow missing rollout pieces while still rejecting invalid or unsupported foundation state.
        required: false
        type: boolean
        default: false
      install_mode:
        description: Let coding-tooling install supported consumer dependencies or skip installation.
        required: false
        type: string
        default: auto
      report_path:
        description: Repository-relative path for the machine-readable coding-tooling report.
        required: false
        type: string
        default: .artifacts/coding-tooling/report.json
      evidence_path:
        description: Optional repository-relative diagnostic path to upload when coding-tooling fails.
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: Maximum job runtime.
        required: false
        type: number
        default: 30
      artifact_retention_days:
        description: Retention period for failure diagnostics.
        required: false
        type: number
        default: 7
    outputs:
      artifact_name:
        description: Failure-diagnostic artifact name, empty when no diagnostic artifact was uploaded.
        value: ${{ jobs.coding-tooling.outputs.artifact_name }}
      report_path:
        description: Repository-relative path used for the coding-tooling JSON report.
        value: ${{ jobs.coding-tooling.outputs.report_path }}
      outcome:
        description: Final validation outcome after the narrow foundation-rollout compatibility rule.
        value: ${{ jobs.coding-tooling.outputs.outcome }}
      source_sha:
        description: Exact checked-out source revision.
        value: ${{ jobs.coding-tooling.outputs.source_sha }}

jobs:
  coding-tooling:
    name: Coding Tooling Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.diagnostics.outcome == 'success' && steps.metadata.outputs.artifact_name || '' }}
      report_path: ${{ steps.metadata.outputs.report_path }}
      outcome: ${{ steps.result.outputs.outcome }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Check out exact consumer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha != '' && inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out source
        id: metadata
        shell: bash
        env:
          REPORT_PATH: ${{ inputs.report_path }}
        run: |
          set -euo pipefail
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "report_path=$REPORT_PATH"
            echo "artifact_name=coding-tooling-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - name: Run coding-tooling
        id: tooling
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@45edf80384e5ea98ca8784f81f0210f3bf744858
        with:
          operation: ${{ inputs.operation }}
          tier: ${{ inputs.tier }}
          component: ${{ inputs.component }}
          config: ${{ inputs.config }}
          report-path: ${{ inputs.report_path }}
          strict: ${{ inputs.strict }}
          install-mode: ${{ inputs.install_mode }}
          source-sha: ${{ steps.metadata.outputs.source_sha }}

      - name: Resolve validation outcome
        id: result
        if: ${{ always() }}
        shell: bash
        env:
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          OPERATION: ${{ inputs.operation }}
          ALLOW_MISSING_FOUNDATION: ${{ inputs.allow_missing_foundation }}
          REPORT_PATH: ${{ inputs.report_path }}
        run: |
          set -euo pipefail
          outcome="$TOOLING_OUTCOME"
          if [[ "$outcome" != "success" && "$OPERATION" == "foundation" && "$ALLOW_MISSING_FOUNDATION" == "true" ]]; then
            if python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          components = report.get("data", {}).get("components")
          if not isinstance(components, dict) or not components:
              raise SystemExit(1)
          statuses = [value.get("status") for value in components.values() if isinstance(value, dict)]
          if not statuses or any(status in {"invalid", "unsupported"} for status in statuses):
              raise SystemExit(1)
          if any(status not in {"adopted", "missing"} for status in statuses):
              raise SystemExit(1)
          if "missing" not in statuses:
              raise SystemExit(1)
          PY
            then
              outcome=success
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Upload failure diagnostics
        id: diagnostics
        if: ${{ always() && steps.tooling.outcome != 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ inputs.report_path }}
            ${{ inputs.evidence_path }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Propagate coding-tooling failure
        if: ${{ always() && steps.result.outputs.outcome != 'success' }}
        shell: bash
        run: exit 1
