name: Deliver Qualified Expo Stores

on:
  workflow_call:
    inputs:
      promotion_run_id:
        description: Workflow run ID that produced a successful artifact-promotion receipt.
        required: true
        type: string
      promotion_receipt_artifact_name:
        description: Execution receipt artifact emitted by artifact-promotion.yml.
        required: true
        type: string
      working_directory:
        description: Repository-relative Expo project directory containing eas.json.
        required: false
        type: string
        default: "."
      submit_profile:
        description: App-owned EAS Submit profile to use for both exact binaries.
        required: false
        type: string
        default: internal
      eas_cli_version:
        description: Exact eas-cli version used only for terminal submission.
        required: false
        type: string
        default: 23.2.0
      timeout_minutes:
        description: Maximum store-delivery job runtime.
        required: false
        type: number
        default: 45
      artifact_retention_days:
        description: Retention period for delivery receipt and submission evidence.
        required: false
        type: number
        default: 30
    secrets:
      expo_token:
        description: Expo access token authorized for the app's configured store submission credentials.
        required: true
    outputs:
      source_sha:
        description: Exact qualified source SHA delivered to the stores.
        value: ${{ jobs.deliver-qualified-expo-stores.outputs.source_sha }}
      ios_build_id:
        description: EAS Build ID recorded for the exact submitted iOS binary.
        value: ${{ jobs.deliver-qualified-expo-stores.outputs.ios_build_id }}
      android_build_id:
        description: EAS Build ID recorded for the exact submitted Android binary.
        value: ${{ jobs.deliver-qualified-expo-stores.outputs.android_build_id }}
      receipt_artifact_name:
        description: Uploaded delivery execution receipt artifact name.
        value: ${{ jobs.deliver-qualified-expo-stores.outputs.receipt_artifact_name }}
      receipt_path:
        description: Repository-relative delivery execution receipt path.
        value: ${{ jobs.deliver-qualified-expo-stores.outputs.receipt_path }}
      outcome:
        description: Store-delivery outcome before final failure propagation.
        value: ${{ jobs.deliver-qualified-expo-stores.outputs.outcome }}

jobs:
  deliver-qualified-expo-stores:
    name: Deliver Qualified Expo Stores
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      source_sha: ${{ steps.promotion.outputs.source_sha }}
      ios_build_id: ${{ steps.mobile.outputs.ios_build_id }}
      android_build_id: ${{ steps.mobile.outputs.android_build_id }}
      receipt_artifact_name: ${{ steps.metadata.outputs.receipt_artifact_name }}
      receipt_path: ${{ steps.metadata.outputs.receipt_path }}
      outcome: ${{ steps.status.outputs.outcome }}
    steps:
      - name: Validate delivery coordinates
        id: coordinates
        continue-on-error: true
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RECEIPT_ARTIFACT_NAME: ${{ inputs.promotion_receipt_artifact_name }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile }}
          EAS_CLI_VERSION: ${{ inputs.eas_cli_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PROMOTION_RECEIPT_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$SUBMIT_PROFILE" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$EAS_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Download promotion receipt
        id: receipt-download
        if: ${{ steps.coordinates.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.promotion_receipt_artifact_name }}
          path: .artifacts/reusable-workflows/promotion-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promotion_run_id }}
          digest-mismatch: error

      - name: Validate promotion receipt
        id: promotion
        if: ${{ steps.receipt-download.outcome == 'success' }}
        continue-on-error: true
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          RECEIPT_DIRECTORY: .artifacts/reusable-workflows/promotion-receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          paths = list(Path(os.environ["RECEIPT_DIRECTORY"]).rglob("artifact-promotion-receipt.json"))
          assert len(paths) == 1, paths
          receipt = json.loads(paths[0].read_text(encoding="utf-8"))
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "artifact-promotion", "interfaceVersion": 1}
          assert receipt["result"]["outcome"] == "success"
          assert receipt["run"]["id"] == os.environ["PROMOTION_RUN_ID"]
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])

          artifacts = [entry for entry in receipt["evidence"] if entry["role"] == "qualified-artifact"]
          assert len(artifacts) == 1, artifacts
          artifact = artifacts[0]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])

          upstream = [entry for entry in receipt.get("upstream", []) if entry["role"] == "release-qualification"]
          assert len(upstream) == 1, upstream
          qualification = upstream[0]
          assert qualification["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert re.fullmatch(r"[0-9]+", qualification["runId"])

          attestations = [entry for entry in receipt.get("attestations", []) if entry["role"] == "artifact-provenance"]
          assert len(attestations) == 1, attestations
          attestation = attestations[0]
          assert attestation["subjectName"] == artifact["name"]
          assert attestation["subjectDigest"] == artifact["digest"]
          assert attestation["predicateType"].endswith("/artifact-provenance/v1")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"source_sha={receipt['source']['sha']}\n")
              handle.write(f"artifact_name={artifact['name']}\n")
              handle.write(f"artifact_digest={artifact['digest']}\n")
              handle.write(f"qualification_run_id={qualification['runId']}\n")
              handle.write(f"predicate_type={attestation['predicateType']}\n")
          PY

      - name: Check out exact qualified source for store configuration
        id: checkout
        if: ${{ steps.promotion.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.promotion.outputs.source_sha }}

      - name: Verify checked-out source
        id: source
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Resolve exact qualified artifact
        id: artifact
        if: ${{ steps.source.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.promotion.outputs.qualification_run_id }}
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.promotion.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/qualification-artifacts.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("qualification-artifacts.json").read_text())
          matches = [artifact for artifact in payload.get("artifacts", []) if artifact.get("name") == os.environ["ARTIFACT_NAME"]]
          assert len(matches) == 1, matches
          artifact = matches[0]
          assert artifact.get("expired") is False, artifact
          assert artifact.get("digest") == os.environ["ARTIFACT_DIGEST"], artifact
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"id={artifact['id']}\n")
          PY

      - name: Download original qualified artifact archive
        id: artifact-download
        if: ${{ steps.artifact.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: .artifacts/reusable-workflows/qualified-expo-archive
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.promotion.outputs.qualification_run_id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Verify qualified archive and provenance
        id: verification
        if: ${{ steps.artifact-download.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.promotion.outputs.qualification_run_id }}
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.promotion.outputs.artifact_digest }}
          PREDICATE_TYPE: ${{ steps.promotion.outputs.predicate_type }}
          ARCHIVE_DIRECTORY: .artifacts/reusable-workflows/qualified-expo-archive
          VERIFICATION_PATH: .artifacts/reusable-workflows/expo-store-attestation-verification.json
        shell: bash
        run: |
          set -euo pipefail
          archive="$ARCHIVE_DIRECTORY/$ARTIFACT_NAME.zip"
          test -f "$archive"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-qualification.yml" \
            --predicate-type "$PREDICATE_TYPE" \
            --format json > "$VERIFICATION_PATH"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["VERIFICATION_PATH"]).read_text(encoding="utf-8"))
          expected_hex = os.environ["ARTIFACT_DIGEST"].split(":", 1)[1]
          for item in payload:
              statement = item.get("verificationResult", {}).get("statement", {})
              if statement.get("predicateType") != os.environ["PREDICATE_TYPE"]:
                  continue
              if not any(
                  subject.get("name") == os.environ["ARTIFACT_NAME"]
                  and subject.get("digest", {}).get("sha256") == expected_hex
                  for subject in statement.get("subject", [])
              ):
                  continue
              predicate = statement.get("predicate", {})
              if (
                  predicate.get("source", {}).get("sha") == os.environ["SOURCE_SHA"]
                  and predicate.get("artifact", {}).get("name") == os.environ["ARTIFACT_NAME"]
                  and predicate.get("artifact", {}).get("digest") == os.environ["ARTIFACT_DIGEST"]
                  and str(predicate.get("qualification", {}).get("runId")) == os.environ["QUALIFICATION_RUN_ID"]
              ):
                  break
          else:
              raise AssertionError(payload)
          PY

      - name: Extract exact mobile binaries safely
        id: extraction
        if: ${{ steps.verification.outcome == 'success' }}
        continue-on-error: true
        env:
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARCHIVE_DIRECTORY: .artifacts/reusable-workflows/qualified-expo-archive
          EXTRACT_DIRECTORY: .artifacts/reusable-workflows/qualified-expo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_DIRECTORY"]) / f"{os.environ['ARTIFACT_NAME']}.zip"
          target_root = Path(os.environ["EXTRACT_DIRECTORY"])
          shutil.rmtree(target_root, ignore_errors=True)
          target_root.mkdir(parents=True)
          root = target_root.resolve()
          with zipfile.ZipFile(archive) as handle:
              for info in handle.infolist():
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute(), info.filename
                  assert ".." not in path.parts, info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16), info.filename
                  target = (target_root / Path(*path.parts)).resolve()
                  assert target == root or root in target.parents, info.filename
              handle.extractall(target_root)
          PY

      - name: Validate mobile release manifest and binary digests
        id: mobile
        if: ${{ steps.extraction.outcome == 'success' }}
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
          EAS_CLI_VERSION: ${{ inputs.eas_cli_version }}
          EXTRACT_DIRECTORY: .artifacts/reusable-workflows/qualified-expo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["EXTRACT_DIRECTORY"]).resolve()
          manifests = list(root.rglob("mobile-release.json"))
          assert len(manifests) == 1, manifests
          manifest_path = manifests[0]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schemaVersion"] == 1
          assert manifest["sourceSha"] == os.environ["SOURCE_SHA"]
          assert manifest["buildProfile"] == "production"
          assert manifest["easCliVersion"] == os.environ["EAS_CLI_VERSION"]

          outputs = {}
          for platform, suffix in (("ios", ".ipa"), ("android", ".aab")):
              entry = manifest[platform]
              assert isinstance(entry["buildId"], str) and entry["buildId"]
              assert re.fullmatch(r"[0-9a-f]{64}", entry["sha256"])
              relative = Path(entry["path"])
              assert not relative.is_absolute()
              binary = (manifest_path.parent / relative).resolve()
              assert binary == manifest_path.parent.resolve() or manifest_path.parent.resolve() in binary.parents
              assert binary.is_file() and binary.suffix == suffix, binary
              observed = hashlib.sha256(binary.read_bytes()).hexdigest()
              assert observed == entry["sha256"], (platform, observed, entry["sha256"])
              outputs[f"{platform}_path"] = str(binary)
              outputs[f"{platform}_sha256"] = observed
              outputs[f"{platform}_build_id"] = entry["buildId"]

          evidence_dir = root.parent / "expo-store-evidence"
          evidence_dir.mkdir(parents=True, exist_ok=True)
          normalized_manifest = evidence_dir / "mobile-release.json"
          normalized_manifest.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          outputs["manifest_path"] = str(normalized_manifest)
          outputs["manifest_sha256"] = hashlib.sha256(normalized_manifest.read_bytes()).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Install exact EAS CLI
        id: eas
        if: ${{ steps.mobile.outcome == 'success' }}
        continue-on-error: true
        env:
          EAS_CLI_VERSION: ${{ inputs.eas_cli_version }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "eas-cli@$EAS_CLI_VERSION"
          test "$(eas --version | sed -nE 's/.*eas-cli\/([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')" = "$EAS_CLI_VERSION"

      - name: Submit exact iOS binary
        id: ios-submit
        if: ${{ steps.eas.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile }}
          IOS_PATH: ${{ steps.mobile.outputs.ios_path }}
          IOS_LOG: ${{ github.workspace }}/.artifacts/reusable-workflows/expo-store-evidence/ios-submit.log
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -f "$IOS_PATH"
          eas submit --platform ios --profile "$SUBMIT_PROFILE" --path "$IOS_PATH" --non-interactive --wait 2>&1 | tee "$IOS_LOG"

      - name: Submit exact Android binary
        id: android-submit
        if: ${{ steps.eas.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile }}
          ANDROID_PATH: ${{ steps.mobile.outputs.android_path }}
          ANDROID_LOG: ${{ github.workspace }}/.artifacts/reusable-workflows/expo-store-evidence/android-submit.log
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -f "$ANDROID_PATH"
          eas submit --platform android --profile "$SUBMIT_PROFILE" --path "$ANDROID_PATH" --non-interactive --wait 2>&1 | tee "$ANDROID_LOG"

      - name: Determine store-delivery outcome
        id: status
        if: ${{ always() }}
        env:
          COORDINATES_OUTCOME: ${{ steps.coordinates.outcome }}
          RECEIPT_DOWNLOAD_OUTCOME: ${{ steps.receipt-download.outcome }}
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.artifact-download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
          EAS_OUTCOME: ${{ steps.eas.outcome }}
          IOS_OUTCOME: ${{ steps.ios-submit.outcome }}
          ANDROID_OUTCOME: ${{ steps.android-submit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcome=failure
          if [[ "$COORDINATES_OUTCOME" == "success" ]] \
            && [[ "$RECEIPT_DOWNLOAD_OUTCOME" == "success" ]] \
            && [[ "$PROMOTION_OUTCOME" == "success" ]] \
            && [[ "$CHECKOUT_OUTCOME" == "success" ]] \
            && [[ "$SOURCE_OUTCOME" == "success" ]] \
            && [[ "$ARTIFACT_OUTCOME" == "success" ]] \
            && [[ "$ARTIFACT_DOWNLOAD_OUTCOME" == "success" ]] \
            && [[ "$VERIFICATION_OUTCOME" == "success" ]] \
            && [[ "$EXTRACTION_OUTCOME" == "success" ]] \
            && [[ "$MOBILE_OUTCOME" == "success" ]] \
            && [[ "$EAS_OUTCOME" == "success" ]] \
            && [[ "$IOS_OUTCOME" == "success" ]] \
            && [[ "$ANDROID_OUTCOME" == "success" ]]; then
            outcome=success
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Define delivery metadata
        id: metadata
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:-unknown}"
          short_sha="${short_sha:0:12}"
          {
            echo "receipt_artifact_name=execution-receipt-expo-store-delivery-${short_sha}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "receipt_path=.artifacts/reusable-workflows/expo-store-delivery-receipt.json"
          } >> "$GITHUB_OUTPUT"

      - name: Write store-delivery execution receipt
        if: ${{ always() }}
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RECEIPT_ARTIFACT_NAME: ${{ inputs.promotion_receipt_artifact_name }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile }}
          EAS_CLI_VERSION: ${{ inputs.eas_cli_version }}
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.promotion.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.promotion.outputs.artifact_digest }}
          IOS_BUILD_ID: ${{ steps.mobile.outputs.ios_build_id }}
          IOS_SHA256: ${{ steps.mobile.outputs.ios_sha256 }}
          ANDROID_BUILD_ID: ${{ steps.mobile.outputs.android_build_id }}
          ANDROID_SHA256: ${{ steps.mobile.outputs.android_sha256 }}
          MANIFEST_PATH: ${{ steps.mobile.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.mobile.outputs.manifest_sha256 }}
          VERIFICATION_PATH: .artifacts/reusable-workflows/expo-store-attestation-verification.json
          IOS_LOG: .artifacts/reusable-workflows/expo-store-evidence/ios-submit.log
          ANDROID_LOG: .artifacts/reusable-workflows/expo-store-evidence/android-submit.log
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
          OUTCOME: ${{ steps.status.outputs.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
          IOS_OUTCOME: ${{ steps.ios-submit.outcome }}
          ANDROID_OUTCOME: ${{ steps.android-submit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def evidence(role, name, path, digest=None):
              item = {"role": role, "name": name, "path": path, "digest": digest}
              return item

          items = []
          if re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ.get("ARTIFACT_DIGEST", "")):
              items.append(evidence("qualified-artifact", os.environ["ARTIFACT_NAME"], None, os.environ["ARTIFACT_DIGEST"]))
          for role, name, digest in (
              ("ios-binary", os.environ.get("IOS_BUILD_ID", "ios"), os.environ.get("IOS_SHA256", "")),
              ("android-binary", os.environ.get("ANDROID_BUILD_ID", "android"), os.environ.get("ANDROID_SHA256", "")),
              ("mobile-release-manifest", "mobile-release-v1", os.environ.get("MANIFEST_SHA256", "")),
          ):
              if re.fullmatch(r"[0-9a-f]{64}", digest):
                  items.append(evidence(role, name, None if role != "mobile-release-manifest" else os.environ.get("MANIFEST_PATH"), f"sha256:{digest}"))

          for role, name, raw_path in (
              ("attestation-verification", "expo-store-attestation-verification", os.environ["VERIFICATION_PATH"]),
              ("ios-submission-log", "ios-submit", os.environ["IOS_LOG"]),
              ("android-submission-log", "android-submit", os.environ["ANDROID_LOG"]),
          ):
              path = Path(raw_path)
              if path.is_file():
                  items.append(evidence(role, name, raw_path, f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"))

          source_sha = os.environ.get("SOURCE_SHA", "").lower()
          receipt = {
              "schemaVersion": 1,
              "kind": "reusable-workflows/execution-receipt",
              "capability": {"name": "deliver-qualified-expo-stores", "interfaceVersion": 1},
              "source": {"repository": os.environ["GITHUB_REPOSITORY"], "sha": source_sha},
              "result": {
                  "outcome": os.environ["OUTCOME"],
                  "steps": {
                      "provenanceVerification": os.environ["VERIFICATION_OUTCOME"],
                      "mobileReleaseManifest": os.environ["MOBILE_OUTCOME"],
                      "iosSubmit": os.environ["IOS_OUTCOME"],
                      "androidSubmit": os.environ["ANDROID_OUTCOME"],
                  },
                  "delivery": {
                      "submitProfile": os.environ["SUBMIT_PROFILE"],
                      "easCliVersion": os.environ["EAS_CLI_VERSION"],
                      "iosBuildId": os.environ.get("IOS_BUILD_ID") or None,
                      "androidBuildId": os.environ.get("ANDROID_BUILD_ID") or None,
                  },
              },
              "evidence": items,
              "attestations": [],
              "upstream": [{
                  "role": "artifact-promotion",
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "runId": os.environ["PROMOTION_RUN_ID"],
                  "receiptArtifactName": os.environ["PROMOTION_RECEIPT_ARTIFACT_NAME"],
              }],
              "run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "callerWorkflowRef": os.environ.get("GITHUB_WORKFLOW_REF"),
              },
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate execution receipt contract
        if: ${{ always() }}
        env:
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["RECEIPT_PATH"], encoding="utf-8") as handle:
              receipt = json.load(handle)
          outcomes = {"success", "failure", "cancelled", "skipped"}
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "deliver-qualified-expo-stores", "interfaceVersion": 1}
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])
          assert receipt["result"]["outcome"] in {"success", "failure"}
          assert all(value in outcomes for value in receipt["result"]["steps"].values())
          assert len(receipt["upstream"]) == 1 and receipt["upstream"][0]["role"] == "artifact-promotion"
          if receipt["result"]["outcome"] == "success":
              roles = {item["role"] for item in receipt["evidence"]}
              assert {"qualified-artifact", "ios-binary", "android-binary", "mobile-release-manifest", "ios-submission-log", "android-submission-log"} <= roles
          PY

      - name: Upload delivery receipt and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.receipt_artifact_name }}
          path: |
            ${{ steps.metadata.outputs.receipt_path }}
            .artifacts/reusable-workflows/expo-store-evidence
            .artifacts/reusable-workflows/expo-store-attestation-verification.json
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Propagate store-delivery failure
        if: ${{ always() && steps.status.outputs.outcome != 'success' }}
        shell: bash
        run: exit 1
