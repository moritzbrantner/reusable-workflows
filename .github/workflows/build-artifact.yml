name: Build Artifact

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character consumer commit SHA to build.
        required: true
        type: string
      artifact_key:
        description: Stable caller-owned semantic identity for the built artifact.
        required: true
        type: string
      working_directory:
        description: Repository-relative directory in which setup and build commands run.
        required: false
        type: string
        default: "."
      node_version:
        description: Optional exact or semver-compatible Node.js version to install before setup/build on a cache miss.
        required: false
        type: string
        default: ""
      bun_version:
        description: Optional exact or semver-compatible Bun version to install before setup/build on a cache miss.
        required: false
        type: string
        default: ""
      cache_bun:
        description: Cache Bun's package cache on build misses.
        required: false
        type: boolean
        default: false
      bun_cache_dependency_path:
        description: Lockfile glob used to key the Bun package cache.
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        description: Cache npm's package cache on build misses.
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        description: Lockfile glob used to key the npm package cache.
        required: false
        type: string
        default: "**/package-lock.json"
      setup_command:
        description: Optional repository-owned bootstrap/setup command.
        required: false
        type: string
        default: ""
      build_command:
        description: Repository-owned command that builds the artifact exactly once.
        required: true
        type: string
      artifact_paths:
        description: Newline-separated repository-relative paths that make up the built artifact.
        required: true
        type: string
      reuse_across_runs:
        description: Reuse a still-retained verified artifact with the same exact identity instead of rebuilding. Callers must consume producer_run_id rather than assuming the current run.
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: Maximum artifact-build job runtime.
        required: false
        type: number
        default: 45
      artifact_retention_days:
        description: Retention period for the built artifact and execution receipt.
        required: false
        type: number
        default: 7
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false
    outputs:
      source_sha:
        description: Exact source commit SHA that was built.
        value: ${{ jobs.build-artifact.outputs.source_sha }}
      artifact_key:
        description: Caller-owned artifact identity carried by this build.
        value: ${{ jobs.build-artifact.outputs.artifact_key }}
      producer_run_id:
        description: Workflow run ID that actually produced the returned artifact and receipt. This may refer to an earlier run when reuse_across_runs is enabled.
        value: ${{ jobs.build-artifact.outputs.producer_run_id }}
      reused:
        description: Whether this invocation reused a verified artifact from an earlier build instead of rebuilding it.
        value: ${{ jobs.build-artifact.outputs.reused }}
      artifact_name:
        description: Name of the uploaded built artifact.
        value: ${{ jobs.build-artifact.outputs.artifact_name }}
      artifact_digest:
        description: SHA-256 digest reported by actions/upload-artifact for the built artifact archive.
        value: ${{ jobs.build-artifact.outputs.artifact_digest }}
      identity_digest:
        description: SHA-256 digest of exact source, caller identity, runtime versions, setup/build commands, artifact paths, working directory, and stable runner platform identity.
        value: ${{ jobs.build-artifact.outputs.identity_digest }}
      receipt_artifact_name:
        description: Name of the verified Execution Receipt v1 artifact associated with the returned artifact.
        value: ${{ jobs.build-artifact.outputs.receipt_artifact_name }}
      receipt_path:
        description: Repository-relative execution receipt path inside the receipt artifact.
        value: ${{ jobs.build-artifact.outputs.receipt_path }}
      outcome:
        description: Artifact-build or reuse outcome before final failure propagation.
        value: ${{ jobs.build-artifact.outputs.outcome }}

jobs:
  build-artifact:
    name: Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      actions: read
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    outputs:
      source_sha: ${{ steps.coordinates.outputs.source_sha }}
      artifact_key: ${{ inputs.artifact_key }}
      producer_run_id: ${{ steps.result.outputs.producer_run_id }}
      reused: ${{ steps.result.outputs.reused }}
      artifact_name: ${{ steps.result.outputs.artifact_name }}
      artifact_digest: ${{ steps.result.outputs.artifact_digest }}
      identity_digest: ${{ steps.identity.outputs.identity_digest }}
      receipt_artifact_name: ${{ steps.result.outputs.receipt_artifact_name }}
      receipt_path: ${{ steps.metadata.outputs.receipt_path }}
      outcome: ${{ steps.status.outputs.outcome }}
    steps:
      - name: Validate exact source and artifact identity
        id: coordinates
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::source_sha must be an exact 40-character commit SHA." >&2
            exit 2
          }
          test -n "$ARTIFACT_KEY" || {
            echo "::error::artifact_key must not be empty." >&2
            exit 2
          }
          echo "source_sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify checked-out commit
        env:
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Define deterministic artifact identity
        id: identity
        if: ${{ always() }}
        working-directory: .
        env:
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
          NODE_VERSION: ${{ inputs.node_version }}
          BUN_VERSION: ${{ inputs.bun_version }}
          SETUP_COMMAND: ${{ inputs.setup_command }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          identity_hash="$(python3 - <<'PY'
          import hashlib
          import os
          value = "\0".join([
              "build-artifact-identity-v4",
              os.environ["SOURCE_SHA"],
              os.environ["ARTIFACT_KEY"],
              os.environ["NODE_VERSION"],
              os.environ["BUN_VERSION"],
              os.environ["SETUP_COMMAND"],
              os.environ["BUILD_COMMAND"],
              os.environ["ARTIFACT_PATHS"],
              os.environ["WORKING_DIRECTORY"],
              os.environ.get("RUNNER_OS", ""),
              os.environ.get("RUNNER_ARCH", ""),
              os.environ.get("ImageOS", ""),
          ])
          print(hashlib.sha256(value.encode("utf-8")).hexdigest())
          PY
          )"
          echo "identity_digest=sha256:${identity_hash}" >> "$GITHUB_OUTPUT"

      - name: Find reusable artifact receipt
        id: reuse-candidate
        if: ${{ inputs.reuse_across_runs && steps.coordinates.outcome == 'success' && steps.identity.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          IDENTITY_DIGEST: ${{ steps.identity.outputs.identity_digest }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          identity_hash="${IDENTITY_DIGEST#sha256:}"
          short_identity="${identity_hash:0:12}"
          receipt_prefix="execution-receipt-build-artifact-${short_sha}-${short_identity}-"
          export RECEIPT_PREFIX="$receipt_prefix"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > "$RUNNER_TEMP/build-artifact-reuse-candidates.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("build-artifact-reuse-candidates.json")
              .read_text(encoding="utf-8")
          )
          pages = payload if isinstance(payload, list) else [payload]
          artifacts = [
              artifact
              for page in pages
              for artifact in page.get("artifacts", [])
          ]
          prefix = os.environ["RECEIPT_PREFIX"]
          candidates = []
          for artifact in artifacts:
              if artifact.get("expired") is not False:
                  continue
              name = artifact.get("name") or ""
              if not name.startswith(prefix):
                  continue
              workflow_run = artifact.get("workflow_run") or {}
              run_id = workflow_run.get("id")
              artifact_id = artifact.get("id")
              if not isinstance(run_id, int) or not isinstance(artifact_id, int):
                  continue
              candidates.append(artifact)

          candidates.sort(
              key=lambda artifact: (
                  artifact.get("created_at") or "",
                  artifact.get("id") or 0,
              ),
              reverse=True,
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              if not candidates:
                  handle.write("candidate_found=false\n")
              else:
                  candidate = candidates[0]
                  handle.write("candidate_found=true\n")
                  handle.write(f"receipt_artifact_id={candidate['id']}\n")
                  handle.write(f"receipt_artifact_name={candidate['name']}\n")
                  handle.write(f"producer_run_id={candidate['workflow_run']['id']}\n")
          PY

      - name: Download reusable artifact receipt
        id: reuse-receipt-download
        if: ${{ steps.reuse-candidate.outcome == 'success' && steps.reuse-candidate.outputs.candidate_found == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.reuse-candidate.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/build-artifact-reuse-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reuse-candidate.outputs.producer_run_id }}
          digest-mismatch: error

      - name: Verify reusable artifact receipt and coordinates
        id: reuse
        if: ${{ steps.reuse-receipt-download.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_DIRECTORY: ${{ runner.temp }}/build-artifact-reuse-receipt
          RECEIPT_ARTIFACT_ID: ${{ steps.reuse-candidate.outputs.receipt_artifact_id }}
          RECEIPT_ARTIFACT_NAME: ${{ steps.reuse-candidate.outputs.receipt_artifact_name }}
          PRODUCER_RUN_ID: ${{ steps.reuse-candidate.outputs.producer_run_id }}
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
          IDENTITY_DIGEST: ${{ steps.identity.outputs.identity_digest }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/build-artifact-reuse-producer-artifacts.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt_paths = list(
              Path(os.environ["RECEIPT_DIRECTORY"]).rglob("build-artifact-receipt.json")
          )
          assert len(receipt_paths) == 1, receipt_paths
          receipt = json.loads(receipt_paths[0].read_text(encoding="utf-8"))

          expected_source = os.environ["SOURCE_SHA"].lower()
          expected_identity = os.environ["IDENTITY_DIGEST"].lower()
          producer_run_id = os.environ["PRODUCER_RUN_ID"]

          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "build-artifact", "interfaceVersion": 1}
          assert receipt["source"]["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["source"]["sha"] == expected_source
          assert receipt["result"]["outcome"] == "success"
          assert str(receipt["run"]["id"]) == producer_run_id

          artifacts = [
              entry for entry in receipt["evidence"] if entry.get("role") == "built-artifact"
          ]
          identities = [
              entry for entry in receipt["evidence"] if entry.get("role") == "artifact-identity"
          ]
          assert len(artifacts) == 1, artifacts
          assert len(identities) == 1, identities
          artifact = artifacts[0]
          identity = identities[0]
          assert identity["name"] == os.environ["ARTIFACT_KEY"]
          assert identity["digest"].lower() == expected_identity
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", expected_identity)
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact.get("digest") or "")
          assert isinstance(artifact.get("name"), str) and artifact["name"]

          pages = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("build-artifact-reuse-producer-artifacts.json")
              .read_text(encoding="utf-8")
          )
          pages = pages if isinstance(pages, list) else [pages]
          producer_artifacts = [
              item for page in pages for item in page.get("artifacts", [])
          ]
          receipt_matches = [
              item
              for item in producer_artifacts
              if str(item.get("id")) == os.environ["RECEIPT_ARTIFACT_ID"]
              and item.get("name") == os.environ["RECEIPT_ARTIFACT_NAME"]
              and item.get("expired") is False
          ]
          artifact_matches = [
              item
              for item in producer_artifacts
              if item.get("name") == artifact["name"]
              and item.get("expired") is False
          ]
          assert len(receipt_matches) == 1, receipt_matches
          assert len(artifact_matches) == 1, artifact_matches
          assert artifact_matches[0].get("digest") == artifact["digest"], artifact_matches[0]

          raw_digest = artifact["digest"].split(":", 1)[1]
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write("hit=true\n")
              handle.write(f"producer_run_id={producer_run_id}\n")
              handle.write(f"receipt_artifact_name={os.environ['RECEIPT_ARTIFACT_NAME']}\n")
              handle.write(f"artifact_name={artifact['name']}\n")
              handle.write(f"artifact_digest={raw_digest}\n")
          PY

      - name: Set up Bun
        id: bun-setup
        if: ${{ steps.reuse.outputs.hit != 'true' && inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        id: node-setup
        if: ${{ steps.reuse.outputs.hit != 'true' && inputs.node_version != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        id: bun-cache
        if: ${{ steps.reuse.outputs.hit != 'true' && inputs.cache_bun }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        id: npm-cache
        if: ${{ steps.reuse.outputs.hit != 'true' && inputs.cache_node }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Detect environment-v1 declaration
        id: environment
        working-directory: .
        run: |
          set -euo pipefail
          detected=false
          if [[ -f .repository-environment.toml && -f scripts/codex-environment.sh ]]; then
            detected=true
          fi
          echo "detected=$detected" >> "$GITHUB_OUTPUT"

      - name: Run repository bootstrap
        id: bootstrap
        if: ${{ steps.reuse.outputs.hit != 'true' && inputs.setup_command != '' }}
        continue-on-error: true
        run: ${{ inputs.setup_command }}

      - name: Run standard environment-v1 setup
        id: environment-setup
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.environment.outputs.detected == 'true' && (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped') }}
        continue-on-error: true
        working-directory: .
        run: bash scripts/codex-environment.sh setup

      - name: Verify preparation preserves tracked state
        id: environment-state
        if: ${{ steps.environment-setup.outcome == 'success' }}
        continue-on-error: true
        working-directory: .
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Build artifact once
        id: build
        if: ${{ steps.reuse.outputs.hit != 'true' && (steps.bootstrap.outcome == 'success' || steps.bootstrap.outcome == 'skipped') && (steps.environment-setup.outcome == 'success' || steps.environment-setup.outcome == 'skipped') && (steps.environment-state.outcome == 'success' || steps.environment-state.outcome == 'skipped') }}
        continue-on-error: true
        run: ${{ inputs.build_command }}

      - name: Define immutable artifact metadata
        id: metadata
        if: ${{ always() }}
        working-directory: .
        env:
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          IDENTITY_DIGEST: ${{ steps.identity.outputs.identity_digest }}
        run: |
          set -euo pipefail
          identity_hash="${IDENTITY_DIGEST#sha256:}"
          short_sha="${SOURCE_SHA:0:12}"
          short_identity="${identity_hash:0:12}"
          {
            echo "artifact_name=build-artifact-${short_sha}-${short_identity}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "receipt_artifact_name=execution-receipt-build-artifact-${short_sha}-${short_identity}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "receipt_path=.artifacts/reusable-workflows/build-artifact-receipt.json"
          } >> "$GITHUB_OUTPUT"

      - name: Upload built artifact
        id: artifact
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Determine artifact-build outcome
        id: status
        if: ${{ always() }}
        working-directory: .
        env:
          COORDINATES_OUTCOME: ${{ steps.coordinates.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          BUN_SETUP_OUTCOME: ${{ steps.bun-setup.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.node-setup.outcome }}
          BUN_CACHE_OUTCOME: ${{ steps.bun-cache.outcome }}
          NPM_CACHE_OUTCOME: ${{ steps.npm-cache.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ENVIRONMENT_SETUP_OUTCOME: ${{ steps.environment-setup.outcome }}
          ENVIRONMENT_STATE_OUTCOME: ${{ steps.environment-state.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          outcome=failure
          if [[ "$COORDINATES_OUTCOME" == "success" ]] \
            && [[ "$IDENTITY_OUTCOME" == "success" ]] \
            && [[ "$REUSE_HIT" == "true" ]]; then
            outcome=success
          elif [[ "$COORDINATES_OUTCOME" == "success" ]] \
            && [[ "$IDENTITY_OUTCOME" == "success" ]] \
            && [[ "$BUN_SETUP_OUTCOME" == "success" || "$BUN_SETUP_OUTCOME" == "skipped" ]] \
            && [[ "$NODE_SETUP_OUTCOME" == "success" || "$NODE_SETUP_OUTCOME" == "skipped" ]] \
            && [[ "$BUN_CACHE_OUTCOME" == "success" || "$BUN_CACHE_OUTCOME" == "skipped" ]] \
            && [[ "$NPM_CACHE_OUTCOME" == "success" || "$NPM_CACHE_OUTCOME" == "skipped" ]] \
            && [[ "$BOOTSTRAP_OUTCOME" == "success" || "$BOOTSTRAP_OUTCOME" == "skipped" ]] \
            && [[ "$ENVIRONMENT_SETUP_OUTCOME" == "success" || "$ENVIRONMENT_SETUP_OUTCOME" == "skipped" ]] \
            && [[ "$ENVIRONMENT_STATE_OUTCOME" == "success" || "$ENVIRONMENT_STATE_OUTCOME" == "skipped" ]] \
            && [[ "$BUILD_OUTCOME" == "success" ]] \
            && [[ "$ARTIFACT_OUTCOME" == "success" ]]; then
            outcome=success
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Write build execution receipt
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        working-directory: .
        env:
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
          IDENTITY_DIGEST: ${{ steps.identity.outputs.identity_digest }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
          OUTCOME: ${{ steps.status.outputs.outcome }}
          COORDINATES_OUTCOME: ${{ steps.coordinates.outcome }}
          BUN_SETUP_OUTCOME: ${{ steps.bun-setup.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.node-setup.outcome }}
          BUN_CACHE_OUTCOME: ${{ steps.bun-cache.outcome }}
          NPM_CACHE_OUTCOME: ${{ steps.npm-cache.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ENVIRONMENT_SETUP_OUTCOME: ${{ steps.environment-setup.outcome }}
          ENVIRONMENT_STATE_OUTCOME: ${{ steps.environment-state.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_digest = os.environ.get("ARTIFACT_DIGEST") or None
          receipt = {
              "schemaVersion": 1,
              "kind": "reusable-workflows/execution-receipt",
              "capability": {"name": "build-artifact", "interfaceVersion": 1},
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["SOURCE_SHA"].lower(),
              },
              "result": {
                  "outcome": os.environ["OUTCOME"],
                  "steps": {
                      "coordinates": os.environ["COORDINATES_OUTCOME"],
                      "bunSetup": os.environ["BUN_SETUP_OUTCOME"],
                      "nodeSetup": os.environ["NODE_SETUP_OUTCOME"],
                      "bunCache": os.environ["BUN_CACHE_OUTCOME"],
                      "npmCache": os.environ["NPM_CACHE_OUTCOME"],
                      "bootstrap": os.environ["BOOTSTRAP_OUTCOME"],
                      "environmentSetup": os.environ["ENVIRONMENT_SETUP_OUTCOME"],
                      "environmentState": os.environ["ENVIRONMENT_STATE_OUTCOME"],
                      "build": os.environ["BUILD_OUTCOME"],
                      "artifactUpload": os.environ["ARTIFACT_OUTCOME"],
                  },
              },
              "evidence": [
                  {
                      "role": "built-artifact",
                      "name": os.environ["ARTIFACT_NAME"],
                      "path": None,
                      "digest": f"sha256:{artifact_digest}" if artifact_digest else None,
                  },
                  {
                      "role": "artifact-identity",
                      "name": os.environ["ARTIFACT_KEY"],
                      "path": None,
                      "digest": os.environ["IDENTITY_DIGEST"],
                  },
              ],
              "run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "callerWorkflowRef": os.environ.get("GITHUB_WORKFLOW_REF"),
              },
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate Execution Receipt v1
        id: receipt-validation
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        working-directory: .
        env:
          RECEIPT_PATH: ${{ steps.metadata.outputs.receipt_path }}
          SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
          IDENTITY_DIGEST: ${{ steps.identity.outputs.identity_digest }}
          OUTCOME: ${{ steps.status.outputs.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["RECEIPT_PATH"], encoding="utf-8") as handle:
              receipt = json.load(handle)

          outcomes = {"success", "failure", "cancelled", "skipped"}
          assert receipt["schemaVersion"] == 1
          assert receipt["kind"] == "reusable-workflows/execution-receipt"
          assert receipt["capability"] == {"name": "build-artifact", "interfaceVersion": 1}
          assert receipt["source"]["sha"] == os.environ["SOURCE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["source"]["sha"])
          assert receipt["result"]["outcome"] == os.environ["OUTCOME"]
          assert all(value in outcomes for value in receipt["result"]["steps"].values())
          evidence = receipt["evidence"]
          assert len(evidence) == 2
          artifact = next(item for item in evidence if item["role"] == "built-artifact")
          identity = next(item for item in evidence if item["role"] == "artifact-identity")
          assert identity["name"] == os.environ["ARTIFACT_KEY"]
          assert identity["digest"] == os.environ["IDENTITY_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", identity["digest"])
          assert artifact["digest"] is None or re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])
          assert re.fullmatch(r"[0-9]+", receipt["run"]["id"])
          assert isinstance(receipt["run"]["attempt"], int) and receipt["run"]["attempt"] >= 1
          PY

      - name: Upload execution receipt
        id: receipt-upload
        if: ${{ always() && steps.reuse.outputs.hit != 'true' && steps.metadata.outcome == 'success' && steps.receipt-validation.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.receipt_artifact_name }}
          path: ${{ steps.metadata.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Resolve returned artifact coordinates
        id: result
        if: ${{ always() }}
        working-directory: .
        env:
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          REUSE_PRODUCER_RUN_ID: ${{ steps.reuse.outputs.producer_run_id }}
          REUSE_RECEIPT_ARTIFACT_NAME: ${{ steps.reuse.outputs.receipt_artifact_name }}
          REUSE_ARTIFACT_NAME: ${{ steps.reuse.outputs.artifact_name }}
          REUSE_ARTIFACT_DIGEST: ${{ steps.reuse.outputs.artifact_digest }}
          BUILT_ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          BUILT_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          BUILT_RECEIPT_ARTIFACT_NAME: ${{ steps.metadata.outputs.receipt_artifact_name }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_HIT" == "true" ]]; then
            {
              echo "producer_run_id=$REUSE_PRODUCER_RUN_ID"
              echo "reused=true"
              echo "receipt_artifact_name=$REUSE_RECEIPT_ARTIFACT_NAME"
              echo "artifact_name=$REUSE_ARTIFACT_NAME"
              echo "artifact_digest=$REUSE_ARTIFACT_DIGEST"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "producer_run_id=$GITHUB_RUN_ID"
              echo "reused=false"
              echo "receipt_artifact_name=$BUILT_RECEIPT_ARTIFACT_NAME"
              echo "artifact_name=$BUILT_ARTIFACT_NAME"
              echo "artifact_digest=$BUILT_ARTIFACT_DIGEST"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Propagate artifact-build failure
        if: ${{ always() }}
        working-directory: .
        env:
          OUTCOME: ${{ steps.status.outputs.outcome }}
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          RECEIPT_VALIDATION_OUTCOME: ${{ steps.receipt-validation.outcome }}
          RECEIPT_UPLOAD_OUTCOME: ${{ steps.receipt-upload.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "success"
          if [[ "$REUSE_HIT" != "true" ]]; then
            test "$RECEIPT_VALIDATION_OUTCOME" = "success"
            test "$RECEIPT_UPLOAD_OUTCOME" = "success"
          fi
