name: Format reuse reporter

on:
  push:
    branches:
      - feat/ci-reuse-efficiency-report

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun x oxfmt scripts/report-build-artifact-reuse.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-reuse-reporter
          path: scripts/report-build-artifact-reuse.mjs
          if-no-files-found: error
          retention-days: 1
