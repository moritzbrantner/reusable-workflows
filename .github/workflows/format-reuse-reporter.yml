name: Format reuse reporter

on:
  push:
    branches:
      - feat/ci-reuse-efficiency-report

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun x oxfmt scripts/report-build-artifact-reuse.mjs
      - name: Emit formatted reporter
        run: |
          echo FORMAT_BEGIN
          base64 -w0 scripts/report-build-artifact-reuse.mjs
          echo
          echo FORMAT_END
