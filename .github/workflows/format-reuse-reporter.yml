name: Format reuse reporter

on:
  push:
    branches:
      - feat/ci-reuse-efficiency-report

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun x oxfmt scripts/report-build-artifact-reuse.mjs
      - name: Commit formatted reporter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/report-build-artifact-reuse.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format reuse reporter"
          git push
