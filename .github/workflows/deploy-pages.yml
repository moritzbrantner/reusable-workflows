name: Deploy Pages

on:
  workflow_call:
    outputs:
      page_url:
        description: "The deployed GitHub Pages URL."
        value: ${{ jobs.deploy-pages.outputs.page_url }}
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.14"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      artifact_path:
        required: false
        type: string
        default: "dist"
      prebuilt_artifact_run_id:
        description: Exact build-artifact producer run ID. Empty keeps the existing local-build path.
        required: false
        type: string
        default: ""
      prebuilt_artifact_receipt_name:
        description: Exact build-artifact Execution Receipt artifact name.
        required: false
        type: string
        default: ""
      prebuilt_artifact_name:
        description: Exact immutable build artifact name.
        required: false
        type: string
        default: ""
      prebuilt_artifact_digest:
        description: Raw 64-character SHA-256 digest emitted by build-artifact.yml.
        required: false
        type: string
        default: ""
      prebuilt_source_sha:
        description: Exact source SHA bound to the prebuilt artifact.
        required: false
        type: string
        default: ""
      prebuilt_artifact_key:
        description: Caller-owned semantic artifact key bound to the prebuilt artifact.
        required: false
        type: string
        default: ""
      prebuilt_identity_digest:
        description: sha256-prefixed deterministic artifact identity digest.
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 30
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: false
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-deploy-pages', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.prebuilt_source_sha != '' && inputs.prebuilt_source_sha || github.sha }}

      - name: Validate prebuilt artifact coordinates
        working-directory: .
        env:
          RUN_ID: ${{ inputs.prebuilt_artifact_run_id }}
          RECEIPT_NAME: ${{ inputs.prebuilt_artifact_receipt_name }}
          ARTIFACT_NAME: ${{ inputs.prebuilt_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.prebuilt_artifact_digest }}
          SOURCE_SHA: ${{ inputs.prebuilt_source_sha }}
          ARTIFACT_KEY: ${{ inputs.prebuilt_artifact_key }}
          IDENTITY_DIGEST: ${{ inputs.prebuilt_identity_digest }}
        run: |
          set -euo pipefail
          values=("$RUN_ID" "$RECEIPT_NAME" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" "$SOURCE_SHA" "$ARTIFACT_KEY" "$IDENTITY_DIGEST")
          populated=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              populated=$((populated + 1))
            fi
          done
          if [[ "$populated" -ne 0 && "$populated" -ne "${#values[@]}" ]]; then
            echo "::error::Prebuilt artifact coordinates must be supplied all-or-none." >&2
            exit 2
          fi

      - name: Set up Bun
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.node_version != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.cache_bun }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.cache_node }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run pre-command
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Consume verified prebuilt artifact
        if: ${{ inputs.prebuilt_artifact_run_id != '' }}
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@956c234b40cd834e3fa7601e372decff43417456
        with:
          producer_run_id: ${{ inputs.prebuilt_artifact_run_id }}
          receipt_artifact_name: ${{ inputs.prebuilt_artifact_receipt_name }}
          artifact_name: ${{ inputs.prebuilt_artifact_name }}
          artifact_digest: ${{ inputs.prebuilt_artifact_digest }}
          source_sha: ${{ inputs.prebuilt_source_sha }}
          artifact_key: ${{ inputs.prebuilt_artifact_key }}
          identity_digest: ${{ inputs.prebuilt_identity_digest }}
          destination_path: ${{ inputs.working_directory == '.' && inputs.artifact_path || format('{0}/{1}', inputs.working_directory, inputs.artifact_path) }}
          github_token: ${{ github.token }}

      - name: Build
        if: ${{ inputs.prebuilt_artifact_run_id == '' && inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
