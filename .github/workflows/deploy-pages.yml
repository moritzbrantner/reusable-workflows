name: Deploy Pages

on:
  workflow_call:
    outputs:
      page_url:
        description: "The deployed GitHub Pages URL."
        value: ${{ jobs.deploy-pages.outputs.page_url }}
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.12"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      artifact_path:
        required: false
        type: string
        default: "dist"
      timeout_minutes:
        required: false
        type: number
        default: 30
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      concurrency_group:
        required: false
        type: string
        default: "pages"
      cancel_in_progress:
        required: false
        type: boolean
        default: false
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Run pre-command
        if: ${{ inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.working_directory }}/${{ inputs.artifact_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
