name: Dirbase PR 102 rustfmt capture

on:
  push:
    branches:
      - ci/dirbase-102-exact-head

permissions:
  contents: read

concurrency:
  group: dirbase-pr-102-rustfmt-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dirbase exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/dirbase
          ref: f766d21445e5b4fb0f02c3f10b811a712caf3d5c

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "f766d21445e5b4fb0f02c3f10b811a712caf3d5c"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.89.0"
          components: rustfmt

      - name: Capture canonical rustfmt output
        run: |
          set -euo pipefail
          cargo fmt --all
          mkdir -p .artifacts/rustfmt
          git diff --name-only -- '*.rs' > .artifacts/rustfmt/manifest.txt
          test -s .artifacts/rustfmt/manifest.txt
          while IFS= read -r path; do
            mkdir -p ".artifacts/rustfmt/$(dirname "$path")"
            cp "$path" ".artifacts/rustfmt/$path"
          done < .artifacts/rustfmt/manifest.txt

      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dirbase-pr-102-rustfmt-f766d21445e5
          path: .artifacts/rustfmt
          if-no-files-found: error
          retention-days: 1
