name: Dirbase PR 102 exact-head validation

on:
  push:
    branches:
      - ci/dirbase-102-exact-head

permissions:
  contents: read

concurrency:
  group: dirbase-pr-102-exact-head
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out dirbase exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/dirbase
          ref: a9a1f11fb14f0dfac8d258915908f1841f1d8776

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "a9a1f11fb14f0dfac8d258915908f1841f1d8776"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.89.0"
          components: rustfmt,clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          DIRBASE_REBUILD_UI: "1"
          NO_PROXY: 127.0.0.1,localhost
        run: |
          rm -rf ui/dist
          cargo test --all-features --verbose -- --test-threads=1

      - name: Validate repository test-matrix contract
        run: python3 scripts/render_test_matrix.py --check

      - name: Validate architecture harness
        run: |
          python3 -m py_compile \
            scripts/architecture_benchmark.py \
            scripts/summarize_architecture_baseline.py \
            scripts/summarize_architecture_baseline_test.py
          python3 scripts/summarize_architecture_baseline_test.py
          bash -n scripts/architecture-contract.sh
          bash -n scripts/moonlight-architecture-compare.sh

      - name: Run architecture semantic contract
        run: bash scripts/architecture-contract.sh
