name: Dirbase PR 102 rustfmt capture

on:
  push:
    branches:
      - ci/dirbase-102-exact-head

permissions:
  contents: write

concurrency:
  group: dirbase-pr-102-rustfmt-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dirbase exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/dirbase
          ref: f766d21445e5b4fb0f02c3f10b811a712caf3d5c
          path: dirbase

      - name: Verify exact source revision
        run: test "$(git -C dirbase rev-parse HEAD)" = "f766d21445e5b4fb0f02c3f10b811a712caf3d5c"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.89.0"
          components: rustfmt

      - name: Format exact dirbase head
        working-directory: dirbase
        run: cargo fmt --all

      - name: Check out diagnostic host branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/reusable-workflows
          ref: ci/dirbase-102-exact-head
          path: host

      - name: Persist canonical formatted sources on diagnostic branch
        run: |
          set -euo pipefail
          rm -rf host/.artifacts/dirbase-pr-102-rustfmt
          mkdir -p host/.artifacts/dirbase-pr-102-rustfmt
          git -C dirbase diff --name-only -- '*.rs' > host/.artifacts/dirbase-pr-102-rustfmt/manifest.txt
          test -s host/.artifacts/dirbase-pr-102-rustfmt/manifest.txt
          while IFS= read -r path; do
            mkdir -p "host/.artifacts/dirbase-pr-102-rustfmt/$(dirname "$path")"
            cp "dirbase/$path" "host/.artifacts/dirbase-pr-102-rustfmt/$path"
          done < host/.artifacts/dirbase-pr-102-rustfmt/manifest.txt
          git -C host config user.name github-actions[bot]
          git -C host config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C host add .artifacts/dirbase-pr-102-rustfmt
          git -C host commit -m "ci: persist dirbase rustfmt output"
          git -C host push origin HEAD:ci/dirbase-102-exact-head
