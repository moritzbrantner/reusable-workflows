name: Dirbase PR 102 exact-head validation

on:
  push:
    branches:
      - ci/dirbase-102-exact-head
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dirbase-pr-102-exact-head
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out dirbase exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: moritzbrantner/dirbase
          ref: f766d21445e5b4fb0f02c3f10b811a712caf3d5c
          persist-credentials: false

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "f766d21445e5b4fb0f02c3f10b811a712caf3d5c"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.89.0"
          components: rustfmt,clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          DIRBASE_REBUILD_UI: "1"
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test --all-features --verbose -- --test-threads=1

      - name: Validate repository test-matrix contract
        run: python3 scripts/render_test_matrix.py --check

      - name: Validate architecture contract
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: bash scripts/architecture-contract.sh
