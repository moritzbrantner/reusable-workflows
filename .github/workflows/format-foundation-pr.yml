name: Format Foundation PR

on:
  push:
    branches:
      - chore/foundation-conformance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/foundation-conformance
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatting
        run: |
          if git diff --quiet -- .coding-tooling.json repository-pages/app/page.tsx; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .coding-tooling.json repository-pages/app/page.tsx
          git commit -m "style: format foundation files"
          git push origin HEAD:chore/foundation-conformance
