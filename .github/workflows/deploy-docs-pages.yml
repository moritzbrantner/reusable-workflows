name: Deploy Docs Pages

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pages:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-artifact.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: reusable-workflows-web-dist-v1
      bun_version: "1.4.0"
      cache_bun: true
      build_command: "bun run build && bun run size:check:dist"
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 1

  deploy-pages:
    needs: build-pages
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: ""
      artifact_path: dist
      prebuilt_artifact_run_id: ${{ needs.build-pages.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-pages.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-pages.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-pages.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-pages.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-pages.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
      concurrency_group: docs-pages
      cancel_in_progress: false
      timeout_minutes: 15
