name: Deploy Docs Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-pages:
    uses: ./.github/workflows/deploy-pages.yml
    with:
      bun_version: "1.3.14"
      install_command: "bun install --frozen-lockfile"
      build_command: "bun run build"
      artifact_path: dist
      timeout_minutes: 10
      concurrency_group: docs-pages
      cancel_in_progress: false
