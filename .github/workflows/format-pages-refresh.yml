name: Format Pages Refresh

on:
  push:
    branches:
      - docs/refresh-pages-capability-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/refresh-pages-capability-architecture
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/HomePage.tsx src/pages/AdoptionPage.tsx src/pages/WorkflowPage.tsx tests/e2e/reference-page.spec.ts
          git commit -m "style: format Pages refresh"
          git push origin HEAD:docs/refresh-pages-capability-architecture
