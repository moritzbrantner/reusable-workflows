name: E2E Validation

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Failure or requested artifact name for this validation job."
        value: ${{ jobs.e2e-validation.outputs.artifact_name }}
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.14"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      e2e_command:
        required: false
        type: string
        default: ""
      post_command:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 45
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      cache_cargo:
        required: false
        type: boolean
        default: false
      cargo_cache_dependency_path:
        required: false
        type: string
        default: "**/Cargo.lock"
      install_playwright:
        required: false
        type: boolean
        default: true
      install_playwright_browsers:
        required: false
        type: string
        default: ""
      install_xvfb:
        required: false
        type: boolean
        default: false
      artifact_paths:
        required: false
        type: string
        default: |
          playwright-report
          test-results
      upload_artifacts_on:
        required: false
        type: string
        default: "failure"
      artifact_retention_days:
        required: false
        type: number
        default: 7
      artifact_name_suffix:
        required: false
        type: string
        default: ""
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: true
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  e2e-validation:
    name: E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-e2e-validation', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set artifact name
        id: artifact-name
        run: echo "name=e2e-validation-artifacts${{ inputs.artifact_name_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate artifact upload mode
        if: ${{ inputs.upload_artifacts_on != 'failure' && inputs.upload_artifacts_on != 'always' && inputs.upload_artifacts_on != 'never' }}
        run: |
          echo "::error::upload_artifacts_on must be one of: failure, always, never." >&2
          exit 1

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Cargo
        if: ${{ inputs.cache_cargo }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles(inputs.cargo_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Xvfb
        if: ${{ inputs.install_xvfb }}
        run: sudo apt-get update && sudo apt-get install -y xvfb
        working-directory: .

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Install Playwright browsers
        if: ${{ inputs.install_playwright }}
        run: bunx playwright install --with-deps ${{ inputs.install_playwright_browsers }}

      - name: Run pre-command
        if: ${{ inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Run e2e tests
        if: ${{ inputs.e2e_command != '' && !inputs.install_xvfb }}
        run: ${{ inputs.e2e_command }}

      - name: Run e2e tests with Xvfb
        if: ${{ inputs.e2e_command != '' && inputs.install_xvfb }}
        run: xvfb-run -a ${{ inputs.e2e_command }}

      - name: Upload artifacts
        if: ${{ inputs.artifact_paths != '' && (inputs.upload_artifacts_on == 'always' || (failure() && inputs.upload_artifacts_on == 'failure')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Run post-command
        if: ${{ always() && inputs.post_command != '' }}
        run: ${{ inputs.post_command }}
