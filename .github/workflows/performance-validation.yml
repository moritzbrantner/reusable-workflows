name: Performance Validation

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Failure or requested artifact name for this validation job."
        value: ${{ jobs.performance-validation.outputs.artifact_name }}
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.14"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      unlighthouse_command:
        required: false
        type: string
        default: ""
      benchmark_command:
        required: false
        type: string
        default: ""
      bundle_size_command:
        required: false
        type: string
        default: ""
      api_report_command:
        required: false
        type: string
        default: ""
      metrics_command:
        required: false
        type: string
        default: ""
      post_command:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 60
      cache_bun:
        required: false
        type: boolean
        default: true
      bun_cache_dependency_path:
        required: false
        type: string
        default: "**/bun.lock"
      cache_node:
        required: false
        type: boolean
        default: false
      npm_cache_dependency_path:
        required: false
        type: string
        default: "**/package-lock.json"
      cache_cargo:
        required: false
        type: boolean
        default: false
      cargo_cache_dependency_path:
        required: false
        type: string
        default: "**/Cargo.lock"
      install_playwright:
        required: false
        type: boolean
        default: false
      install_playwright_browsers:
        required: false
        type: string
        default: ""
      artifact_paths:
        required: false
        type: string
        default: |
          .unlighthouse
          unlighthouse-reports
          benchmark-results
          performance-results
      summary_paths:
        required: false
        type: string
        default: ""
      upload_artifacts_on:
        required: false
        type: string
        default: "failure"
      artifact_retention_days:
        required: false
        type: number
        default: 7
      artifact_name_suffix:
        required: false
        type: string
        default: ""
      concurrency_group:
        required: false
        type: string
        default: ""
      cancel_in_progress:
        required: false
        type: boolean
        default: true
    secrets:
      node_auth_token:
        required: false
      GH_PACKAGES_TOKEN:
        required: false

jobs:
  performance-validation:
    name: Performance Validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('{0}-{1}-performance-validation', github.workflow, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || secrets.GH_PACKAGES_TOKEN || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set artifact name
        id: artifact-name
        run: echo "name=performance-validation-artifacts${{ inputs.artifact_name_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Validate artifact upload mode
        if: ${{ inputs.upload_artifacts_on != 'failure' && inputs.upload_artifacts_on != 'always' && inputs.upload_artifacts_on != 'never' }}
        run: |
          echo "::error::upload_artifacts_on must be one of: failure, always, never." >&2
          exit 1

      - name: Set up Bun
        if: ${{ inputs.bun_version != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Set up Node.js
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache Bun
        if: ${{ inputs.cache_bun }}
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(inputs.bun_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm
        if: ${{ inputs.cache_node }}
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(inputs.npm_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Cargo
        if: ${{ inputs.cache_cargo }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles(inputs.cargo_cache_dependency_path) }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}

      - name: Install Playwright browsers
        if: ${{ inputs.install_playwright }}
        run: bunx playwright install --with-deps ${{ inputs.install_playwright_browsers }}

      - name: Run pre-command
        if: ${{ inputs.pre_command != '' }}
        run: ${{ inputs.pre_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Run Unlighthouse
        if: ${{ inputs.unlighthouse_command != '' }}
        run: ${{ inputs.unlighthouse_command }}

      - name: Run benchmarks
        if: ${{ inputs.benchmark_command != '' }}
        run: ${{ inputs.benchmark_command }}

      - name: Check bundle size
        if: ${{ inputs.bundle_size_command != '' }}
        run: ${{ inputs.bundle_size_command }}

      - name: Check API report
        if: ${{ inputs.api_report_command != '' }}
        run: ${{ inputs.api_report_command }}

      - name: Write metrics
        if: ${{ inputs.metrics_command != '' }}
        run: ${{ inputs.metrics_command }}

      - name: Publish performance summary
        if: ${{ always() && inputs.summary_paths != '' }}
        env:
          SUMMARY_PATHS: ${{ inputs.summary_paths }}
        run: |
          wrote_summary=false

          {
            echo "## Performance Summary"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r summary_path || [ -n "$summary_path" ]; do
            if [ -z "$summary_path" ]; then
              continue
            fi

            matches=()
            while IFS= read -r match; do
              matches+=("$match")
            done < <(compgen -G "$summary_path" || true)

            if [ ${#matches[@]} -eq 0 ] && [ -f "$summary_path" ]; then
              matches=("$summary_path")
            fi

            if [ ${#matches[@]} -eq 0 ]; then
              echo "::warning::No performance summary files matched: ${summary_path}"
              continue
            fi

            for summary_file in "${matches[@]}"; do
              if [ ! -f "$summary_file" ]; then
                continue
              fi

              {
                echo "### ${summary_file}"
                echo
                cat "$summary_file"
                echo
              } >> "$GITHUB_STEP_SUMMARY"

              wrote_summary=true
            done
          done <<< "$SUMMARY_PATHS"

          if [ "$wrote_summary" != "true" ]; then
            echo "_No configured performance summary files were found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: ${{ inputs.artifact_paths != '' && (inputs.upload_artifacts_on == 'always' || (failure() && inputs.upload_artifacts_on == 'failure')) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          include-hidden-files: true
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Run post-command
        if: ${{ always() && inputs.post_command != '' }}
        run: ${{ inputs.post_command }}
