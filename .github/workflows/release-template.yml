name: Release Template

on:
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: "."
      node_version:
        required: false
        type: string
        default: "24"
      bun_version:
        required: false
        type: string
        default: "1.3.12"
      install_command:
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      pre_release_command:
        required: false
        type: string
        default: ""
      validate_command:
        required: false
        type: string
        default: ""
      build_command:
        required: false
        type: string
        default: ""
      release_command:
        required: false
        type: string
        default: ""
      post_release_command:
        required: false
        type: string
        default: ""
    secrets:
      node_auth_token:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.node_auth_token || github.token }}
      GH_PACKAGES_TOKEN: ${{ secrets.node_auth_token || github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
      - if: ${{ inputs.install_command != '' }}
        run: ${{ inputs.install_command }}
      - if: ${{ inputs.pre_release_command != '' }}
        run: ${{ inputs.pre_release_command }}
      - if: ${{ inputs.validate_command != '' }}
        run: ${{ inputs.validate_command }}
      - if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}
      - if: ${{ inputs.release_command != '' }}
        run: ${{ inputs.release_command }}
      - if: ${{ always() && inputs.post_release_command != '' }}
        run: ${{ inputs.post_release_command }}
