name: Format release branch

on:
  push:
    branches:
      - feat/qualified-expo-store-delivery
    paths:
      - scripts/validate-workflow-contracts.ts
      - .github/workflows/format-release-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/qualified-expo-store-delivery
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt scripts/validate-workflow-contracts.ts
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-workflow-contracts.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format workflow validator'
          git push origin HEAD:feat/qualified-expo-store-delivery
