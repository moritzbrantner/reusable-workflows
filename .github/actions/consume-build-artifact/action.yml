name: Consume Verified Build Artifact
description: Verify an exact-source build-artifact receipt and digest, then extract the immutable artifact into the caller workspace.

inputs:
  producer_run_id:
    description: GitHub Actions run ID that produced the build artifact and receipt.
    required: true
  receipt_artifact_name:
    description: Exact Execution Receipt artifact name emitted by build-artifact.yml.
    required: true
  artifact_name:
    description: Exact built artifact name emitted by build-artifact.yml.
    required: true
  artifact_digest:
    description: Raw 64-character SHA-256 archive digest emitted by build-artifact.yml.
    required: true
  source_sha:
    description: Exact 40-character source SHA expected in the producer receipt.
    required: true
  artifact_key:
    description: Exact caller-owned semantic artifact key expected in the producer receipt.
    required: true
  identity_digest:
    description: sha256-prefixed deterministic identity digest emitted by build-artifact.yml.
    required: true
  destination_path:
    description: Caller-workspace path into which the verified artifact contents are extracted.
    required: true
  github_token:
    description: Token with actions:read permission for the caller repository.
    required: true

outputs:
  artifact_id:
    description: GitHub artifact ID that was verified and downloaded.
    value: ${{ steps.coordinates.outputs.artifact_id }}
  artifact_digest:
    description: Verified raw SHA-256 artifact archive digest.
    value: ${{ inputs.artifact_digest }}
  identity_digest:
    description: Verified deterministic artifact identity digest.
    value: ${{ inputs.identity_digest }}
  source_sha:
    description: Verified source SHA.
    value: ${{ inputs.source_sha }}

runs:
  using: composite
  steps:
    - name: Validate consumer coordinates
      shell: bash
      env:
        PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        RECEIPT_ARTIFACT_NAME: ${{ inputs.receipt_artifact_name }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        ARTIFACT_KEY: ${{ inputs.artifact_key }}
        IDENTITY_DIGEST: ${{ inputs.identity_digest }}
        DESTINATION_PATH: ${{ inputs.destination_path }}
      run: |
        set -euo pipefail
        [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]]
        test -n "$RECEIPT_ARTIFACT_NAME"
        test -n "$ARTIFACT_NAME"
        [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-fA-F]{64}$ ]]
        [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
        test -n "$ARTIFACT_KEY"
        [[ "$IDENTITY_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
        test -n "$DESTINATION_PATH"
        case "$DESTINATION_PATH" in
          /*|../*|*/../*|*/..) echo "::error::destination_path must stay inside the caller workspace." >&2; exit 2 ;;
        esac
        if [[ -d "$DESTINATION_PATH" ]] && [[ -n "$(find "$DESTINATION_PATH" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
          echo "::error::destination_path must be absent or empty before verified extraction: $DESTINATION_PATH" >&2
          exit 2
        fi
        mkdir -p "$DESTINATION_PATH"

    - name: Download producer receipt
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.receipt_artifact_name }}
        path: ${{ runner.temp }}/verified-build-artifact-receipt
        github-token: ${{ inputs.github_token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        digest-mismatch: error

    - name: Verify producer receipt and resolve immutable artifact
      id: coordinates
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        RECEIPT_DIRECTORY: ${{ runner.temp }}/verified-build-artifact-receipt
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        ARTIFACT_KEY: ${{ inputs.artifact_key }}
        IDENTITY_DIGEST: ${{ inputs.identity_digest }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import re
        import subprocess
        from pathlib import Path

        receipt_paths = list(Path(os.environ["RECEIPT_DIRECTORY"]).rglob("build-artifact-receipt.json"))
        assert len(receipt_paths) == 1, receipt_paths
        receipt = json.loads(receipt_paths[0].read_text(encoding="utf-8"))

        expected_source = os.environ["SOURCE_SHA"].lower()
        expected_artifact_digest = f"sha256:{os.environ['ARTIFACT_DIGEST'].lower()}"
        expected_identity_digest = os.environ["IDENTITY_DIGEST"].lower()

        assert receipt["schemaVersion"] == 1
        assert receipt["kind"] == "reusable-workflows/execution-receipt"
        assert receipt["capability"] == {"name": "build-artifact", "interfaceVersion": 1}
        assert receipt["source"]["repository"] == os.environ["GITHUB_REPOSITORY"]
        assert receipt["source"]["sha"] == expected_source
        assert receipt["result"]["outcome"] == "success"
        assert str(receipt["run"]["id"]) == os.environ["PRODUCER_RUN_ID"]

        artifacts = [entry for entry in receipt["evidence"] if entry.get("role") == "built-artifact"]
        identities = [entry for entry in receipt["evidence"] if entry.get("role") == "artifact-identity"]
        assert len(artifacts) == 1, artifacts
        assert len(identities) == 1, identities
        assert artifacts[0]["name"] == os.environ["ARTIFACT_NAME"]
        assert artifacts[0]["digest"] == expected_artifact_digest
        assert identities[0]["name"] == os.environ["ARTIFACT_KEY"]
        assert identities[0]["digest"].lower() == expected_identity_digest
        assert re.fullmatch(r"sha256:[0-9a-f]{64}", expected_artifact_digest)
        assert re.fullmatch(r"sha256:[0-9a-f]{64}", expected_identity_digest)

        response = subprocess.run(
            [
                "gh",
                "api",
                f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['PRODUCER_RUN_ID']}/artifacts?per_page=100",
            ],
            check=True,
            text=True,
            capture_output=True,
        )
        payload = json.loads(response.stdout)
        matches = [
            item for item in payload.get("artifacts", [])
            if item.get("name") == os.environ["ARTIFACT_NAME"]
        ]
        assert len(matches) == 1, matches
        artifact = matches[0]
        assert artifact.get("expired") is False, artifact
        assert artifact.get("digest") == expected_artifact_digest, artifact
        assert isinstance(artifact.get("id"), int), artifact

        output = Path(os.environ["GITHUB_OUTPUT"])
        with output.open("a", encoding="utf-8") as handle:
            handle.write(f"artifact_id={artifact['id']}\n")
        PY

    - name: Download exact verified artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.coordinates.outputs.artifact_id }}
        path: ${{ inputs.destination_path }}
        github-token: ${{ inputs.github_token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.producer_run_id }}
        digest-mismatch: error

    - name: Confirm verified artifact materialization
      shell: bash
      env:
        DESTINATION_PATH: ${{ inputs.destination_path }}
      run: |
        set -euo pipefail
        test -d "$DESTINATION_PATH"
        test -n "$(find "$DESTINATION_PATH" -mindepth 1 -print -quit)"
