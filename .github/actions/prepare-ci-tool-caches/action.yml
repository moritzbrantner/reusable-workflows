name: Prepare CI Tool Caches
description: Configure disposable exact-key caches for cargo-installed CLIs and Playwright browser payloads.

inputs:
  cargo_tool_cache_key:
    description: Exact caller-owned identity for cargo-installed CLI binaries. Empty disables the cache.
    required: false
    default: ""
  playwright_cache_key:
    description: Exact caller-owned identity for Playwright browser payloads. Empty disables the cache.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure Cargo install root
      if: ${{ inputs.cargo_tool_cache_key != '' }}
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/reusable-workflows-cargo-tools"
        echo "CARGO_INSTALL_ROOT=$root" >> "$GITHUB_ENV"
        echo "$root/bin" >> "$GITHUB_PATH"

    - name: Restore cargo-installed CLI cache
      if: ${{ inputs.cargo_tool_cache_key != '' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/reusable-workflows-cargo-tools
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-tools-${{ inputs.cargo_tool_cache_key }}

    - name: Configure Playwright browser path
      if: ${{ inputs.playwright_cache_key != '' }}
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/reusable-workflows-playwright"
        echo "PLAYWRIGHT_BROWSERS_PATH=$root" >> "$GITHUB_ENV"

    - name: Restore Playwright browser cache
      if: ${{ inputs.playwright_cache_key != '' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/reusable-workflows-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ inputs.playwright_cache_key }}
