name: Install Verified WASM CLI
description: Install an exact SHA-256-verified upstream WASM CLI release without compiling the CLI from source.
inputs:
  tool:
    description: "Supported tools: wasm-pack or wasm-bindgen"
    required: true
  version:
    description: "Exact supported upstream release version"
    required: true
runs:
  using: composite
  steps:
    - name: Install checksum-verified release
      shell: bash
      env:
        VERIFIED_WASM_TOOL: ${{ inputs.tool }}
        VERIFIED_WASM_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
