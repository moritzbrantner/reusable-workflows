name: Publish Observation

description: Publish one file from a same-run workflow artifact to a durable repository observation branch without interpreting its contents.

inputs:
  artifact_name:
    description: Same-run GitHub Actions artifact containing the observation file.
    required: true
  artifact_source_path:
    description: Relative path to the file inside the downloaded artifact.
    required: true
  branch:
    description: Durable branch that owns published observations.
    required: false
    default: project-observations
  destination_path:
    description: Relative path to write on the observation branch.
    required: true
  source_sha:
    description: Exact 40-character repository commit SHA that produced the observation.
    required: true
  github_token:
    description: Token with contents:write and actions:read for the repository.
    required: true
  commit_message:
    description: Optional commit message. Defaults to a source-SHA-bound publication message.
    required: false
    default: ""

outputs:
  changed:
    description: Whether publication created a new observation commit.
    value: ${{ steps.publish.outputs.changed }}
  commit_sha:
    description: Published observation commit SHA, or the existing branch SHA when unchanged.
    value: ${{ steps.publish.outputs.commit_sha }}

runs:
  using: composite
  steps:
    - name: Validate source and prepare artifact directory
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        OBSERVATION_ROOT: ${{ runner.temp }}/publish-observation
      run: |
        set -euo pipefail
        if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::source_sha must be an exact 40-character commit SHA." >&2
          exit 2
        fi
        rm -rf "$OBSERVATION_ROOT"
        mkdir -p "$OBSERVATION_ROOT"

    - name: Check out exact source revision
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.source_sha }}
        token: ${{ inputs.github_token }}
        persist-credentials: true
        fetch-depth: 1

    - name: Download observation artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/publish-observation

    - name: Publish durable observation
      id: publish
      shell: bash
      env:
        ARTIFACT_SOURCE_PATH: ${{ inputs.artifact_source_path }}
        OBSERVATION_BRANCH: ${{ inputs.branch }}
        DESTINATION_PATH: ${{ inputs.destination_path }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        OBSERVATION_ROOT: ${{ runner.temp }}/publish-observation
      run: |
        set -euo pipefail

        validate_relative_path() {
          local value="$1"
          local label="$2"
          if [[ -z "$value" || "$value" == /* || "$value" == ".." || "$value" == ../* || "$value" == */../* || "$value" == */.. ]]; then
            echo "::error::$label must be a non-empty relative path without parent traversal: $value" >&2
            exit 2
          fi
        }

        validate_relative_path "$ARTIFACT_SOURCE_PATH" "artifact_source_path"
        validate_relative_path "$DESTINATION_PATH" "destination_path"
        git check-ref-format --branch "$OBSERVATION_BRANCH" >/dev/null

        checked_out_sha="$(git rev-parse HEAD)"
        if [[ "${checked_out_sha,,}" != "${SOURCE_SHA,,}" ]]; then
          echo "::error::Checked-out revision $checked_out_sha does not match source_sha $SOURCE_SHA." >&2
          exit 2
        fi

        source_file="$OBSERVATION_ROOT/$ARTIFACT_SOURCE_PATH"
        if [[ ! -f "$source_file" ]]; then
          echo "::error::Observation file not found in artifact: $ARTIFACT_SOURCE_PATH" >&2
          exit 2
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        if git ls-remote --exit-code --heads origin "refs/heads/$OBSERVATION_BRANCH" >/dev/null 2>&1; then
          git fetch --depth=1 origin "refs/heads/$OBSERVATION_BRANCH"
          git switch -C "$OBSERVATION_BRANCH" FETCH_HEAD
        else
          git switch --orphan "$OBSERVATION_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
        fi

        mkdir -p "$(dirname "$DESTINATION_PATH")"
        cp "$source_file" "$DESTINATION_PATH"
        git add -- "$DESTINATION_PATH"

        if git diff --cached --quiet -- "$DESTINATION_PATH"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        message="$COMMIT_MESSAGE"
        if [[ -z "$message" ]]; then
          message="Publish observation for ${SOURCE_SHA}"
        fi

        git commit -m "$message"
        git push origin "HEAD:refs/heads/$OBSERVATION_BRANCH"

        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
